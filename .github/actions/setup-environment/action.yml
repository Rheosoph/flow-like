name: 'Setup Rust Build Environment'
description: 'Installs native build dependencies and restores the Rust cache for a compatible workload.'

inputs:
  repo-token:
    description: 'GitHub token'
    required: true
  cache-key:
    description: 'Stable cache family shared by PR checks and dev branch builds'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Cleanup environment
      run: |
        sudo apt-get remove -y '^dotnet-.*'
        sudo apt-get remove -y 'php.*'
        sudo apt-get remove -y '^mongodb-.*'
        sudo apt-get remove -y '^mysql-.*'
        sudo apt-get remove -y azure-cli firefox powershell mono-devel libgl1-mesa-dri
        sudo apt-get autoremove -y
        sudo apt-get clean
        sudo rm -rf /usr/share/dotnet/
        sudo rm -rf /usr/local/graalvm/
        sudo rm -rf /usr/local/.ghcup/
        sudo rm -rf /usr/local/share/powershell
        sudo rm -rf /usr/local/lib/android
      shell: bash

    - name: Install and cache dependencies
      uses: awalsh128/cache-apt-pkgs-action@latest
      with:
        packages: libgtk-3-dev libclang-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev pkg-config webkit2gtk-4.1 libglib2.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev ocl-icd-libopencl1 ocl-icd-opencl-dev libudev-dev
        version: 2.0

    - name: Ensure SPA headers satisfy libspa
      if: runner.os == 'Linux'
      run: .github/scripts/ensure-spa-headers.sh
      shell: bash

    - name: Ensure OpenCL linker symlink
      run: |
        lib_dir="/usr/lib/$(dpkg-architecture -qDEB_HOST_MULTIARCH)"
        if [ ! -e "$lib_dir/libOpenCL.so" ] && [ -e "$lib_dir/libOpenCL.so.1" ]; then
          sudo ln -sf "$lib_dir/libOpenCL.so.1" "$lib_dir/libOpenCL.so"
        fi
        test -e "$lib_dir/libOpenCL.so"
      shell: bash

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      with:
        toolchain: 1.97.1

    - name: Configure CI Rust builds
      run: echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
      shell: bash

    - name: Cache Cargo registry, git checkouts, and build artifacts
      uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
      with:
        # PR merge-ref caches cannot be reused by sibling PRs. Only successful
        # dev builds publish archives; PRs restore those compatible dependencies.
        shared-key: workspace-v2-${{ runner.arch }}-${{ inputs.cache-key }}
        save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
        cache-on-failure: false
        cache-bin: false

    - name: Install Protoc
      uses: arduino/setup-protoc@f4d5893b897028ff5739576ea0409746887fa536 # v3.0.0
      with:
        repo-token: ${{ inputs.repo-token }}
