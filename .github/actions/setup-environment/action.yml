name: 'Setup Rust Build Environment'
description: 'Installs native build dependencies and restores the Rust cache for a compatible workload.'

inputs:
  repo-token:
    description: 'GitHub token'
    required: true
  cache-key:
    description: 'Stable cache family shared by PR checks and dev branch builds'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Cleanup environment
      run: |
        sudo apt-get remove -y '^dotnet-.*'
        sudo apt-get remove -y 'php.*'
        sudo apt-get remove -y '^mongodb-.*'
        sudo apt-get remove -y '^mysql-.*'
        sudo apt-get remove -y azure-cli firefox powershell mono-devel libgl1-mesa-dri
        sudo apt-get autoremove -y
        sudo apt-get clean
        sudo rm -rf /usr/share/dotnet/
        sudo rm -rf /usr/local/graalvm/
        sudo rm -rf /usr/local/.ghcup/
        sudo rm -rf /usr/local/share/powershell
        sudo rm -rf /usr/local/lib/android
      shell: bash

    - name: Select native build packages
      id: apt-packages
      # librdkafka 2.12.1 includes curl headers even when curl support is disabled.
      run: echo "list=libgtk-3-dev libclang-dev libcurl4-openssl-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev pkg-config libglib2.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev ocl-icd-libopencl1 ocl-icd-opencl-dev libudev-dev" >> "$GITHUB_OUTPUT"
      shell: bash

    # cache-apt-pkgs-action never refreshes the lists on GitHub runners and keys
    # its cache on the versions they name. Once the mirror drops those versions
    # the install 404s, and the action still saves an empty cache under the key.
    - name: Refresh apt package lists
      run: sudo apt-get -o Acquire::Retries=3 update
      shell: bash

    - name: Install and cache dependencies
      id: apt-cache
      uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
      with:
        packages: ${{ steps.apt-packages.outputs.list }}
        version: 2.0

    # The all-packages manifest is written only after a successful install, so
    # an empty list means this run restored (or just saved) an empty cache.
    - name: Install packages the apt cache did not provide
      if: steps.apt-cache.outputs.all-package-version-list == ''
      env:
        PACKAGES: ${{ steps.apt-packages.outputs.list }}
      run: |
        echo "::warning::The apt cache provided no packages; installing from the archive. Remove the empty entry with: gh cache delete cache-apt-pkgs_${CACHE_KEY}"
        # shellcheck disable=SC2086
        sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y --no-install-recommends $PACKAGES
      shell: bash

    - name: Ensure SPA headers satisfy libspa
      if: runner.os == 'Linux'
      run: .github/scripts/ensure-spa-headers.sh
      shell: bash

    - name: Ensure OpenCL linker symlink
      run: |
        lib_dir="/usr/lib/$(dpkg-architecture -qDEB_HOST_MULTIARCH)"
        if [ ! -e "$lib_dir/libOpenCL.so" ] && [ -e "$lib_dir/libOpenCL.so.1" ]; then
          sudo ln -sf "$lib_dir/libOpenCL.so.1" "$lib_dir/libOpenCL.so"
        fi
        test -e "$lib_dir/libOpenCL.so"
      shell: bash

    - name: Install Rust toolchain
      uses: ./.github/actions/setup-rust

    - name: Configure CI Rust builds
      run: echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
      shell: bash

    - name: Cache Cargo registry, git checkouts, and build artifacts
      uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
      with:
        # PR merge-ref caches cannot be reused by sibling PRs. Only dev builds
        # publish archives; PRs restore those compatible dependencies.
        shared-key: workspace-v2-${{ runner.arch }}-${{ inputs.cache-key }}
        save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
        # A red dev branch must still publish third-party artifacts. rust-cache
        # prunes workspace crates before saving, so a first-party lint or test
        # failure cannot poison the archive.
        cache-on-failure: true
        # Keeping registry/src avoids re-extracting ~1900 .crate archives per job.
        cache-all-crates: true
        cache-bin: false

    - name: Install Protoc
      uses: arduino/setup-protoc@f4d5893b897028ff5739576ea0409746887fa536 # v3.0.0
      with:
        repo-token: ${{ inputs.repo-token }}
