name: 'Setup Environment'
description: 'Sets up the environment for building the project, including dependencies, caches, and tools.'

inputs:
  repo-token:
    description: 'GitHub token'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Cleanup environment
      run: |
        sudo apt-get remove -y '^dotnet-.*'
        sudo apt-get remove -y 'php.*'
        sudo apt-get remove -y '^mongodb-.*'
        sudo apt-get remove -y '^mysql-.*'
        sudo apt-get remove -y azure-cli firefox powershell mono-devel libgl1-mesa-dri
        sudo apt-get autoremove -y
        sudo apt-get clean
        sudo rm -rf /usr/share/dotnet/
        sudo rm -rf /usr/local/graalvm/
        sudo rm -rf /usr/local/.ghcup/
        sudo rm -rf /usr/local/share/powershell
        sudo rm -rf /usr/local/lib/android
      shell: bash

    - name: Install and cache dependencies
      uses: awalsh128/cache-apt-pkgs-action@latest
      with:
        packages: libgtk-3-dev libclang-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev pkg-config protobuf-compiler webkit2gtk-4.1 libglib2.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev ocl-icd-libopencl1 ocl-icd-opencl-dev libudev-dev
        version: 1.0

    - name: Ensure OpenCL linker symlink
      run: |
        lib_dir="/usr/lib/$(dpkg-architecture -qDEB_HOST_MULTIARCH)"
        if [ ! -e "$lib_dir/libOpenCL.so" ] && [ -e "$lib_dir/libOpenCL.so.1" ]; then
          sudo ln -sf "$lib_dir/libOpenCL.so.1" "$lib_dir/libOpenCL.so"
        fi
        test -e "$lib_dir/libOpenCL.so"
      shell: bash

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.97.1
        targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

    - name: Configure CI Rust builds
      run: echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
      shell: bash

    - name: Cache Cargo registry, git checkouts, and build artifacts
      uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
      with:
        # Keep concurrent test/clippy/fmt jobs from racing to publish different
        # immutable target archives while retaining warm caches per workflow.
        shared-key: workspace-${{ runner.arch }}-${{ github.job }}
        cache-on-failure: true

    - name: Cache Bun dependencies
      uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
      with:
        path: |
          ~/.bun
        key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
        restore-keys: ${{ runner.os }}-bun-

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install Protoc
      uses: arduino/setup-protoc@v3
      with:
        repo-token: ${{ inputs.repo-token }}

    - name: Install Bun
      run: npm install -g bun
      shell: bash

    - name: Install frontend dependencies
      run: bun install --frozen-lockfile
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.repo-token }}
