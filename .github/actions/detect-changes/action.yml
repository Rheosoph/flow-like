name: Detect CI changes
description: Selects CI workloads from the complete Git diff, with all checks enabled when comparison is unavailable.

outputs:
  rust:
    description: Whether Rust build inputs changed
    value: ${{ steps.changes.outputs.rust }}
  bun:
    description: Whether package manager policy or dependency manifests changed
    value: ${{ steps.changes.outputs.bun }}
  dsql:
    description: Whether DSQL migrations or their generator changed
    value: ${{ steps.changes.outputs.dsql }}
  browser:
    description: Whether the browser crate, the automation nodes, a local crate they depend on or the toolchain changed
    value: ${{ steps.changes.outputs.browser }}

  ui:
    description: Whether the shared UI package, its locales, the docs corpus or the frontend dependencies changed
    value: ${{ steps.changes.outputs.ui }}
  azure_migrations:
    description: Whether Azure migrations, Prisma inputs or their package dependencies changed
    value: ${{ steps.changes.outputs.azure_migrations }}
  compiler:
    description: Whether compiler configuration, build manifests or reproducibility checks changed
    value: ${{ steps.changes.outputs.compiler }}
  containers:
    description: Whether container images or their validation inputs changed
    value: ${{ steps.changes.outputs.containers }}

runs:
  using: composite
  steps:
    - name: Classify changed files
      id: changes
      shell: bash
      run: python3 "$GITHUB_ACTION_PATH/../../scripts/detect-ci-changes.py"
