name: Standalone release bundle

on:
  workflow_dispatch:
    inputs:
      sequence:
        description: Unused sequence greater than the published sequence; also bump the agent version in apps/standalone/Cargo.toml
        required: true
        type: string
      validity_days:
        description: Days the signed release stays valid, 1 to 1825 (agents of release 0.1.0 accept at most 30)
        required: false
        default: '365'
        type: string
      artifact_base_url:
        description: Optional override matching STANDALONE_RELEASE_PUBLIC_BASE_URL
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: standalone-release
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: '0'
  CARGO_NET_RETRY: '10'
  CARGO_PROFILE_RELEASE_DEBUG: '0'
  CARGO_PROFILE_RELEASE_STRIP: debuginfo
  DOCKER_BUILD_SUMMARY: 'false'
  DOCKER_BUILD_RECORD_UPLOAD: 'false'

jobs:
  prepare:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    outputs:
      epoch: ${{ steps.inputs.outputs.epoch }}
      sequence: ${{ steps.inputs.outputs.sequence }}
      base: ${{ steps.inputs.outputs.base }}
      image: ${{ steps.inputs.outputs.image }}
      validity_days: ${{ steps.inputs.outputs.validity_days }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: inputs
        env:
          RELEASE_SEQUENCE: ${{ inputs.sequence }}
          RELEASE_VALIDITY_DAYS: ${{ inputs.validity_days }}
          RELEASE_ARTIFACT_BASE: ${{ inputs.artifact_base_url || vars.STANDALONE_RELEASE_PUBLIC_BASE_URL }}
          RELEASE_CONFIGURED_BASE: ${{ vars.STANDALONE_RELEASE_PUBLIC_BASE_URL }}
          RELEASE_BUCKET: ${{ vars.STANDALONE_RELEASE_BUCKET }}
          RELEASE_PREFIX: ${{ vars.STANDALONE_RELEASE_PREFIX }}
          RELEASE_PUBLIC_KEYS: ${{ vars.STANDALONE_RELEASE_PUBLIC_KEYS }}
          RELEASE_REGION: ${{ vars.STANDALONE_RELEASE_REGION }}
        # Signing and publisher secrets live in the standalone-release environment and are
        # validated by the jobs that are allowed to read them.
        run: |
          python3 - <<'PY'
          import os, subprocess, json, base64, re, tomllib, importlib.util
          from urllib.parse import urlsplit
          spec = importlib.util.spec_from_file_location('release', '.github/scripts/standalone_release.py')
          release = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(release)
          sequence = int(os.environ['RELEASE_SEQUENCE'])
          try:
              validity_days = int(os.environ['RELEASE_VALIDITY_DAYS'])
              release.validity(validity_days)
          except ValueError as error:
              raise SystemExit(f'Invalid validity_days: {error}')
          with open('apps/standalone/Cargo.toml', 'rb') as manifest:
              version = tomllib.load(manifest)['package']['version']
          if not isinstance(version, str) or not re.fullmatch(r'[0-9A-Za-z.+-]{1,64}', version):
              raise SystemExit('apps/standalone/Cargo.toml must state the agent version as a literal')
          base = os.environ['RELEASE_ARTIFACT_BASE']
          parsed = urlsplit(base)
          if base != os.environ['RELEASE_CONFIGURED_BASE'] or not base:
              raise SystemExit('Configure STANDALONE_RELEASE_PUBLIC_BASE_URL; the workflow override must match it')
          for name in ['RELEASE_BUCKET', 'RELEASE_PREFIX', 'RELEASE_PUBLIC_KEYS', 'RELEASE_REGION']:
              if not os.environ[name]:
                  raise SystemExit(f'Missing publisher configuration: {name}')
          if not re.fullmatch(r'[A-Za-z0-9_-]+(?:/[A-Za-z0-9_-]+)*', os.environ['RELEASE_PREFIX']):
              raise SystemExit('Invalid STANDALONE_RELEASE_PREFIX')
          keys = json.loads(os.environ['RELEASE_PUBLIC_KEYS'])
          if not isinstance(keys, list) or not 1 <= len(keys) <= 8 or any(not isinstance(k, str) or not re.fullmatch(r'[A-Za-z0-9_-]{43}', k) or len(base64.urlsafe_b64decode(k + '=')) != 32 for k in keys):
              raise SystemExit('STANDALONE_RELEASE_PUBLIC_KEYS must be a JSON array of raw Ed25519 base64url public keys')
          if not 0 < sequence <= 9007199254740991:
              raise SystemExit('Invalid release sequence')
          if parsed.scheme != 'https' or not parsed.netloc or parsed.username or parsed.password or parsed.query or parsed.fragment or base.endswith('/') or len(base) > 800 or any(c.isspace() for c in base):
              raise SystemExit('Expected a direct HTTPS artifact prefix')
          epoch = subprocess.check_output(['git', 'show', '-s', '--format=%ct', 'HEAD'], text=True).strip()
          image = 'ghcr.io/' + os.environ['GITHUB_REPOSITORY'].lower() + '-standalone'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'epoch={epoch}\nsequence={sequence}\nbase={base}\nimage={image}\nvalidity_days={validity_days}\nversion={version}\n')
          PY
      - run: python3 -m unittest discover -s .github/scripts/tests -p 'test_standalone_release*.py'
      - name: Refuse a sequence that is already published or partly uploaded, and an agent version that was not bumped
        env:
          RELEASE_BASE: ${{ steps.inputs.outputs.base }}
          RELEASE_SEQUENCE: ${{ steps.inputs.outputs.sequence }}
          RELEASE_VERSION: ${{ steps.inputs.outputs.version }}
          RELEASE_PUBLIC_KEYS: ${{ vars.STANDALONE_RELEASE_PUBLIC_KEYS }}
        run: python3 .github/scripts/standalone_release.py preflight --base-url "$RELEASE_BASE" --sequence "$RELEASE_SEQUENCE" --public-keys "$RELEASE_PUBLIC_KEYS" --release-version "$RELEASE_VERSION"

  frontend:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.epoch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3
        with:
          bun-version: 1.3.8
      - name: Build embedded frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          bun install --frozen-lockfile
          bun test ./.github/scripts/tests/standalone-package.test.ts
          bun test packages/ui/lib/device-package.test.ts
          bun test ./packages/ui/components/settings/devices/setup/setup-wizard.dom.test.tsx
          bun run --cwd apps/standalone build:frontend
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: embedded-frontend
          path: apps/standalone/frontend/out/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  binaries:
    needs: [prepare, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            arch: amd64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            arch: arm64
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            arch: ''
          - target: aarch64-apple-darwin
            runner: macos-15
            arch: ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.epoch }}
      RELEASE_TARGET: ${{ matrix.target }}
      RELEASE_ARCH: ${{ matrix.arch }}
      CC: clang
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - name: Remap build paths in release binaries
        shell: bash
        run: echo "RUSTFLAGS=--remap-path-prefix=$GITHUB_WORKSPACE=/src --remap-path-prefix=$RUNNER_TEMP=/build" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Free Linux runner disk
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld cmake pkg-config protobuf-compiler libssl-dev libclang-dev libdbus-1-dev libasound2-dev libudev-dev libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev libvulkan-dev ocl-icd-opencl-dev
      - name: Install macOS native dependencies
        if: runner.os == 'macOS'
        run: brew install cmake pkg-config protobuf
      - name: Configure macOS ONNX Runtime
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # ort does not publish Intel macOS binaries; the vendored static archive supports both architectures.
          echo "ORT_LIB_LOCATION=${GITHUB_WORKSPACE}/apps/desktop/src-tauri/gen/apple/thirdparty/onnxruntime.xcframework/macos-arm64_x86_64" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=14.0" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
      - name: Restore compiled release dependencies
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
        with:
          workspaces: '. -> target'
          shared-key: standalone-release-v1-${{ matrix.target }}
          cache-workspace-crates: true
          cache-bin: false
          cache-on-failure: true
          env-vars: 'CARGO CC CFLAGS CXX CMAKE RUST ORT ImageOS ImageVersion MACOSX_DEPLOYMENT_TARGET SDKROOT'
      - name: Download shared embedded frontend
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: embedded-frontend
          path: apps/standalone/frontend/out/
      - name: Build the release binary and validate its runtime metadata
        shell: bash
        run: |
          cargo build --locked --release --package flow-like-standalone --features frontend --target "$RELEASE_TARGET"
          python3 .github/scripts/standalone_release.py describe --binary "$CARGO_TARGET_DIR/$RELEASE_TARGET/release/flow-like-standalone" --target "$RELEASE_TARGET" --output "$RUNNER_TEMP/release-artifacts"
      - name: Assemble Linux container runtime from the exact binary and resolved libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 .github/scripts/standalone_release.py rootfs --binary "$RUNNER_TEMP/release-artifacts/flow-like-standalone-$RELEASE_TARGET" --output "$RUNNER_TEMP/rootfs-$RELEASE_ARCH" --epoch "$SOURCE_DATE_EPOCH"
          mv "$RUNNER_TEMP/rootfs-$RELEASE_ARCH.tar" "$RUNNER_TEMP/release-artifacts/"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: standalone-${{ matrix.target }}
          path: ${{ runner.temp }}/release-artifacts/
          retention-days: 7
          if-no-files-found: error

  container:
    needs: [prepare, binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: standalone-*-unknown-linux-gnu
          path: downloaded
          merge-multiple: true
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare isolated image context
        run: |
          mkdir -p image-context/rootfs
          cp apps/standalone/packaging/Dockerfile image-context/Dockerfile
          cp downloaded/rootfs-amd64.tar image-context/rootfs/amd64.tar
          cp downloaded/rootfs-arm64.tar image-context/rootfs/arm64.tar
      - id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: image-context
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: SOURCE_DATE_EPOCH=${{ needs.prepare.outputs.epoch }}
          tags: ${{ needs.prepare.outputs.image }}:sequence-${{ needs.prepare.outputs.sequence }}

  signed-bundle:
    needs: [prepare, binaries, container]
    runs-on: ubuntu-24.04
    environment: standalone-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: standalone-*
          path: release-bundle
          merge-multiple: true
      - uses: ./.github/actions/setup-rust
      - name: Bind binary hashes and exact container digest
        env:
          ARTIFACT_BASE: ${{ needs.prepare.outputs.base }}
          RELEASE_SEQUENCE: ${{ needs.prepare.outputs.sequence }}
          RELEASE_VALIDITY_DAYS: ${{ needs.prepare.outputs.validity_days }}
          RELEASE_IMAGE: ${{ needs.prepare.outputs.image }}@${{ needs.container.outputs.digest }}
        run: python3 .github/scripts/standalone_release.py manifest --artifacts release-bundle --base-url "$ARTIFACT_BASE/releases/$RELEASE_SEQUENCE" --sequence "$RELEASE_SEQUENCE" --image "$RELEASE_IMAGE" --validity-days "$RELEASE_VALIDITY_DAYS" --output release-bundle/release.json
      # Build scripts and proc macros run here, before any key material exists on the runner.
      - name: Build the release signer
        run: CARGO_TARGET_DIR="$RUNNER_TEMP/release-signer" cargo build --locked --package flow-like-device-protocol --example sign-release
      - name: Sign the release manifest using the configured private release key
        env:
          STANDALONE_RELEASE_SIGNING_KEY: ${{ secrets.STANDALONE_RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$STANDALONE_RELEASE_SIGNING_KEY" ]; then
            echo "::error::Configure STANDALONE_RELEASE_SIGNING_KEY as a secret of the standalone-release environment"
            exit 1
          fi
          python3 - <<'PY'
          import os
          path = os.path.join(os.environ['RUNNER_TEMP'], 'standalone-signing-key')
          with open(os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600), 'w') as key:
              key.write(os.environ['STANDALONE_RELEASE_SIGNING_KEY'])
          PY
          unset STANDALONE_RELEASE_SIGNING_KEY
          trap 'rm -f "$RUNNER_TEMP/standalone-signing-key"' EXIT
          "$RUNNER_TEMP/release-signer/debug/examples/sign-release" "$RUNNER_TEMP/standalone-signing-key" release-bundle/release.json release-bundle/release.jws
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: standalone-signed-release-${{ needs.prepare.outputs.sequence }}
          path: release-bundle/
          retention-days: 30
          if-no-files-found: error


  publish:
    needs: [prepare, signed-bundle, runtime-publish]
    runs-on: ubuntu-24.04
    environment: standalone-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: standalone-signed-release-${{ needs.prepare.outputs.sequence }}
          path: release-bundle
      - name: Require exactly one publisher identity
        env:
          RELEASE_ROLE: ${{ vars.STANDALONE_RELEASE_ROLE_ARN }}
          RELEASE_ACCESS_KEY_PRESENT: ${{ secrets.STANDALONE_RELEASE_ACCESS_KEY_ID != '' }}
          RELEASE_SECRET_KEY_PRESENT: ${{ secrets.STANDALONE_RELEASE_SECRET_ACCESS_KEY != '' }}
        run: |
          python3 - <<'PY'
          import os
          access = os.environ['RELEASE_ACCESS_KEY_PRESENT'] == 'true'
          secret = os.environ['RELEASE_SECRET_KEY_PRESENT'] == 'true'
          if access != secret or bool(os.environ['RELEASE_ROLE']) == (access and secret):
              raise SystemExit('Configure one publisher identity: STANDALONE_RELEASE_ROLE_ARN or both dedicated S3 access-key secrets of the standalone-release environment')
          PY
      - name: Obtain short-lived AWS publisher credentials
        if: vars.STANDALONE_RELEASE_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ vars.STANDALONE_RELEASE_ROLE_ARN }}
          aws-region: ${{ vars.STANDALONE_RELEASE_REGION }}
          role-session-name: standalone-release-${{ github.run_id }}
      - name: Verify anonymous images, publish binaries, then conditionally advance the signed manifest
        env:
          RELEASE_BASE: ${{ needs.prepare.outputs.base }}
          RELEASE_BUCKET: ${{ vars.STANDALONE_RELEASE_BUCKET }}
          RELEASE_PREFIX: ${{ vars.STANDALONE_RELEASE_PREFIX }}
          RELEASE_PUBLIC_KEYS: ${{ vars.STANDALONE_RELEASE_PUBLIC_KEYS }}
          RELEASE_ENDPOINT: ${{ secrets.STANDALONE_RELEASE_S3_ENDPOINT }}
          AWS_REGION: ${{ vars.STANDALONE_RELEASE_REGION }}
          RELEASE_S3_ACCESS_KEY_ID: ${{ secrets.STANDALONE_RELEASE_ACCESS_KEY_ID }}
          RELEASE_S3_SECRET_ACCESS_KEY: ${{ secrets.STANDALONE_RELEASE_SECRET_ACCESS_KEY }}
          RELEASE_S3_SESSION_TOKEN: ${{ secrets.STANDALONE_RELEASE_SESSION_TOKEN }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          python3 - <<'PY'
          import importlib.util, os
          from pathlib import Path
          if os.environ.get('RELEASE_S3_ACCESS_KEY_ID'):
              os.environ['AWS_ACCESS_KEY_ID'] = os.environ.pop('RELEASE_S3_ACCESS_KEY_ID')
              os.environ['AWS_SECRET_ACCESS_KEY'] = os.environ.pop('RELEASE_S3_SECRET_ACCESS_KEY')
              if os.environ.get('RELEASE_S3_SESSION_TOKEN'):
                  os.environ['AWS_SESSION_TOKEN'] = os.environ.pop('RELEASE_S3_SESSION_TOKEN')
          spec = importlib.util.spec_from_file_location('release', '.github/scripts/standalone_release.py')
          release = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(release)
          release.publish(Path('release-bundle'), os.environ['RELEASE_BASE'], os.environ['RELEASE_BUCKET'], os.environ['RELEASE_PREFIX'], os.environ['RELEASE_PUBLIC_KEYS'], os.environ.get('RELEASE_ENDPOINT') or None)
          PY
      - name: State the release number, version, end date and the next step
        env:
          RELEASE_PUBLIC_KEYS: ${{ vars.STANDALONE_RELEASE_PUBLIC_KEYS }}
        run: python3 .github/scripts/standalone_release.py summary --artifacts release-bundle --public-keys "$RELEASE_PUBLIC_KEYS" >> "$GITHUB_STEP_SUMMARY"

  # Runtime packs (llama.cpp, MLX) that agents install on demand. Every pack is started on its
  # own platform before packing; a failed pack keeps the whole set unsigned.
  runtime-packs:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - pack: llamacpp-macos-arm64-metal
            runner: macos-15
          - pack: llamacpp-macos-x64-cpu
            runner: macos-15-intel
          - pack: llamacpp-linux-x64-cpu
            runner: ubuntu-22.04
          - pack: llamacpp-linux-x64-vulkan
            runner: ubuntu-22.04
          - pack: llamacpp-linux-arm64-cpu
            runner: ubuntu-22.04-arm
          - pack: mlx-macos-arm64-metal
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.epoch }}
      RUNTIME_PACK: ${{ matrix.pack }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: linux-inputs
        name: Read the pinned Linux image, Ubuntu snapshot and compiler cache key
        if: runner.os == 'Linux'
        run: python3 .github/scripts/runtime_toolchain.py pins >> "$GITHUB_OUTPUT"
      - name: Restore the pinned native arm64 C and C++ compiler
        if: matrix.pack == 'llamacpp-linux-arm64-cpu'
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ${{ runner.temp }}/runtime-toolchain
          key: runtime-gcc-arm64-${{ steps.linux-inputs.outputs.key }}
      - name: Build and check Linux packs in the frozen Ubuntu 22.04 environment
        if: runner.os == 'Linux'
        env:
          RUNTIME_IMAGE: ${{ steps.linux-inputs.outputs.image }}
          UBUNTU_SNAPSHOT: ${{ steps.linux-inputs.outputs.snapshot }}
        run: |
          mkdir -p "$RUNNER_TEMP/runtime-toolchain"
          docker run --rm --volume "$PWD:/work:ro" --volume "$RUNNER_TEMP:/scratch" \
            --volume "$RUNNER_TEMP/runtime-toolchain:/toolchain" \
            --volume /etc/ssl/certs/ca-certificates.crt:/bootstrap-ca.crt:ro \
            --env RUNTIME_PACK --env SOURCE_DATE_EPOCH --env UBUNTU_SNAPSHOT \
            "$RUNTIME_IMAGE" bash /work/.github/scripts/build_linux_runtime.sh
      - id: pin
        name: Read the pinned llama.cpp build
        run: python3 .github/scripts/runtime_packs.py pin >> "$GITHUB_OUTPUT"
      - name: Download the pinned upstream llama.cpp archive and check its digest
        if: startsWith(matrix.pack, 'llamacpp-') && runner.os == 'macOS'
        run: |
          source="$(python3 .github/scripts/runtime_packs.py fetch --pack "$RUNTIME_PACK" --output "$RUNNER_TEMP/upstream")"
          echo "LLAMACPP_SOURCE=$source" >> "$GITHUB_ENV"
      - name: Pack llama.cpp after bundling, closure, glibc floor and start checks
        if: startsWith(matrix.pack, 'llamacpp-') && runner.os == 'macOS'
        run: python3 .github/scripts/runtime_packs.py llamacpp --pack "$RUNTIME_PACK" --source "$LLAMACPP_SOURCE" --epoch "$SOURCE_DATE_EPOCH" --output "$RUNNER_TEMP/runtime-packs"
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3
        if: matrix.pack == 'mlx-macos-arm64-metal'
        with:
          bun-version: 1.3.8
      - name: Build the MLX helper and pack it with its resources and Swift back-deployment libraries
        if: matrix.pack == 'mlx-macos-arm64-metal'
        run: |
          bun ./apps/desktop/scripts/prepare-mlx.ts --configuration Release
          python3 .github/scripts/runtime_packs.py mlx \
            --executable apps/desktop/src-tauri/binaries/mac/arm/flow-like-mlx-service-aarch64-apple-darwin \
            --resources apps/desktop/src-tauri/binaries/mac/arm/mlx-resources \
            --toolchain "$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib" \
            --notices apps/desktop/src-tauri/assets/THIRD-PARTY-NOTICES.txt \
            --build "g$(git rev-parse --short=12 HEAD:apps/desktop/src-tauri/apple/FlowLikeMLX)" \
            --epoch "$SOURCE_DATE_EPOCH" --output "$RUNNER_TEMP/runtime-packs"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-pack-${{ matrix.pack }}
          path: ${{ runner.temp }}/runtime-packs/
          retention-days: 7
          if-no-files-found: error

  runtime-manifest:
    needs: [prepare, runtime-packs]
    runs-on: ubuntu-24.04
    environment: standalone-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s .github/scripts/tests -p 'test_runtime*.py'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: runtime-pack-*
          path: runtime-bundle
          merge-multiple: true
      - name: Bind every pack's archive and file digests into one unsigned manifest per target
        env:
          ARTIFACT_BASE: ${{ needs.prepare.outputs.base }}
          RELEASE_SEQUENCE: ${{ needs.prepare.outputs.sequence }}
          RELEASE_VALIDITY_DAYS: ${{ needs.prepare.outputs.validity_days }}
        run: python3 .github/scripts/runtime_packs.py manifest --packs runtime-bundle --base-url "$ARTIFACT_BASE/releases/$RELEASE_SEQUENCE/runtimes" --sequence "$RELEASE_SEQUENCE" --validity-days "$RELEASE_VALIDITY_DAYS" --output runtime-bundle
      - uses: ./.github/actions/setup-rust
      # Build scripts and proc macros run here, before any key material exists on the runner.
      - name: Build the runtime manifest signer
        run: CARGO_TARGET_DIR="$RUNNER_TEMP/release-signer" cargo build --locked --package flow-like-device-protocol --example sign-runtime-manifest
      - name: Sign the runtime manifests using the configured private release key
        env:
          STANDALONE_RELEASE_SIGNING_KEY: ${{ secrets.STANDALONE_RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$STANDALONE_RELEASE_SIGNING_KEY" ]; then
            echo "::error::Configure STANDALONE_RELEASE_SIGNING_KEY as a secret of the standalone-release environment"
            exit 1
          fi
          python3 - <<'PY'
          import os
          path = os.path.join(os.environ['RUNNER_TEMP'], 'standalone-signing-key')
          with open(os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600), 'w') as key:
              key.write(os.environ['STANDALONE_RELEASE_SIGNING_KEY'])
          PY
          unset STANDALONE_RELEASE_SIGNING_KEY
          trap 'rm -f "$RUNNER_TEMP/standalone-signing-key"' EXIT
          for manifest in runtime-bundle/*.json; do
            "$RUNNER_TEMP/release-signer/debug/examples/sign-runtime-manifest" "$RUNNER_TEMP/standalone-signing-key" "$manifest" "${manifest%.json}.jws"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-signed-${{ needs.prepare.outputs.sequence }}
          path: runtime-bundle/
          retention-days: 30
          if-no-files-found: error

  # Publish the matching runtimes before agents adopt this release's rollback floor.
  runtime-publish:
    needs: [prepare, runtime-manifest]
    runs-on: ubuntu-24.04
    environment: standalone-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: runtime-signed-${{ needs.prepare.outputs.sequence }}
          path: runtime-bundle
      - name: Require exactly one publisher identity
        env:
          RELEASE_ROLE: ${{ vars.STANDALONE_RELEASE_ROLE_ARN }}
          RELEASE_ACCESS_KEY_PRESENT: ${{ secrets.STANDALONE_RELEASE_ACCESS_KEY_ID != '' }}
          RELEASE_SECRET_KEY_PRESENT: ${{ secrets.STANDALONE_RELEASE_SECRET_ACCESS_KEY != '' }}
        run: |
          python3 - <<'PY'
          import os
          access = os.environ['RELEASE_ACCESS_KEY_PRESENT'] == 'true'
          secret = os.environ['RELEASE_SECRET_KEY_PRESENT'] == 'true'
          if access != secret or bool(os.environ['RELEASE_ROLE']) == (access and secret):
              raise SystemExit('Configure one publisher identity: STANDALONE_RELEASE_ROLE_ARN or both dedicated S3 access-key secrets of the standalone-release environment')
          PY
      - name: Obtain short-lived AWS publisher credentials
        if: vars.STANDALONE_RELEASE_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ vars.STANDALONE_RELEASE_ROLE_ARN }}
          aws-region: ${{ vars.STANDALONE_RELEASE_REGION }}
          role-session-name: standalone-runtime-packs-${{ github.run_id }}
      - name: Publish runtime packs, then conditionally advance each target's signed runtime manifest
        env:
          RELEASE_BASE: ${{ needs.prepare.outputs.base }}
          RELEASE_BUCKET: ${{ vars.STANDALONE_RELEASE_BUCKET }}
          RELEASE_PREFIX: ${{ vars.STANDALONE_RELEASE_PREFIX }}
          RELEASE_PUBLIC_KEYS: ${{ vars.STANDALONE_RELEASE_PUBLIC_KEYS }}
          RELEASE_ENDPOINT: ${{ secrets.STANDALONE_RELEASE_S3_ENDPOINT }}
          AWS_REGION: ${{ vars.STANDALONE_RELEASE_REGION }}
          RELEASE_S3_ACCESS_KEY_ID: ${{ secrets.STANDALONE_RELEASE_ACCESS_KEY_ID }}
          RELEASE_S3_SECRET_ACCESS_KEY: ${{ secrets.STANDALONE_RELEASE_SECRET_ACCESS_KEY }}
          RELEASE_S3_SESSION_TOKEN: ${{ secrets.STANDALONE_RELEASE_SESSION_TOKEN }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          python3 - <<'PY'
          import importlib.util, json, os
          from pathlib import Path
          if os.environ.get('RELEASE_S3_ACCESS_KEY_ID'):
              os.environ['AWS_ACCESS_KEY_ID'] = os.environ.pop('RELEASE_S3_ACCESS_KEY_ID')
              os.environ['AWS_SECRET_ACCESS_KEY'] = os.environ.pop('RELEASE_S3_SECRET_ACCESS_KEY')
              if os.environ.get('RELEASE_S3_SESSION_TOKEN'):
                  os.environ['AWS_SESSION_TOKEN'] = os.environ.pop('RELEASE_S3_SESSION_TOKEN')
          spec = importlib.util.spec_from_file_location('runtime', '.github/scripts/runtime_packs.py')
          runtime = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(runtime)
          print(json.dumps(runtime.publish(Path('runtime-bundle'), os.environ['RELEASE_BASE'], os.environ['RELEASE_BUCKET'], os.environ['RELEASE_PREFIX'], os.environ['RELEASE_PUBLIC_KEYS'], os.environ.get('RELEASE_ENDPOINT') or None)))
          PY
      - name: State the published runtime packs and when their signed lists end
        env:
          RELEASE_PUBLIC_KEYS: ${{ vars.STANDALONE_RELEASE_PUBLIC_KEYS }}
        run: python3 .github/scripts/runtime_packs.py summary --artifacts runtime-bundle --public-keys "$RELEASE_PUBLIC_KEYS" >> "$GITHUB_STEP_SUMMARY"
