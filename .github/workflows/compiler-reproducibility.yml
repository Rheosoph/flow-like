name: Compiler reproducibility

on:
  pull_request:
    branches: [dev]
    paths:
      - '.github/**'
      - '**/rust-toolchain*'
      - '**/mise.toml'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '**/Dockerfile*'
      - '**/*.Dockerfile'
      - 'apps/desktop/src-tauri/gen/apple/**'
  push:
    branches: [dev]
    paths:
      - '.github/**'
      - '**/rust-toolchain*'
      - '**/mise.toml'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '**/Dockerfile*'
      - '**/*.Dockerfile'
      - 'apps/desktop/src-tauri/gen/apple/**'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  configuration:
    name: Check compiler configuration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python .github/scripts/check_rust_toolchain.py
      - run: python -m unittest discover -s .github/scripts/tests -p 'test*compiler*.py'
      - run: python -m unittest discover -s .github/scripts/tests -p 'test*rust_toolchain*.py'

  optimized-rebuilds:
    name: Optimized rebuilds (${{ matrix.target }})
    needs: configuration
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
      - name: Compare four independent optimized builds
        run: >-
          python .github/scripts/check_compiler_reproducibility.py
          --target '${{ matrix.target }}'
          --output-dir '${{ runner.temp }}/compiler-reproducibility'
      - name: Preserve differing compiler output
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compiler-reproducibility-${{ matrix.target }}
          path: ${{ runner.temp }}/compiler-reproducibility/build-*
          if-no-files-found: ignore
          retention-days: 7
