name: "alpha-release"

on:
  push:
    branches:
      - alpha

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

jobs:
  alpha-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--config src-tauri/configs/tauri.macos.arm.conf.json --verbose"
          - platform: "macos-15-intel"
            args: "--config src-tauri/configs/tauri.macos.intel.conf.json --verbose"
          - platform: "ubuntu-latest"
            args: "--config src-tauri/configs/tauri.linux.x64.conf.json --verbose"
          - platform: "ubuntu-24.04-arm"
            args: "--verbose"
          # windows-latest currently resolves to the VS 2026 image, which breaks
          # libduckdb-sys 1.3.0's vendored fmt headers.
          - platform: "windows-2022"
            args: "--config src-tauri/configs/tauri.win.x64.conf.json --verbose"
    runs-on: ${{ matrix.platform }}
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
    steps:
      - name: Free Disk Space (Ubuntu)
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Free Disk Space (macOS)
        if: runner.os == 'macOS'
        run: |
          sudo rm -rf /Users/runner/Library/Android/sdk || true
          sudo rm -rf /Library/Frameworks/Mono.framework || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Free Disk Space (Windows)
        if: runner.os == 'Windows'
        run: |
          Remove-Item -Recurse -Force "C:\Android\android-sdk" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files\dotnet\sdk\*" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\hostedtoolcache\CodeQL" -ErrorAction SilentlyContinue

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1

      - name: Decode GoogleService-Info.plist (macOS)
        if: runner.os == 'macOS'
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST_BASE64" ]; then
            mkdir -p apps/desktop/src-tauri/gen/apple/flow-like-desktop_iOS
            echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > apps/desktop/src-tauri/gen/apple/flow-like-desktop_iOS/GoogleService-Info.plist
            echo "GoogleService-Info.plist decoded successfully"
          else
            echo "GOOGLE_SERVICE_INFO_PLIST_BASE64 not set, skipping"
          fi

      - name: Decode google-services.json (Linux/macOS)
        if: runner.os != 'Windows'
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > apps/desktop/src-tauri/gen/android/app/google-services.json
            echo "google-services.json decoded successfully"
          else
            echo "GOOGLE_SERVICES_JSON_BASE64 not set, skipping"
          fi

      - name: Decode google-services.json (Windows)
        if: runner.os == 'Windows'
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if ($env:GOOGLE_SERVICES_JSON_BASE64) {
            [System.Convert]::FromBase64String($env:GOOGLE_SERVICES_JSON_BASE64) | Set-Content -Path "apps/desktop/src-tauri/gen/android/app/google-services.json" -AsByteStream
            Write-Host "google-services.json decoded successfully"
          } else {
            Write-Host "GOOGLE_SERVICES_JSON_BASE64 not set, skipping"
          }

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libclang-dev libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev ocl-icd-libopencl1 ocl-icd-opencl-dev libudev-dev
          lib_dir="/usr/lib/$(dpkg-architecture -qDEB_HOST_MULTIARCH)"
          if [ ! -e "$lib_dir/libOpenCL.so" ] && [ -e "$lib_dir/libOpenCL.so.1" ]; then
              sudo ln -sf "$lib_dir/libOpenCL.so.1" "$lib_dir/libOpenCL.so"
          fi
          test -e "$lib_dir/libOpenCL.so"

      - name: Import Apple Developer Certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo $APPLE_CERTIFICATE | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 7200 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          CERT_INFO=$(security find-identity -v -p codesigning build.keychain | grep "TM9657 GmbH")
          CERT_ID=$(echo "$CERT_INFO" | awk -F'"' '{print $2}')
          echo "CERT_ID=$CERT_ID" >> $GITHUB_ENV

      - name: Install Protoc
        uses: arduino/setup-protoc@f4d5893b897028ff5739576ea0409746887fa536 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2
        with:
          bun-version: 1.3.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          workspaces: ". -> target"
          cache-on-failure: true

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure macOS ONNX Runtime
        if: runner.os == 'macOS'
        run: |
          echo "ORT_LIB_LOCATION=${GITHUB_WORKSPACE}/apps/desktop/src-tauri/gen/apple/thirdparty/onnxruntime.xcframework/macos-arm64_x86_64" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=14.0" >> "$GITHUB_ENV"

      - name: Prepare Windows VC runtime DLLs
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        run: bun ./scripts/prepare-windows-prereqs.ts --arch x64

      - name: Build and Release
        id: build_release
        continue-on-error: true
        uses: tauri-apps/tauri-action@73fb865345c54760d875b94642314f8c0c894afa # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          PUBLIC_SENTRY_ENDPOINT: ${{ secrets.PUBLIC_SENTRY_ENDPOINT }}
          LD_LIBRARY_PATH: ${{ runner.os == 'Linux' && format('{0}/apps/desktop/src-tauri/binaries/linux/x64', github.workspace) || '' }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ env.CERT_ID }}
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C link-arg=/STACK:8388608' || '' }}
          CXXFLAGS_x86_64_pc_windows_msvc: ${{ runner.os == 'Windows' && '/std:c++17' || '' }}
        with:
          tagName: beta-v__VERSION__
          releaseName: "Flow Like - Beta v__VERSION__"
          releaseBody: ""
          releaseDraft: true
          prerelease: true
          projectPath: "./apps/desktop"
          tauriScript: "bun tauri"
          args: ${{ matrix.args }}

      - name: Retry upload on failure
        if: steps.build_release.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_APP_VERSION: ${{ steps.build_release.outputs.appVersion }}
          TAURI_ARTIFACT_PATHS: ${{ steps.build_release.outputs.artifactPaths }}
          TAURI_RELEASE_ID: ${{ steps.build_release.outputs.releaseId }}
          TAURI_RUNNER_ARCH: ${{ runner.arch }}
        shell: bash
        run: bash .github/scripts/retry-release-upload.sh

      - name: Report recovered installer uploads
        if: steps.build_release.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::Tauri's initial release upload failed, but all built installer assets were recovered and verified by digest."

  finalize-updater-json:
    name: Finalize updater metadata
    needs: alpha-release
    if: ${{ always() && needs['alpha-release'].result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1

      - name: Generate and publish complete latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: bash .github/scripts/finalize-updater-json.sh
