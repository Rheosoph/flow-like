name: "alpha-release"

on:
  push:
    branches:
      - alpha

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

jobs:
  prepare-release-frontend:
    name: Prepare release frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2
        with:
          bun-version: 1.3.1

      - name: Cache frontend dependency downloads
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ${{ runner.temp }}/bun-install-cache
          key: release-frontend-${{ runner.os }}-${{ runner.arch }}-bun-1.3.1-${{ hashFiles('bun.lock', 'bunfig.toml', 'patches/**') }}
          restore-keys: |
            release-frontend-${{ runner.os }}-${{ runner.arch }}-bun-1.3.1-

      - name: Cache Next.js build
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: apps/desktop/.next/cache
          key: release-next-${{ runner.os }}-${{ runner.arch }}-bun-1.3.1-${{ hashFiles('bun.lock', 'bunfig.toml', 'patches/**') }}-${{ github.sha }}
          restore-keys: |
            release-next-${{ runner.os }}-${{ runner.arch }}-bun-1.3.1-${{ hashFiles('bun.lock', 'bunfig.toml', 'patches/**') }}-

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build frontend
        working-directory: apps/desktop
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          PUBLIC_SENTRY_ENDPOINT: ${{ secrets.PUBLIC_SENTRY_ENDPOINT }}
        run: bun run build

      - name: Upload frontend
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-frontend
          path: apps/desktop/out
          if-no-files-found: error
          retention-days: 7

  prepare-release-mlx:
    name: Prepare Apple MLX helper
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2
        with:
          bun-version: 1.3.1

      - name: Identify Apple MLX toolchain
        id: mlx-toolchain
        shell: bash
        run: |
          xcodebuild -version > "$RUNNER_TEMP/mlx-toolchain.txt"
          xcrun --sdk macosx --show-sdk-version >> "$RUNNER_TEMP/mlx-toolchain.txt"
          xcrun --sdk macosx --show-sdk-build-version >> "$RUNNER_TEMP/mlx-toolchain.txt"
          xcrun swift --version >> "$RUNNER_TEMP/mlx-toolchain.txt"
          echo "fingerprint=$(shasum -a 256 "$RUNNER_TEMP/mlx-toolchain.txt" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Cache unsigned Apple MLX helper
        id: mlx-cache
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: |
            apps/desktop/src-tauri/binaries/mac/arm/flow-like-mlx-service-aarch64-apple-darwin
            apps/desktop/src-tauri/binaries/mac/arm/mlx-resources
          # Only exact input matches may skip the helper build.
          key: release-mlx-${{ runner.os }}-${{ runner.arch }}-arm64-Release-${{ steps.mlx-toolchain.outputs.fingerprint }}-${{ hashFiles('apps/desktop/src-tauri/apple/FlowLikeMLX/**', 'apps/desktop/scripts/prepare-mlx.ts', '.github/workflows/alpha-release.yml') }}

      - name: Build Apple MLX helper
        if: steps.mlx-cache.outputs.cache-hit != 'true'
        working-directory: apps/desktop
        run: bun ./scripts/prepare-mlx.ts --configuration Release

      - name: Verify Apple MLX helper
        shell: bash
        run: |
          test -x apps/desktop/src-tauri/binaries/mac/arm/flow-like-mlx-service-aarch64-apple-darwin
          test -n "$(find apps/desktop/src-tauri/binaries/mac/arm/mlx-resources -name '*.bundle' -type d -print -quit)"

      - name: Upload Apple MLX helper
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-mlx-arm64
          path: |
            apps/desktop/src-tauri/binaries/mac/arm/flow-like-mlx-service-aarch64-apple-darwin
            apps/desktop/src-tauri/binaries/mac/arm/mlx-resources
          if-no-files-found: error
          retention-days: 7

  alpha-release:
    needs:
      - prepare-release-frontend
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            stablediffusion_platform: "mac-intel"
            cache_key: "macos-x64"
            release_bundle_dir: "target/x86_64-apple-darwin/release/bundle"
            retry_runner_arch: "X64"
            args: "--target x86_64-apple-darwin --config src-tauri/configs/tauri.macos.intel.conf.json --config src-tauri/configs/tauri.ci.conf.json --verbose"
          # Pin the runner label because Linux artifacts inherit its glibc floor
          # and the AppImage copies its WebKitGTK support libraries. Build on the
          # oldest supported distribution so one artifact also runs on newer
          # glibc versions.
          - platform: "ubuntu-22.04"
            stablediffusion_platform: "linux-x64"
            cache_key: "linux-x64-glibc-2.35"
            max_glibc_version: "2.35"
            release_bundle_dir: "target/release/bundle"
            args: "--config src-tauri/configs/tauri.linux.x64.conf.json --config src-tauri/configs/tauri.ci.conf.json --verbose"
          - platform: "ubuntu-22.04-arm"
            cache_key: "linux-arm64-glibc-2.35"
            max_glibc_version: "2.35"
            release_bundle_dir: "target/release/bundle"
            args: "--config src-tauri/configs/tauri.ci.conf.json --verbose"
          # windows-latest currently resolves to the VS 2026 image, which breaks
          # libduckdb-sys 1.3.0's vendored fmt headers.
          - platform: "windows-2022"
            stablediffusion_platform: "win-x64"
            cache_key: "windows-x64-msvc"
            release_bundle_dir: "target/release/bundle"
            args: "--config src-tauri/configs/tauri.win.x64.conf.json --config src-tauri/configs/tauri.ci.conf.json --verbose"
    uses: ./.github/workflows/release-native.yml
    with:
      platform: ${{ matrix.platform }}
      stablediffusion_platform: ${{ matrix.stablediffusion_platform || '' }}
      cache_key: ${{ matrix.cache_key || '' }}
      release_bundle_dir: ${{ matrix.release_bundle_dir }}
      retry_runner_arch: ${{ matrix.retry_runner_arch || '' }}
      max_glibc_version: ${{ matrix.max_glibc_version || '' }}
      args: ${{ matrix.args }}
    secrets: inherit

  alpha-release-macos-arm:
    name: Native release (macOS ARM64)
    needs:
      - prepare-release-frontend
      - prepare-release-mlx
    permissions:
      contents: write
    uses: ./.github/workflows/release-native.yml
    with:
      platform: macos-latest
      stablediffusion_platform: mac-arm
      mlx: true
      cache_key: macos-arm64
      release_bundle_dir: target/release/bundle
      retry_runner_arch: ARM64
      args: --config src-tauri/configs/tauri.macos.arm.conf.json --config src-tauri/configs/tauri.ci.conf.json --verbose
    secrets: inherit

  finalize-updater-json:
    name: Finalize updater metadata
    needs:
      - alpha-release
      - alpha-release-macos-arm
    if: ${{ always() && needs['alpha-release'].result == 'success' && needs['alpha-release-macos-arm'].result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1

      - name: Generate and publish complete latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: bash .github/scripts/finalize-updater-json.sh
