name: "Rust Feature Boundaries"

on:
  pull_request:
    branches:
      - dev
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "**/*.rs"
      - ".cargo/*.toml"
      - "rust-toolchain.toml"
      - ".github/actions/setup-environment/action.yml"
      - "tools/check-feature-boundaries.sh"
      - ".github/workflows/compile-guardrails.yml"
  workflow_dispatch:

concurrency:
  group: rust-feature-boundaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  feature-boundaries:
    name: Check isolated Rust features
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-environment
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Each boundary is a separate Cargo process. This prevents features from
      # another workspace package making an incomplete feature declaration pass.
      - name: Check lightweight crate boundaries
        run: >-
          ./tools/check-feature-boundaries.sh
          --target-dir target/feature-boundaries
          core-contracts
          dev-default
          core-flow
          types-contracts
          types-proto
          storage-contracts
          storage-files
          model-protocol
          wasm-schema
          wasm-schema-nodes
          api-entity

      - name: Check catalog product bundles
        run: >-
          ./tools/check-feature-boundaries.sh
          --target-dir target/feature-boundaries
          catalog-portable
          catalog-server

      - name: Verify the opt-in server ML bundle remains complete
        run: >-
          ./tools/check-feature-boundaries.sh
          --mode deps
          catalog-server-local-ml

      - name: Guard the API/WASM host separation
        run: >-
          ./tools/check-feature-boundaries.sh
          --mode deps
          wasm-host
          api-runtime
