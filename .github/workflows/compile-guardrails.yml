name: "Rust Feature Boundaries"

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: rust-feature-boundaries-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  dependency-boundaries:
    name: Check dependency and feature assertions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          shared-key: workspace-${{ runner.arch }}-feature-boundaries-deps
          cache-targets: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
          cache-on-failure: true
          cache-all-crates: true

      # Dependency assertions do not compile crates or need desktop libraries.
      # Run every existing assertion before starting the expensive check jobs.
      - name: Verify Arrow and DataFusion provider alignment
        run: python3 .github/scripts/check-datafusion-alignment.py

      - name: Verify dependency boundaries and product feature composition
        run: >-
          ./tools/check-feature-boundaries.sh
          --mode deps
          core-contracts
          dev-default
          core-flow-metadata
          core-flow
          core-model
          types-contracts
          types-proto
          storage-contracts
          storage-files
          model-protocol
          wasm-schema
          wasm-schema-nodes
          api-entity
          catalog-portable
          catalog-portable-execute
          catalog-server
          catalog-server-local-ml
          catalog-execute
          catalog-server-execute
          catalog-executor
          catalog-local-runtime
          catalog-modifier-local-ml
          catalog-modifier-data
          executor-default
          executor-server
          backend-executor-k8s
          backend-executor-aws
          backend-executor-azure
          backend-executor-gcp
          backend-runtime-local
          backend-runtime-docker
          api-remote-catalog
          api-aws-catalog
          api-aws-forecasting
          api-local-ml-catalog
          wasm-host
          api-runtime
          a2ui-schema
          editor-contracts
          types-data-url
          model-provider
          browser-core
          catalog-std-execute
          catalog-std-ui
          catalog-std-values
          catalog-std-numbers
          catalog-std-text
          catalog-std-runtime
          catalog-std-support
          catalog-data-support
          catalog-data-github
          catalog-data-google
          catalog-data-microsoft
          catalog-data-atlassian
          catalog-data-notion
          catalog-data-databricks
          catalog-data-linkedin
          catalog-llm-execute
          catalog-embedding
          industrial-adapters
          catalog-industrial
          catalog-industrial-execute

  lightweight-boundaries:
    name: Compile lightweight Rust boundaries
    needs: dependency-boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-environment
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          cache-key: feature-boundaries-light

      # Separate Cargo processes keep feature declarations isolated. The shared
      # target directory reuses dependencies between checks within this job.
      - name: Check lightweight crate boundaries
        run: >-
          ./tools/check-feature-boundaries.sh
          --mode check
          --target-dir target/feature-boundaries
          core-contracts
          a2ui-schema
          editor-contracts
          types-data-url
          browser-core
          dev-default
          core-flow-metadata
          core-flow
          core-model
          types-contracts
          types-proto
          storage-contracts
          storage-files
          model-protocol
          wasm-schema
          wasm-schema-nodes
          api-entity

  catalog-boundaries:
    name: Compile catalog Rust boundaries
    needs: dependency-boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-environment
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          cache-key: feature-boundaries-catalog

      - name: Check catalog product bundles
        run: >-
          ./tools/check-feature-boundaries.sh
          --mode check
          --target-dir target/feature-boundaries
          catalog-portable
          catalog-portable-execute
          catalog-server
