name: "Tests"

on:
  workflow_call:
    inputs:
      rust:
        type: boolean
        required: true
      bun:
        type: boolean
        required: true
      ui:
        type: boolean
        required: true
      azure_migrations:
        type: boolean
        required: true

concurrency:
  group: tests-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rust-tests:
    name: Rust tests
    if: inputs.rust
    runs-on: ubuntu-latest
    env:
      # Unoptimised test executables are mostly symbol table, and CI never
      # symbolises backtraces. Stripping keeps the ~300 linked workspace
      # targets within the runner's disk.
      CARGO_PROFILE_CI_STRIP: symbols
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flowlike_test
          POSTGRES_PASSWORD: standalone-ci
          POSTGRES_DB: flowlike_standalone
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowlike_test -d flowlike_standalone"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-environment
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          cache-key: tests-ci

      # The runner has been shut down while the API and desktop test crates
      # compile side by side; swap absorbs that memory peak.
      - name: Add memory headroom for the workspace test build
        run: |
          swapfile="$RUNNER_TEMP/flow-like-build.swap"
          sudo fallocate -l 8G "$swapfile"
          sudo chmod 600 "$swapfile"
          sudo mkswap "$swapfile"
          sudo swapon "$swapfile"
          free -h
          df -h "$GITHUB_WORKSPACE"

      - name: Warm Rust test dependencies
        if: github.event_name == 'push'
        # Build the same test targets without requiring external test services.
        run: bash .github/scripts/run-with-resource-log.sh cargo test --locked --workspace --profile ci --no-run

      - name: Run Rust tests
        if: github.event_name != 'push'
        # Preserve the pre-default-members CI coverage while keeping everyday
        # bare Cargo commands focused on the shared editing surface.
        run: bash .github/scripts/run-with-resource-log.sh cargo test --locked --workspace --profile ci
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}

      - name: Test standalone workflow updates and crash recovery
        run: cargo test --locked --package flow-like-standalone --profile ci --test workflow_rollout -- --include-ignored

      - name: Test instance credentials and rollout validation against PostgreSQL
        run: 'cargo test --locked --package flow-like-api --profile ci --lib instances:: -- --include-ignored'
        env:
          FLOW_LIKE_DEVICE_TEST_DATABASE_URL: postgres://flowlike_test:standalone-ci@localhost:5432/flowlike_standalone

      - name: Test device sharing, inventory and account recovery against PostgreSQL
        run: 'cargo test --locked --package flow-like-api --profile ci --lib devices:: -- --include-ignored'
        env:
          FLOW_LIKE_DEVICE_TEST_DATABASE_URL: postgres://flowlike_test:standalone-ci@localhost:5432/flowlike_standalone

      - name: Test Linux workload isolation on the disposable runner
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap quota e2fsprogs
          cargo test --locked --package flow-like-standalone --profile ci --lib --no-run --message-format=json > /tmp/standalone-test-targets.jsonl
          test_binary=$(python3 - <<'PY'
          import json
          from pathlib import Path
          targets = [json.loads(line) for line in Path('/tmp/standalone-test-targets.jsonl').read_text().splitlines()]
          binaries = [target['executable'] for target in targets if target.get('reason') == 'compiler-artifact' and target.get('executable') and target.get('profile', {}).get('test') and target['target']['name'] == 'flow_like_standalone']
          if len(binaries) != 1:
              raise SystemExit('Expected one standalone library test executable')
          print(binaries[0])
          PY
          )
          sudo scripts/test-standalone-isolation-linux.sh --disposable-linux-host "$test_binary"

  frontend:
    name: Frontend and migration checks
    if: inputs.bun || inputs.ui || inputs.azure_migrations
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 2
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2
        id: bun
        with:
          bun-version: 1.4.4
      - name: Run package manager security E2E tests
        if: ${{ !cancelled() && inputs.bun && steps.bun.outcome == 'success' }}
        run: bun run test:e2e:package-security
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache frontend dependency downloads
        if: ${{ !cancelled() && inputs.ui && steps.bun.outcome == 'success' }}
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ${{ runner.temp }}/bun-install-cache
          key: tests-frontend-${{ runner.os }}-${{ runner.arch }}-bun-1.4.4-${{ hashFiles('bun.lock', 'bunfig.toml', 'patches/**') }}
          restore-keys: |
            tests-frontend-${{ runner.os }}-${{ runner.arch }}-bun-1.4.4-
      - name: Install frontend dependencies
        id: frontend-install
        if: ${{ !cancelled() && inputs.ui && steps.bun.outcome == 'success' }}
        run: bun install --frozen-lockfile
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Each suite still runs when an independent suite fails.
      # packages/ui carries a large Biome backlog, so a pull request is held to the files it changes.
      - name: Biome on changed packages/ui files
        if: ${{ !cancelled() && steps.frontend-install.outcome == 'success' && github.event_name == 'pull_request' }}
        run: bun run lint:ui:changed
        env:
          BIOME_BASE_REF: HEAD^1
      - name: Run packages/ui tests
        if: ${{ !cancelled() && steps.frontend-install.outcome == 'success' }}
        run: bun run test:ui
      - name: Test the widget bundler
        if: ${{ !cancelled() && steps.frontend-install.outcome == 'success' }}
        run: bun test
        working-directory: packages/widget-bundler
      - name: Type-check the widget bundler
        if: ${{ !cancelled() && steps.frontend-install.outcome == 'success' }}
        run: bun run typecheck
        working-directory: packages/widget-bundler
      - name: Install migration dependencies
        id: migration-install
        if: ${{ !cancelled() && inputs.azure_migrations && steps.bun.outcome == 'success' }}
        run: bun install --frozen-lockfile
        working-directory: apps/backend/azure/migration
      - name: Run migration tests
        if: ${{ !cancelled() && steps.migration-install.outcome == 'success' }}
        run: bun test
        working-directory: apps/backend/azure/migration
