name: "Tests"

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect test changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.changes.outputs.rust }}
      bun: ${{ steps.changes.outputs.bun }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/detect-changes
        id: changes

  rust-tests:
    name: Rust tests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flowlike_test
          POSTGRES_PASSWORD: standalone-ci
          POSTGRES_DB: flowlike_standalone
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowlike_test -d flowlike_standalone"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-environment
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          cache-key: tests-ci

      - name: Warm Rust test dependencies
        if: github.event_name == 'push'
        # Build the same test targets without requiring external test services.
        run: cargo test --locked --workspace --profile ci --no-run

      - name: Run Rust tests
        if: github.event_name == 'pull_request'
        # Preserve the pre-default-members CI coverage while keeping everyday
        # bare Cargo commands focused on the shared editing surface.
        run: cargo test --locked --workspace --profile ci
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}

      - name: Test standalone workflow updates and crash recovery
        run: cargo test --locked --package flow-like-standalone --profile ci --test workflow_rollout -- --include-ignored

      - name: Test instance credentials and rollout validation against PostgreSQL
        run: 'cargo test --locked --package flow-like-api --profile ci --lib instances:: -- --include-ignored'
        env:
          FLOW_LIKE_DEVICE_TEST_DATABASE_URL: postgres://flowlike_test:standalone-ci@localhost:5432/flowlike_standalone

      - name: Test device sharing, inventory and account recovery against PostgreSQL
        run: 'cargo test --locked --package flow-like-api --profile ci --lib devices:: -- --include-ignored'
        env:
          FLOW_LIKE_DEVICE_TEST_DATABASE_URL: postgres://flowlike_test:standalone-ci@localhost:5432/flowlike_standalone

      - name: Test Linux workload isolation on the disposable runner
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap quota e2fsprogs
          cargo test --locked --package flow-like-standalone --profile ci --lib --no-run --message-format=json > /tmp/standalone-test-targets.jsonl
          test_binary=$(python3 - <<'PY'
          import json
          from pathlib import Path
          targets = [json.loads(line) for line in Path('/tmp/standalone-test-targets.jsonl').read_text().splitlines()]
          binaries = [target['executable'] for target in targets if target.get('reason') == 'compiler-artifact' and target.get('executable') and target.get('profile', {}).get('test') and target['target']['name'] == 'flow_like_standalone']
          if len(binaries) != 1:
              raise SystemExit('Expected one standalone library test executable')
          print(binaries[0])
          PY
          )
          sudo scripts/test-standalone-isolation-linux.sh --disposable-linux-host "$test_binary"

  package-security:
    name: Package manager security
    needs: changes
    if: needs.changes.outputs.bun == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2
        with:
          bun-version: 1.3.1
      - name: Run package manager security E2E tests
        run: bun run test:e2e:package-security
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-application:
    name: Test Application
    needs: [changes, rust-tests, package-security]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check test results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          JOB_RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          test "$CHANGES_RESULT" = success
          for result in $JOB_RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
