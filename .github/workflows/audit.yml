name: "Audit"

on:
  pull_request:
    branches:
      - dev

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install cargo-audit
        uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2
        with:
          tool: cargo-audit@0.22.2

      - name: Run Cargo Audit
        # Bash pipefail preserves audit failures while retaining the JSON report.
        shell: bash
        run: cargo audit --json | tee cargo-audit-report.json

      - name: Upload cargo audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cargo-audit-report
          path: cargo-audit-report.json
