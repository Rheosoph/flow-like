name: Platform SDKs

on:
  pull_request:
    paths:
      - 'libs/platform/**'
      - 'packages/api/src/routes/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'bun.lock'
      - '.github/workflows/platform-sdks.yml'
  push:
    branches: [dev]
    paths:
      - 'libs/platform/**'
      - 'packages/api/src/routes/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'bun.lock'
      - '.github/workflows/platform-sdks.yml'

permissions:
  contents: read

concurrency:
  group: platform-sdks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2
        with:
          bun-version: 1.3.1
      - run: bun install --frozen-lockfile --filter @flow-like/sdk
      - run: bun run --cwd libs/platform/nodejs build
      - run: bun test ./libs/platform/nodejs/tests
      - run: bun run --cwd libs/platform/nodejs check:package

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install build twine
      - run: python -m build libs/platform/python --outdir "$RUNNER_TEMP/python-sdk"
      - run: python -m twine check "$RUNNER_TEMP"/python-sdk/*
      - run: python -m pip install "$RUNNER_TEMP"/python-sdk/*.whl
      - run: python -m unittest discover -s libs/platform/python/tests

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          shared-key: platform-sdk
      - run: cargo test --locked -p flow-like-platform
      - run: cargo clippy --locked -p flow-like-platform --all-targets -- -D warnings
      - run: cargo package --locked -p flow-like-platform
