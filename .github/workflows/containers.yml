name: Backend containers

on:
  workflow_call:
    inputs:
      cloud:
        description: Image set to publish (APIs support runtime configuration)
        type: string
        default: all

permissions:
  contents: read

concurrency:
  group: backend-containers-${{ github.ref }}-${{ inputs.cloud || 'all' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Build records can expose intermediate source, build arguments, and logs.
  DOCKER_BUILD_SUMMARY: 'false'
  DOCKER_BUILD_RECORD_UPLOAD: 'false'

jobs:
  validate:
    name: Validate container publication contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      images: ${{ steps.matrix.outputs.images }}
      owner: ${{ steps.matrix.outputs.owner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          persist-credentials: false
      - name: Test CI helpers
        run: python3 -m unittest discover -s .github/scripts/tests
      - name: Test cloud audit deployment and database login helpers
        run: |
          python3 -B -m unittest discover -s apps/backend/azure/audit-worker -p 'test_*.py'
          python3 -B -m unittest discover -s apps/backend/gcp/audit-worker -p 'test_*.py'
      - name: Test public web runtime configuration
        run: python3 -B -m unittest discover -s apps/backend/docker-compose/web/tests
      - name: Test Compose deployment scripts
        run: python3 -B -m unittest discover -s apps/backend/docker-compose/scripts -p 'test_*.py'
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.2.4
      - name: Test Kubernetes deployment scripts and chart rendering
        run: |
          python3 -c 'import yaml' 2>/dev/null || { sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends python3-yaml; }
          python3 -B -m unittest discover -s apps/backend/kubernetes/scripts/tests
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2
        with:
          bun-version: 1.4.4
      - name: Verify the workspace lockfile is current
        run: bun install --frozen-lockfile --dry-run
      - name: Test browser configuration and API URL resolution
        run: bun test packages/ui/lib/public-web-config.test.ts
      - name: Test signaling admission, limits and transport
        working-directory: apps/backend/signaling
        run: |
          bun install --frozen-lockfile
          bun test tests/
      - name: Verify build-context exclusions
        working-directory: apps/backend/docker-compose/tests/build-context
        run: go test ./...
      - name: Reject literal credentials in compiled default config
        run: |
          python3 .github/scripts/container_publication.py check-config --path flow-like.config.json
          python3 .github/scripts/container_publication.py check-config --path apps/backend/docker-compose/flow-like.config.example.json
          python3 .github/scripts/container_publication.py check-config --path apps/backend/kubernetes/flow-like.config.example.json

      - name: Restrict publication to release branches and tags
        if: github.event_name != 'pull_request'
        env:
          SOURCE_REF: ${{ github.ref }}
        run: |
          case "$SOURCE_REF" in
            refs/heads/dev|refs/heads/main|refs/heads/alpha|refs/tags/v*|refs/tags/beta-v*) ;;
            *) echo 'Publication requires dev, main, alpha, a v* tag, or a beta-v* tag.' >&2; exit 1 ;;
          esac
      - name: Generate native-platform build batches
        id: matrix
        env:
          CLOUD: ${{ inputs.cloud }}
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "images=$(python3 .github/scripts/container_images.py build-matrix --cloud "$CLOUD")" >> "$GITHUB_OUTPUT"
          echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"

  native-deps:
    name: Native dependencies (${{ matrix.platform }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Compile and run Compose native dependency checks
        id: compose
        continue-on-error: true
        env:
          PLATFORM: ${{ matrix.platform }}
        run: bash .github/scripts/check-container-native-deps.sh apps/backend/docker-compose/runtime/Dockerfile "$PLATFORM"
      - name: Compile and run Kubernetes native dependency checks
        id: kubernetes
        continue-on-error: true
        env:
          PLATFORM: ${{ matrix.platform }}
        run: bash .github/scripts/check-container-native-deps.sh apps/backend/kubernetes/executor/Dockerfile "$PLATFORM"
      - name: Require both native dependency checks to pass
        if: always()
        env:
          COMPOSE: ${{ steps.compose.outcome }}
          KUBERNETES: ${{ steps.kubernetes.outcome }}
        run: test "$COMPOSE" = success && test "$KUBERNETES" = success

  signaling-image:
    name: Signaling images start
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          persist-credentials: false
      # Publication builds skip pull requests, so this is the only PR gate that
      # proves the recipe ships every module server.ts imports.
      - name: Build each signaling image and require readiness
        run: |
          failed=0
          for cloud in docker-compose gcp azure; do
            echo "::group::${cloud} signaling image"
            tag="signaling-smoke:${GITHUB_SHA}-${cloud}"
            if DOCKER_BUILDKIT=1 docker build --file "apps/backend/${cloud}/signaling/Dockerfile" --tag "$tag" .; then
              bash apps/backend/signaling/tests/image-smoke.sh "$tag" || failed=1
            else
              failed=1
            fi
            docker image rm "$tag" >/dev/null 2>&1 || true
            echo "::endgroup::"
          done
          exit "$failed"

  web-image:
    name: Web images export browser runtimes
    needs: validate
    # Publication builds these recipes on push; for pull requests this is the only
    # gate on the device-crypto stage's Rust, clang and wasm-bindgen toolchain.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          persist-credentials: false
      - name: Add memory headroom for the web build and type checker
        run: |
          swapfile="$RUNNER_TEMP/flow-like-build.swap"
          sudo fallocate -l 8G "$swapfile"
          sudo chmod 600 "$swapfile"
          sudo mkswap "$swapfile"
          sudo swapon "$swapfile"
          free -h
          df -h "$RUNNER_TEMP"
      # Both recipes share their build stages, so the second build reuses the first's layers.
      - name: Build each web recipe through its static export and require the bundles
        run: |
          for recipe in apps/backend/docker-compose/web/Dockerfile apps/backend/kubernetes/web/Dockerfile; do
            tag="web-smoke:${GITHUB_SHA}"
            DOCKER_BUILDKIT=1 docker build --file "$recipe" --target builder --tag "$tag" .
            docker run --rm --entrypoint sh "$tag" -c \
              'test -s out/device-crypto/flow_like_device_crypto_bg.wasm && test -s out/device-crypto/flow_like_device_crypto.js && test -s out/wordcraft/runtime.json && test -s out/wordcraft/host.js && for name in pdfcraft deckcraft gridcraft vectorcraft photocraft soundcraft filmcraft cadcraft solidcraft designcraft; do test -s "out/craft/$name/runtime.json" || exit 1; done' \
              || { echo "${recipe} omitted a required browser runtime from its static export." >&2; exit 1; }
          done

  build:
    name: ${{ matrix.id }} (${{ matrix.platform }})
    needs: [validate, native-deps, signaling-image]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.validate.outputs.images) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    env:
      OWNER: ${{ needs.validate.outputs.owner }}
      TARGET: ${{ matrix.id }}
      PLATFORM: ${{ matrix.platform }}
      IMAGE_REPOSITORY: ghcr.io/${{ needs.validate.outputs.owner }}/${{ matrix.image_suffix }}
      TRIVY_IMAGE_SRC: docker
      TRIVY_IMAGE_CONFIG_SCANNERS: secret
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          persist-credentials: false
      - name: Name this build
        if: matrix.workload != 'helpers'
        id: image
        run: |
          arch="${PLATFORM#linux/}"
          tag="sha-${GITHUB_SHA}-${arch}-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "ref=${IMAGE_REPOSITORY}:${tag}" >> "$GITHUB_OUTPUT"
      - name: Add memory headroom for large builds
        if: matrix.workload == 'web' || matrix.cargo_build_jobs == 1
        run: |
          swapfile="$RUNNER_TEMP/flow-like-build.swap"
          sudo fallocate -l 8G "$swapfile"
          sudo chmod 600 "$swapfile"
          sudo mkswap "$swapfile"
          sudo swapon "$swapfile"
          free -h
          df -h "$RUNNER_TEMP"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        id: buildx

      # Opt in only after budgeting storage and reviewing Cargo Git sources.
      # Layer cache alone does not preserve RUN --mount=type=cache contents.
      - name: Restore Cargo cache mounts (optional)
        if: vars.CONTAINER_CARGO_CACHE == 'true' && !contains(fromJSON('["helpers","web"]'), matrix.workload)
        id: cargo-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/container-cargo-cache
          key: container-cargo-v1-${{ matrix.id }}-${{ hashFiles(matrix.dockerfile, 'Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}-${{ github.sha }}
          restore-keys: |
            container-cargo-v1-${{ matrix.id }}-${{ hashFiles(matrix.dockerfile, 'Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}-
      - name: Restore and later extract BuildKit cache mounts (optional)
        if: vars.CONTAINER_CARGO_CACHE == 'true' && !contains(fromJSON('["helpers","web"]'), matrix.workload)
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          dockerfile: ${{ matrix.dockerfile }}
          cache-dir: ${{ runner.temp }}/container-cargo-cache
          scratch-dir: ${{ runner.temp }}/container-cache-dance
          skip-extraction: ${{ steps.cargo-cache.outputs.cache-hit }}

      - name: Build once into the local image store
        if: matrix.workload != 'helpers'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          # Lambda accepts a single-architecture image, not an attestation index.
          provenance: false
          sbom: false
          tags: ${{ steps.image.outputs.ref }}
          build-args: |
            CARGO_BUILD_JOBS=${{ matrix.cargo_build_jobs }}
            CRDB_CA_URL=
            AUDIT_FEATURES=${{ matrix.audit_features || 'aws' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=BUSL-1.1
          # Recipes whose expensive step sits below a whole-context COPY can never
          # restore it, so exporting their layers only consumes the repository
          # cache quota and evicts the Rust workspace archives.
          # Never publish builder/source layers to a GHCR :buildcache package.
          cache-from: ${{ matrix.layer_cache && format('type=gha,scope=container-v1-{0}', matrix.id) || '' }}
          cache-to: ${{ matrix.layer_cache && format('type=gha,scope=container-v1-{0},mode=max', matrix.id) || '' }}
      - name: Inspect final filesystem and extract compiled text for scanning
        if: matrix.workload != 'helpers'
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          python3 .github/scripts/container_publication.py extract \
            --image "$IMAGE" --platform "$PLATFORM" \
            --output-dir "$RUNNER_TEMP/container-binary-strings"
      - name: Scan image files, environment, and history for secrets
        if: matrix.workload != 'helpers'
        id: image-secrets
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: v0.69.3
          scan-type: image
          image-ref: ${{ steps.image.outputs.ref }}
          scanners: secret
          exit-code: '1'
          format: json
          output: ${{ runner.temp }}/container-image-secrets.json
          cache: 'false'
      - name: Summarize failed image secret scan
        if: failure() && steps.image-secrets.outcome == 'failure'
        run: |
          python3 .github/scripts/container_publication.py report-secrets \
            --path "$RUNNER_TEMP/container-image-secrets.json"
      - name: Scan printable text from compiled binaries for secrets
        if: matrix.workload != 'helpers'
        id: binary-secrets
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: v0.69.3
          scan-type: fs
          scan-ref: ${{ runner.temp }}/container-binary-strings
          scanners: secret
          exit-code: '1'
          format: json
          output: ${{ runner.temp }}/container-binary-secrets.json
          cache: 'false'
      - name: Summarize failed compiled-text secret scan
        if: failure() && steps.binary-secrets.outcome == 'failure'
        run: |
          python3 .github/scripts/container_publication.py report-secrets \
            --path "$RUNNER_TEMP/container-binary-secrets.json" --compiled-text
      - name: Authenticate after publication checks pass
        if: matrix.workload != 'helpers'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the scanned image and record its registry digest
        if: matrix.workload != 'helpers'
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          docker push "$IMAGE"
          docker buildx imagetools inspect "$IMAGE" --raw > "$RUNNER_TEMP/pushed-manifest.json"
          # Verify the pushed single-image manifest points at the scanned config.
          config="$(docker image inspect "$IMAGE" --format '{{.Id}}')"
          jq -e --arg config "$config" \
            '.config.digest == $config and (has("manifests") | not)' \
            "$RUNNER_TEMP/pushed-manifest.json"
          digest="$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' | jq -er .digest)"
          python3 .github/scripts/container_images.py record \
            --target "$TARGET" --owner "$OWNER" --source-sha "$GITHUB_SHA" \
            --digest "$digest" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --output "records/${TARGET}.json"
      - name: Expose the GitHub cache runtime to sequential helper builds
        if: matrix.workload == 'helpers'
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4
      - name: Install the pinned secret scanner for helper images
        if: matrix.workload == 'helpers'
        uses: aquasecurity/setup-trivy@e6c2c5e321ed9123bda567646e2f96565e34abe1 # v0.2.4
        with:
          version: v0.69.3
          cache: 'false'
      - name: Build, scan, and publish helper images sequentially
        if: matrix.workload == 'helpers'
        timeout-minutes: 120
        env:
          BATCH_TARGETS: ${{ toJSON(matrix.targets) }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/container_build_batch.py --records-dir "$RUNNER_TEMP/container-records"
      - name: Upload digest record only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: container-record-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}
          path: ${{ matrix.workload == 'helpers' && format('{0}/container-records/*.json', runner.temp) || 'records/*.json' }}
          if-no-files-found: error
          retention-days: 30

  manifest:
    name: Validate and publish complete release manifests
    needs: [validate, build]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          persist-credentials: false
          # The mutable-tag guard checks whether an existing tag's commit is an ancestor.
          fetch-depth: 0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: container-record-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: records
      - name: Validate and merge every required digest
        env:
          CLOUD: ${{ inputs.cloud || 'all' }}
          OWNER: ${{ needs.validate.outputs.owner }}
        run: |
          python3 .github/scripts/container_images.py manifest \
            --cloud "$CLOUD" --owner "$OWNER" --source-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --records-dir records --output container-images.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: container-images-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: container-images.json
          if-no-files-found: error
          retention-days: 90

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create release references and apply guarded tags
        env:
          SOURCE_REF: ${{ github.ref }}
        run: |
          # Two platform records become an annotated multi-platform index; a single
          # record is carbon-copied and must stay a single-image manifest (Lambda).
          # The immutable sha-<sha>-run-<run>-<attempt> tag always applies; channel
          # tags only move forward and skips are recorded instead of failing.
          python3 .github/scripts/container_images.py publish \
            --manifest container-images.json --ref "$SOURCE_REF" \
            --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --github-repository "$GITHUB_REPOSITORY" \
            --output container-indexes.json
      - name: Validate the published index manifest
        run: |
          python3 .github/scripts/container_images.py indexes \
            --manifest container-images.json --path container-indexes.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: container-indexes-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: container-indexes.json
          if-no-files-found: error
          retention-days: 90
