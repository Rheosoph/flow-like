[package]
name = "flow-like-modbus-rtu-container"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
name = "flow_like_industrial"
path = "lib.rs"

[features]
default = ["execute"]
execute = []

[dependencies]
anyhow = "=1.0.104"
schemars = "=1.2.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.18"
tokio = { version = "=1.52.3", features = ["net", "io-util", "time", "sync", "rt", "macros", "rt-multi-thread"] }
tokio-modbus = { version = "=0.17.0", default-features = false, features = ["tcp", "rtu"] }
tokio-serial = { version = "=5.5.0", default-features = false }

[[test]]
name = "modbus_rtu_e2e"
path = "../../../../packages/industrial/tests/modbus_rtu_e2e.rs"

[profile.test]
debug = 0
