[package]
name = "flow-like-iroh-container"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
name = "flow_like_industrial"
path = "lib.rs"

[features]
default = ["execute"]
execute = []

[dependencies]
anyhow = "=1.0.104"
iroh = "=1.3.0"
schemars = "=1.2.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.18"
tokio = { version = "=1.52.3", features = ["rt-multi-thread", "macros", "io-util", "time", "sync"] }

[[bin]]
name = "iroh-reference"
path = "reference.rs"

[[test]]
name = "iroh_e2e"
path = "../../../../packages/industrial/tests/iroh_e2e.rs"

[profile.dev]
debug = 0
