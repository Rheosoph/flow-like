[package]
name = "flow-like-ethercat-container"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
name = "flow_like_industrial"
path = "lib.rs"

[features]
default = ["execute"]
execute = []

[dependencies]
anyhow = "=1.0.104"
ethercrab = { version = "=0.7.1", default-features = false, features = ["std"] }
log = "=0.4.34"
schemars = "=1.2.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.149"
thiserror = "=2.0.18"
tokio = { version = "=1.52.3", features = ["net", "io-util", "time", "sync", "rt", "macros", "rt-multi-thread"] }
tokio-util = { version = "=0.7.18", features = ["rt"] }

[[test]]
name = "ethercat_e2e"
path = "../../../../packages/industrial/tests/ethercat_e2e.rs"

[profile.test]
debug = 0
