# Opt-in linker experiments for local development.
#
# Invoke with:
#   cargo --config .cargo/fast-compile.toml <command>
#
# This file deliberately avoids target-cpu=native: that setting optimizes the
# produced program rather than rustc itself and fragments caches by CPU model.
# The base .cargo/config.toml relies on Rust's portable OS defaults.

[net]
git-fetch-with-cli = true

[registries.crates-io]
protocol = "sparse"

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[target.aarch64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"

[target.aarch64-pc-windows-msvc]
linker = "rust-lld.exe"

[unstable]
min-publish-age = true

[registry]
global-min-publish-age = "7 days"
