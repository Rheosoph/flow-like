# cargo audit configuration
# Tracks known vulnerabilities that cannot currently be fixed due to upstream blockers.
# Each entry is documented with the reason it cannot be resolved and the blocking dependency.
# These should be re-evaluated when upstream crates release fixes.

[advisories]
ignore = [
    # rsa 0.9.10: Marvin Attack timing side-channel (RUSTSEC-2023-0071)
    # Blocked by: no patched rsa release as of 2026-05-16.
    "RUSTSEC-2023-0071",

    # quick-xml < 0.41 has quadratic duplicate-attribute checks and unbounded
    # NsReader namespace allocation (RUSTSEC-2026-0194, RUSTSEC-2026-0195).
    # Older copies remain in xcb (0.30), feed-rs, tauri-winrt-notification and
    # umya-spreadsheet (0.37), rbook and zbus_xml (0.38), markitdown, object_store
    # and wayland-scanner (0.39), and lance-namespace-impls (0.40). Crafted
    # spreadsheets and e-books can reach the affected parsers through
    # umya-spreadsheet, rbook and markitdown. Calamine now uses a fixed release.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",

    # h2 0.3.27: unbounded empty DATA frames (RUSTSEC-2026-0258). Fixed only in h2 0.4;
    # 0.3 comes from hyper 0.14, which async-stripe 0.41 (latest stable; 1.0 is still a
    # release candidate) pins. Not exposed: our `runtime-tokio-hyper` client uses
    # hyper-tls without ALPN, so it only speaks HTTP/1.1 to api.stripe.com.
    "RUSTSEC-2026-0258",

    # libcrux-kem 0.0.9: panics decoding short hybrid KEM keys or seeds
    # (RUSTSEC-2026-0330, RUSTSEC-2026-0331). Pinned by openmls_rust_crypto 0.6.0 (latest)
    # → hpke-rs 0.7 → hpke-rs-libcrux 0.7. Not exposed: device-crypto uses only
    # MLS_128_DHKEMX25519_CHACHA20POLY1305_SHA256_Ed25519, which never reaches the
    # X-Wing / X25519MLKEM768 hybrid code paths.
    "RUSTSEC-2026-0330",
    "RUSTSEC-2026-0331",

    # crypto-bigint 0.5.5: timing variability in constant-time operations
    # (RUSTSEC-2026-0387). Fixed only in 0.7; 0.5 is required by elliptic-curve 0.13
    # (p256/p384/k256/ecdsa) and by aws-sigv4's SigV4a signer. Moving needs the
    # RustCrypto 0.14 elliptic-curve stack across those crates and the AWS SDK.
    "RUSTSEC-2026-0387",

    # zstd 0.13.3 / zstd-safe 7.2.4 have reused-context stream leaks,
    # legacy-frame streaming decompression and seekable decompression exposure
    # (RUSTSEC-2026-0391, RUSTSEC-2026-0398, RUSTSEC-2026-0403). Fixes require
    # zstd 0.14 / zstd-safe 8; older copies remain in Arrow/Parquet, DataFusion,
    # Lance, Iceberg, apache-avro, tonic and compression-codecs.
    # First-party code uses encode_all, decode_all, the bulk API and a fresh
    # stream Encoder, never with_context, the write-side Decoder or seekable.
    "RUSTSEC-2026-0391",
    "RUSTSEC-2026-0398",
    "RUSTSEC-2026-0403",

]
