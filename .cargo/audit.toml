# cargo audit configuration
# Tracks known vulnerabilities that cannot currently be fixed due to upstream blockers.
# Each entry is documented with the reason it cannot be resolved and the blocking dependency.
# These should be re-evaluated when upstream crates release fixes.

[advisories]
ignore = [
    # rsa 0.9.10 — Marvin Attack timing side-channel (RUSTSEC-2023-0071)
    # Blocked by: no patched rsa release as of 2026-05-16.
    "RUSTSEC-2023-0071",

    # rustls-webpki 0.102.8 — name-constraint and CRL parsing advisories
    # (RUSTSEC-2026-0104, RUSTSEC-2026-0098, RUSTSEC-2026-0099, RUSTSEC-2026-0049)
    # Fix requires rustls-webpki >= 0.103.10, but 0.102.8 is pulled in by
    # rumqttc 0.25.1 (direct dep rustls-webpki ^0.102.8, no newer release) and by
    # serenity 0.12.5 → tokio-tungstenite 0.21 → rustls 0.22. Both require upstream
    # crates to update; no action possible in this workspace.
    # The 0.101.7 copy is gone: the aws-sdk-* crates now opt out of their deprecated
    # `rustls` default feature and sink-services uses teloxide 0.17 (reqwest 0.12).
    "RUSTSEC-2026-0104",
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0049",

    # zip < 9.0.0 — `extract()` follows symlink targets, applies permissions through
    # symlinks and preserves SUID/SGID bits (RUSTSEC-2026-0367, RUSTSEC-2026-0368,
    # RUSTSEC-2026-0369). First-party crates and our markitdown fork use zip 9. The older
    # copies are pinned by third parties: tch/torch-sys (0.6), umya-spreadsheet (2),
    # utoipa-swagger-ui (3), docx-rust and tauri-plugin-updater (4), libduckdb-sys and
    # rbook (6), calamine, candle-core and any-tts (7). Of those, only calamine 0.37 and
    # rbook 0.7 have releases on zip 9; neither is adopted yet. Only two of them
    # call `extract()`: tauri-plugin-updater on a minisign-verified update payload, and
    # libduckdb-sys in build.rs on the source archive it ships. The rest read archives
    # in memory, which the advisories do not affect.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
]
