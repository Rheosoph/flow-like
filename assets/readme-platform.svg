    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
      .title { font-size: 40px; font-weight: 700; fill: #f2f5f8; letter-spacing: -1px; }
      .subtitle { font-size: 26px; fill: #aebdcd; }
      .eyebrow { font-size: 24px; font-weight: 600; fill: #aebdcd; letter-spacing: 1px; }
      .label { font-size: 28px; font-weight: 500; fill: #e8edf3; }
      .icon { fill: none; stroke: #99adbf; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .core-icon { fill: none; stroke: #ff997e; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
