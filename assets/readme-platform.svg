<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="672" viewBox="0 0 1200 672" role="img" aria-labelledby="title desc">
  <title id="title">Connect existing systems and build working software with Flow-Like</title>
  <desc id="desc">Databases, APIs, files, and devices connect to Flow-Like. The platform brings together apps and interfaces, workflows and automation, data and analysis, and AI and machine learning. Teams use these capabilities to build team tools, APIs and services, and automated processes.</desc>
