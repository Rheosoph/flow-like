description = "Template for creating Flow-Like WASM nodes in Python"
id = "com.example.custom-node-python"
keywords = [
    "template",
    "example",
]
license = "MIT"
manifest_version = 1
name = "Custom Node (Python) New"
repository = "https://github.com/example/flow-like-nodes"
version = "0.1.0"
wasm_path = "build/node.wasm"

[[authors]]
name = "Your Name"

[[nodes]]
category = "Custom/WASM/Storage"
description = "Writes text content to a file at the given FlowPath"
id = "write_text_py"
name = "Write Text"

[[nodes]]
category = "Custom/WASM/AI"
description = "AI agent that looks up real weather conditions using LangChain tool-use"
id = "weather_agent_py"
name = "Weather Agent"

[permissions]
memory = "standard"
timeout = "standard"

# Capabilities (network, storage, database, models, ...) are declared on each
# node in code. The sandbox enforces those, and the registry derives the store's
# capability listing from them, so they are not repeated here. This file only
# sets resource tiers, the outbound host allowlist and OAuth scopes.
[permissions.network]
allowed_hosts = ["geocoding-api.open-meteo.com", "api.open-meteo.com"]
