[package]
name = "flow-like-wasm-node-template"
version = "0.1.0"
edition = "2021"
description = "Template for creating Flow-Like WASM nodes in Rust (Component Model)"
license = "MIT"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Remove the local path after SDK 0.4.0 is published to crates.io.
flow-like-wasm-sdk = { version = "0.4.0", path = "../../libs/wasm-sdk/wasm-sdk-rust", features = ["rig"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
