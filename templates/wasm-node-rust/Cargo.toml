[package]
name = "flow-like-wasm-node-template"
version = "0.1.0"
edition = "2021"
description = "Template for creating Flow-Like WASM nodes in Rust (Component Model)"
license = "MIT"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# When copying this template outside the repo, replace with: flow-like-wasm-sdk = "0.3"
flow-like-wasm-sdk = { version = "0.3.3", features = ["rig"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rig-core = { version = "0.29.0", default-features = false, features = ["wasm"] }
futures = { version = "0.3", default-features = false, features = ["executor"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
