[package]
name = "flow-like-wasm-node-template"
version = "0.1.0"
edition = "2021"
description = "Template for creating Flow-Like WASM nodes in Rust (Component Model)"
license = "MIT"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
# When copying this template outside the repo, replace with: flow-like-wasm-sdk = "0.3"
flow-like-wasm-sdk = "0.2.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
