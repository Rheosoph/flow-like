[package]
name = "flow-like-wasm-node-template"
version = "0.1.0"
edition = "2021"
description = "Template for creating Flow-Like WASM nodes in Rust (Component Model)"
license = "MIT"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The object registry and listener examples need this SDK and a matching runtime.
# When copying the template, keep this dependency pointed at that SDK source.
flow-like-wasm-sdk = { version = "0.3.7", path = "../../libs/wasm-sdk/wasm-sdk-rust", features = ["rig"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
