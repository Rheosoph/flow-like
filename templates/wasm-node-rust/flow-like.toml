description = "Template for creating Flow-Like WASM nodes in Rust"
id = "com.example.custom-node-rust"
keywords = [
    "template",
    "example",
]
license = "MIT"
manifest_version = 1
name = "Custom Node (Rust)"
repository = "https://github.com/example/flow-like-nodes"
version = "0.1.0"

[[authors]]
name = "Your Name"

[[nodes]]
category = "Custom/WASM"
description = "A template WASM node built with Rust"
id = "my_custom_node"
name = "My Custom Node"

[permissions]
memory = "standard"
models = true
streaming = true
timeout = "standard"

[permissions.filesystem]
node_storage = false
user_storage = false

[permissions.network]
allowed_hosts = []
dns_enabled = true
http_enabled = true
tcp_enabled = true
udp_enabled = true
websocket_enabled = true
