name: Build & Release

on:
  push:
    branches: ["*"]
    tags: ["v*"]
  pull_request:
    branches: [main, dev]

env:
  WASI_SDK_VERSION: "25"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install wasi-sdk
        run: |
          curl -fsSL "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux.tar.gz" \
            | tar xz -C "$HOME"
          echo "WASI_SDK_PATH=$HOME/wasi-sdk-${WASI_SDK_VERSION}.0" >> "$GITHUB_ENV"

      - name: Install wasm-tools & wit-bindgen
        run: |
          cargo install wasm-tools
          cargo install wit-bindgen-cli@0.53.1

      - name: Generate WIT bindings
        run: wit-bindgen c --world flow-like-node --out-dir gen wit/flow-like-node.wit

      - name: Build core module
        run: |
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE="$WASI_SDK_PATH/share/cmake/wasi-sdk.cmake" \
            -DWASI_SDK_PATH="$WASI_SDK_PATH"
          make

      - name: Create component
        run: wasm-tools component new build/node.wasm -o node.wasm

      - uses: actions/upload-artifact@v4
        with:
          name: wasm-node
          path: |
            node.wasm
            flow-like.toml
            README.md

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wasm-node
          path: release-files

      - name: Create tarball
        run: tar czf flow-like-node-cpp-${{ github.ref_name }}.tar.gz -C release-files .

      - uses: softprops/action-gh-release@v2
        with:
          files: flow-like-node-cpp-${{ github.ref_name }}.tar.gz
