# Flow-Like Package Manifest
# This file declares your package's metadata, permissions, and node entries.
# The runtime uses this for resource limits, the host allowlist and display
# information, not for capabilities.

manifest_version = 1
wasm_path = "node.wasm"

# --- Package Identity ---
id = "com.example.custom-node-cpp"
name = "Custom Node (C++)"
version = "0.1.0"
description = "Template for creating Flow-Like WASM nodes in C++"
license = "MIT"
repository = "https://github.com/example/flow-like-nodes"
keywords = ["template", "example"]

[[authors]]
name = "Your Name"

# --- Permissions ---
[permissions]
memory = "standard"
timeout = "standard"

# Capabilities (network, storage, database, models, ...) are declared on each
# node in code. The sandbox enforces those, and the registry derives the store's
# capability listing from them, so they are not repeated here. This file only
# sets resource tiers, the outbound host allowlist and OAuth scopes.
[permissions.network]
allowed_hosts = []

# --- Nodes ---
# Each [[nodes]] entry describes a node this package provides.
# For single-node packages, list just one. For multi-node, list all of them.

[[nodes]]
id = "my_custom_node_cpp"
name = "My Custom Node (C++)"
description = "A template WASM node built with C++"
category = "Custom/WASM"
