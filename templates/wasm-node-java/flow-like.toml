# Flow-Like Package Manifest
# This file declares your package's metadata and node entries.
# The runtime uses this for resource limits, the host allowlist and display
# information, not for capabilities.

manifest_version = 1
wasm_path = "target/wasm/classes.wasm"

# --- Package Identity ---
id = "com.example.custom-node-java"
name = "Custom Node (Java)"
version = "0.1.0"
description = "Template for creating Flow-Like WASM nodes in Java (TeaVM)"
license = "MIT"
repository = "https://github.com/example/flow-like-nodes"
keywords = ["template", "example"]

[[authors]]
name = "Your Name"

# --- Permissions ---
[permissions]
memory = "standard"
timeout = "standard"

# Capabilities (network, storage, database, models, ...) come from each node's
# definition, not from this file: the sandbox enforces what the node declares and
# the registry derives the store's capability listing from it. The Java SDK's
# NodeDefinition has no permissions field yet, so a Java node declares none and
# runs without those capabilities. This file only sets resource tiers, the
# outbound host allowlist and OAuth scopes.
[permissions.network]
allowed_hosts = []

# --- Nodes ---
# Each [[nodes]] entry describes a node this package provides.
# For single-node packages, list just one. For multi-node, list all of them.

[[nodes]]
id = "my_custom_node_java"
name = "My Custom Node (Java)"
description = "A template WASM node built with Java (TeaVM)"
category = "Custom/WASM"
