repos:
  -   repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v3.2.0
      hooks:
      -   id: check-yaml
          exclude: |
            (?x)^(
              apps/backend/kubernetes/helm/templates/|
              apps/backend/docker-compose/docker-compose\.external-(datastores|store)\.yml$
            )
      -   id: check-yaml
          name: Check Compose Override Yaml
          # Compose's !reset and !override tags require syntax-only validation.
          args: [--unsafe]
          files: ^apps/backend/docker-compose/docker-compose\.external-(datastores|store)\.yml$
      # -   id: end-of-file-fixer
      -   id: trailing-whitespace

  -   repo: https://github.com/astral-sh/ruff-pre-commit
      # Ruff version.
      rev: v0.9.10
      hooks:
      - id: ruff

