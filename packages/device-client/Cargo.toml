[package]
name = "flow-like-device-client"
version = "0.1.0"
edition = "2024"
description = "Native controller-side transport to Flow-Like devices: hub admission, WebRTC with relay fallback, Noise tunnels and multiplexed streams"

[dependencies]
flow-like-device-crypto.workspace = true
flow-like-device-protocol.workspace = true
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
constant_time_eq.workspace = true
futures-util.workspace = true
http = "1"
http-body-util = "0.1"
hyper.workspace = true
hyper-util.workspace = true
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-tungstenite.workspace = true
tokio-util = "0.7"
tower-service = "0.3"
tracing.workspace = true
uuid.workspace = true
webrtc = "=0.20.5"
zeroize.workspace = true

[target.'cfg(all(unix, not(target_vendor = "apple"), not(target_os = "android")))'.dependencies]
webpki-root-certs = "1"

[dev-dependencies]
anyhow = "1"
tokio = { workspace = true, features = ["full"] }
x25519-dalek = "2"
# Product binaries link both rustls providers; tests reproduce that state.
rustls = { version = "0.23", default-features = false, features = ["ring", "aws_lc_rs", "std", "tls12"] }
