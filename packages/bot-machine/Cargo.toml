[package]
name = "flow-like-bot-machine"
version = "0.1.0"
edition = "2024"
description = "The browser and computer of a bot on a device: local backends, one playground worker process per bot, virtual displays, live frames and owner takeover"

[dependencies]
async-trait.workspace = true
dashmap.workspace = true
flow-like-bot-tools.workspace = true
flow-like-catalog-automation = { workspace = true, features = ["execute"] }
flow-like-types.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "io-std", "sync", "time", "rt", "macros", "fs"] }
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
