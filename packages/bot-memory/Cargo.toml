[package]
name = "flow-like-bot-memory"
version = "0.1.0"
edition = "2024"
description = "A bot's continuous history: compaction, segment summaries and a fact memory that points back into it"

[dependencies]
async-trait.workspace = true
blake3.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
flow-like-model-provider.workspace = true
flow-like-storage = { workspace = true, features = ["database-runtime"] }
flow-like-types.workspace = true
geo = { version = "=0.31.0", default-features = false }
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
