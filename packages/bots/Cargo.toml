[package]
name = "flow-like-bots"
version = "0.1.0"
edition = "2024"
description = "Telegram and Discord bots that run flows on a device"

[features]
default = []
telegram = ["dep:teloxide"]
discord = ["dep:serenity"]

[dependencies]
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tracing.workspace = true
base64.workspace = true
pulldown-cmark = "0.13.1"
teloxide = { version = "0.17", default-features = false, features = ["macros", "rustls", "ctrlc_handler"], optional = true }
serenity = { version = "0.12.4", default-features = false, features = ["client", "gateway", "model", "rustls_backend", "cache"], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
axum.workspace = true
