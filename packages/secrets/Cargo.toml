[package]
name = "flow-like-secrets"
version = "0.1.0"
edition = "2024"
description = "Secret provider abstraction with lazy initialization and secure caching"
license-file = "../../LICENSE"

[dependencies]
async-trait.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["fs", "sync", "time"] }
thiserror.workspace = true
secrecy = "0.10.3"
zeroize.workspace = true
serde_json.workspace = true
aws-config = { workspace = true, features = ["behavior-version-latest"], optional = true }
aws-sdk-ssm = { version = "1", optional = true }
aws-sdk-secretsmanager = { version = "1", optional = true }
google-cloud-secretmanager-v1 = { version = "1.5.0", optional = true }
azure_core = { version = "0.32.0", optional = true }
azure_identity = { version = "0.32.0", optional = true }
azure_security_keyvault_secrets = { version = "0.11.0", optional = true }

[features]
default = []
aws = [
    "dep:aws-config",
    "dep:aws-sdk-ssm",
    "dep:aws-sdk-secretsmanager",
]
gcp = ["dep:google-cloud-secretmanager-v1"]
azure = [
    "dep:azure_core",
    "dep:azure_identity",
    "dep:azure_security_keyvault_secrets",
]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "fs", "time"] }
tempfile = "3.20.0"
