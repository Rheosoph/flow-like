[package]
name = "flow-like-api-entity"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
# Keep generated SeaORM sources in their existing location so schema regeneration does not need a
# second output convention. The target is nevertheless compiled as an independent crate.
path = "src/lib.rs"

[features]
default = []
domain-conversions = [
    "dep:chrono",
    "dep:flow-like",
    "dep:serde_json",
    "flow-like/app",
]

[dependencies]
chrono = { workspace = true, optional = true }
flow-like = { workspace = true, optional = true }
sea-orm.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true, optional = true }
