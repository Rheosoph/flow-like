[package]
name = "flow-like-api-entity"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
domain-conversions = [
    "dep:chrono",
    "dep:flow-like",
    "flow-like/app",
]

[dependencies]
chrono = { workspace = true, optional = true }
flow-like = { workspace = true, optional = true }
sea-orm.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true
