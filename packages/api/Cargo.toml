[package]
name = "flow-like-api"
version = "0.1.0"
edition = "2024"

[build-dependencies]
serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true

[dependencies]
axum.workspace = true
sea-orm.workspace = true
flow-like-api-entity = { workspace = true, features = ["domain-conversions"] }
serde = { workspace = true, features = ["derive", "rc"] }
pin-project-lite = "0.2.16"
tower.workspace = true
flow-like = { workspace = true, features = ["app-runtime", "openapi"] }
flow-like-types.workspace = true
flow-like-storage = { workspace = true, features = ["graph"] }
flow-like-catalog-core.workspace = true
uuid.workspace = true
flow-like-sinks.workspace = true
flow-like-secrets.workspace = true
flow-like-wasm-schema = { workspace = true, features = ["bundle", "nodes", "openapi"] }
tempfile = "3"
serde_json.workspace = true
base64.workspace = true
jsonwebtoken.workspace = true
hyper.workspace = true
hyper-util.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tower-http.workspace = true
chrono.workspace = true
utoipa = { version = "5", features = ["axum_extras", "chrono"] }
utoipa-axum = "0.2"
utoipa-swagger-ui = { version = "9", default-features = false, features = ["axum", "vendored"] }
async-stripe.workspace = true
bitflags.workspace = true
futures.workspace = true
futures-util.workspace = true
bytes.workspace = true
moka.workspace = true
blake3.workspace = true
aes-gcm.workspace = true
getrandom.workspace = true
p256 = "0.13.2"
async-trait.workspace = true
thiserror.workspace = true
parking_lot = "0.12"
hex = "0.4.3"
image.workspace = true
webp.workspace = true
ipnetwork = "0.21.1"
ed25519-dalek = "2.2"
sourcemap.workspace = true

# ---- AWS dependencies ----
aws-config = {workspace = true, optional=true}
aws-sdk-sts = {workspace = true, optional=true}
aws-sdk-sesv2 = {workspace = true, optional=true}
aws-sdk-lambda = {workspace = true, optional=true}
aws-sdk-sqs = {workspace = true, optional=true}
aws-sdk-sns = { version = "1.83.0", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }
aws_lambda_events = { workspace = true, features = ["apigw"], optional = true }
# -----

# ----- Azure dependencies ----
hmac = { version = "0.12" }
sha2 = { version = "0.10" }
rand = { version = "0.9" }
urlencoding = { workspace = true }
flow-like-azure-data = { workspace = true, optional = true }
azure_core = { version = "0.32.0", optional = true }
azure_identity = { version = "0.32.0", optional = true }
azure_storage_common = { version = "0.1.0", optional = true }
azure_storage_sas = { version = "0.1.0", optional = true }
quick-xml = { version = "0.39.2", features = ["serialize"], optional = true }
time = { version = "0.3.47", features = ["parsing"], optional = true }
# -----

# ----- GCP dependencies ----
rsa = { version = "0.9", optional = true }
flow-like-gcp-data = { workspace = true, optional = true }
# -----

# ----- Cognito dependencies ----
aws-sdk-cognitoidentityprovider = {version="1.89.0", default-features=false, features=["default-https-client", "rt-tokio"], optional=true}
# -----

# ----- Mail dependencies ----
lettre = {workspace = true, optional=true}
reqwest = {workspace = true}
async-stream = "0.3"
eventsource-stream = "0.2"
# -----

# ----- Sentry (optional) ----
sentry = { workspace = true, optional = true }
# -----

# ----- Kubernetes dependencies ----
kube = { workspace = true, optional = true }
k8s-openapi = { workspace = true, optional = true }
# -----

# ----- State store dependencies ----
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"], optional = true }
tokio = { workspace = true, features = ["sync", "time"], optional = true }
aws-sdk-dynamodb = { workspace = true, optional = true }
aws-sdk-s3 = { workspace = true, optional = true }
# -----

[features]
default = ["aws", "cognito", "ses", "smtp", "sendgrid"]
secrets-aws = ["flow-like-secrets/aws"]
secrets-gcp = ["flow-like-secrets/gcp"]
secrets-azure = ["flow-like-secrets/azure"]
aws = ["aws-config", "aws-sdk-sts", "aws-sdk-sns", "flow-like-sinks/aws"]
azure = [
    "urlencoding",
    "dep:azure_core",
    "dep:azure_identity",
    "dep:azure_storage_common",
    "dep:azure_storage_sas",
    "dep:quick-xml",
    "dep:time",
    "dep:tokio",
]
# GCP provider surface: RS256 assertion signing for the service-account-key path
# and the metadata-server/STS token exchange behind every scoped credential. Data
# planes (`firestore`, `pubsub`) stay separate so a deployment that only needs GCS
# scoped credentials never compiles a state store it does not use — the same split
# `azure` keeps from `cosmos`/`storage-queue`.
gcp = ["rsa", "urlencoding", "dep:tokio"]
r2 = []  # Cloudflare R2 with proprietary temp credentials API
cognito = ["aws-sdk-cognitoidentityprovider", "aws-config"]
ses = ["aws-sdk-sesv2", "aws-config"]
smtp = ["lettre"]
sendgrid = []
acs-email = ["dep:azure_core", "dep:azure_identity", "dep:tokio"]
local = []
kubernetes = ["kube", "k8s-openapi", "flow-like-sinks/kubernetes"]
lambda = ["aws-config", "aws-sdk-lambda", "aws_lambda_events"]
sqs = ["aws-config", "aws-sdk-sqs"]
# Azure Queue Storage dispatch. The `Put Message` REST call is issued directly
# with `reqwest`, so only the Entra credential surface is pulled in.
storage-queue = ["dep:azure_core", "dep:azure_identity"]
# Pub/Sub dispatch. The `Publish` REST call is issued directly with `reqwest`
# against a metadata-server token, so no Google SDK is pulled in.
pubsub = ["dep:tokio"]
# State store backends
redis = ["dep:redis", "dep:tokio"]
dynamodb = ["aws-config", "aws-sdk-dynamodb", "dep:tokio"]  # Uses FlowLikeStore (object_store) for large payloads
cosmos = ["dep:flow-like-azure-data", "dep:tokio"]
firestore = ["dep:flow-like-gcp-data", "dep:tokio"]
s3 = ["aws-config", "aws-sdk-s3"]
sentry = ["dep:sentry"]
full=[
    "aws",
    "azure",
    "gcp",
    "r2",
    "local",
    "ses",
    "smtp",
    "sendgrid",
    "acs-email",
    "redis",
    "dynamodb",
    "cosmos",
    "firestore",
    "storage-queue",
    "pubsub",
    "s3",
    "sentry",
]
urlencoding = []

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
dotenv = { workspace = true }
flow-like-wasm.workspace = true
