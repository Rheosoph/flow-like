[package]
name = "flow-like-api"
version = "0.1.0"
edition = "2024"

[build-dependencies]
serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true
flow-like-types.workspace = true
reqwest = { workspace = true, features = ["blocking"] }

[dependencies]
axum.workspace = true
sea-orm.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
pin-project-lite = "0.2.16"
tower.workspace = true
flow-like = { workspace = true, features = ["openapi"] }
flow-like-types.workspace = true
flow-like-storage = { workspace = true, features = ["graph"] }
flow-like-catalog-core.workspace = true
uuid.workspace = true
flow-like-sinks.workspace = true
flow-like-secrets.workspace = true
flow-like-wasm = { workspace = true, features = ["openapi"] }
serde_json.workspace = true
base64.workspace = true
jsonwebtoken.workspace = true
hyper.workspace = true
hyper-util.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tower-http.workspace = true
chrono.workspace = true
utoipa = { version = "5", features = ["axum_extras", "chrono"] }
utoipa-axum = "0.2"
utoipa-swagger-ui = { version = "9", features = ["axum"] }
async-stripe.workspace = true
bitflags.workspace = true
futures.workspace = true
futures-util.workspace = true
bytes.workspace = true
moka.workspace = true
blake3.workspace = true
aes-gcm.workspace = true
getrandom.workspace = true
p256 = "0.13.2"
async-trait.workspace = true
thiserror.workspace = true
parking_lot = "0.12"
hex = "0.4.3"
regex = "1.11"
image.workspace = true
webp.workspace = true
ipnetwork = "0.21.1"
ed25519-dalek = "2.2"

# ---- AWS dependencies ----
aws-config = {workspace = true, optional=true}
aws-sdk-sts = {workspace = true, optional=true}
aws-sdk-sesv2 = {workspace = true, optional=true}
aws-sdk-lambda = {workspace = true, optional=true}
aws-sdk-sqs = {workspace = true, optional=true}
aws-sdk-sns = { version = "1.83.0", optional = true }
aws_lambda_events = { workspace = true, features = ["apigw"], optional = true }
# -----

# ----- Azure dependencies ----
hmac = { version = "0.12" }
sha2 = { version = "0.10" }
rand = { version = "0.9" }
urlencoding = { workspace = true }
# -----

# ----- GCP dependencies ----
rsa = { version = "0.9", optional = true }
# -----

# ----- Cognito dependencies ----
aws-sdk-cognitoidentityprovider = {version="1.89.0", optional=true}
# -----

# ----- Mail dependencies ----
lettre = {workspace = true, optional=true}
reqwest = {workspace = true}
async-stream = "0.3"
eventsource-stream = "0.2"
# -----

# ----- Sentry (optional) ----
sentry = { workspace = true, optional = true }
# -----

# ----- Kubernetes dependencies ----
kube = { workspace = true, optional = true }
k8s-openapi = { workspace = true, optional = true }
# -----

# ----- State store dependencies ----
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"], optional = true }
tokio = { workspace = true, features = ["sync", "time"], optional = true }
aws-sdk-dynamodb = { version = "1", optional = true }
aws-sdk-s3 = { version = "1", optional = true }
# -----

[features]
default = ["aws", "cognito", "ses", "smtp", "sendgrid"]
secrets-aws = ["flow-like-secrets/aws"]
secrets-gcp = ["flow-like-secrets/gcp"]
secrets-azure = ["flow-like-secrets/azure"]
aws = ["aws-config", "aws-sdk-sts", "aws-sdk-sns", "flow-like-sinks/aws"]
azure = ["urlencoding"]
gcp = ["rsa", "urlencoding"]
r2 = []  # Cloudflare R2 with proprietary temp credentials API
cognito = ["aws-sdk-cognitoidentityprovider", "aws-config"]
ses = ["aws-sdk-sesv2", "aws-config"]
smtp = ["lettre"]
sendgrid = []
local = []
kubernetes = ["kube", "k8s-openapi", "flow-like-sinks/kubernetes"]
lambda = ["aws-config", "aws-sdk-lambda", "aws_lambda_events"]
sqs = ["aws-config", "aws-sdk-sqs"]
# State store backends
redis = ["dep:redis", "dep:tokio"]
dynamodb = ["aws-config", "aws-sdk-dynamodb"]  # Uses FlowLikeStore (object_store) for large payloads
s3 = ["aws-config", "aws-sdk-s3"]
sentry = ["dep:sentry"]
full=[
    "aws",
    "azure",
    "gcp",
    "r2",
    "local",
    "ses",
    "smtp",
    "sendgrid",
    "redis",
    "dynamodb",
    "s3",
    "sentry",
]
urlencoding = []

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
dotenv = { workspace = true }
