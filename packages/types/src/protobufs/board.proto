syntax = "proto3";

package flow_like_types;

import "google/protobuf/timestamp.proto";
import "node.proto";
import "pin.proto";
import "variable.proto";
import "comment.proto";
import "a2ui.proto";

enum ExecutionStage {
  DEV = 0;
  INT = 1;
  QA = 2;
  PRE_PROD = 3;
  PROD = 4;
}

enum LogLevel {
  DEBUG = 0;
  INFO = 1;
  WARN = 2;
  ERROR = 3;
  FATAL = 4;
}

enum ExecutionMode {
  EXECUTION_MODE_HYBRID = 0;
  EXECUTION_MODE_REMOTE = 1;
  EXECUTION_MODE_LOCAL = 2;
}

enum LayerType {
  FUNCTION = 0;
  MACRO = 1 [deprecated = true];
  COLLAPSED = 2;
  MODULE = 3;
}

enum LayerCacheScope {
  LAYER_CACHE_SCOPE_APP = 0;
  LAYER_CACHE_SCOPE_USER = 1;
}

message LayerCache {
  bool enabled = 1;
  string prefix = 2;
  optional uint64 ttl_seconds = 3;
  LayerCacheScope scope = 4;
}

message Layer {
  string id = 1;
  optional string parent_id = 2;
  string name = 3;
  LayerType type = 4;
  map<string, Node> nodes = 5;
  map<string, Variable> variables = 6;
  map<string, Comment> comments = 7;
  float coord_x = 8;
  float coord_y = 9;
  float coord_z = 10;
  map<string, Pin> pins = 11;
  optional string comment = 12;
  optional string error = 13;
  optional string color = 14;
  optional uint64 hash = 15;
  optional float coord_x_in = 16;
  optional float coord_y_in = 17;
  optional float coord_z_in = 18;
  optional float coord_x_out = 19;
  optional float coord_y_out = 20;
  optional float coord_z_out = 21;
  optional LayerCache cache = 22;
  optional string category = 23;
}


message Board {
  string id = 1;
  string name = 2;
  string description = 3;
  map<string, Node> nodes = 4;
  map<string, Variable> variables = 5;
  map<string, Comment> comments = 6;
  float viewport_x = 7;
  float viewport_y = 8;
  float viewport_zoom = 9;
  uint32 version_major = 10;
  uint32 version_minor = 11;
  uint32 version_patch = 12;
  ExecutionStage stage = 13;
  LogLevel log_level = 14;
  map<string, string> refs = 15;
  google.protobuf.Timestamp created_at = 16;
  google.protobuf.Timestamp updated_at = 17;
  map<string, Layer> layers = 18;
  repeated string page_ids = 19;
  ExecutionMode execution_mode = 20;
  optional uint64 hash = 21;
  // Host-owned durable bookkeeping. This is persisted with the board so a
  // mutation and its receipt share one object-store commit, but it is not part
  // of the workflow schema and must never be exposed through Board JSON.
  map<string, string> internal_refs = 22;
}
