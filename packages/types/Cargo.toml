[package]
name = "flow-like-types"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.97"
async-stream = "0.3.6"
async-trait.workspace = true
bytes = "1.10.1"
flow-like-types-contracts = { workspace = true, features = ["all"] }
flow-like-types-proto.workspace = true
rand = "0.9.0"
reqwest = { workspace = true, features = ["stream", "gzip", "brotli", "socks", "http2", "multipart"] }
schemars.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
dashmap = { workspace = true, features = ["serde", "rayon", "inline"] }
futures.workspace = true
image.workspace = true
imageproc = { workspace = true, optional = true }
webp.workspace = true
base64.workspace=true
mime_guess = "2.0.5"
reqwest-eventsource = "0.6.0"
minijinja = "2.9.0"
rxing = { version = "0.7.1", features = ["serde", "image"], optional = true }
ab_glyph = { version = "0.2.29", optional = true }
tokio-util = "0.7.15"
cuid2 = { git = "https://github.com/Rheosoph/cuid-rust.git", package = "cuid2" }
jsonschema = { workspace = true, optional = true }
regex.workspace = true
tracing.workspace = true

[features]
# Preserve the former public dependency re-exports for direct/default users.
# Workspace consumers disable defaults at the root and opt into only the
# lightweight type surface they actually use.
default = ["compat-reexports"]
compat-reexports = ["dep:ab_glyph", "dep:imageproc", "dep:jsonschema", "dep:rxing"]
