[package]
name = "flow-like-types"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.97"
async-stream = "0.3.6"
async-trait.workspace = true
bytes = "1.10.1"
prost = "0.14.1"
prost-types = "0.14.1"
rand = "0.9.0"
reqwest = { workspace = true, features = ["stream", "gzip", "brotli", "socks", "http2", "multipart"] }
schemars.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
dashmap = { workspace = true, features = ["serde", "rayon", "inline"] }
futures.workspace = true
image.workspace = true
imageproc.workspace = true
webp.workspace = true
base64.workspace=true
mime_guess = "2.0.5"
reqwest-eventsource = "0.6.0"
minijinja = "2.9.0"
rxing = { version = "0.7.1", features = ["serde", "image"] }
ab_glyph = "0.2.29"
tokio-util = "0.7.15"
cuid2 = { git = "https://github.com/Rheosoph/cuid-rust.git", package = "cuid2" }
jsonschema = "0.33.0"
regex.workspace = true
rkyv.workspace = true
thiserror = "2.0"
lz4_flex = "0.11.6"

[build-dependencies]
prost-build = "0.13.5"
