[package]
name = "flow-like-types-contracts"
version = "0.1.0"
edition = "2024"

[features]
default = ["all"]
all = ["cache", "channel", "realtime", "dispatch", "maintenance", "geometry", "storage-paths", "data-classification", "bot", "inbox", "bot-task", "device-bot"]
geometry = ["dep:serde_json", "dep:schemars"]
data-classification = ["dep:schemars"]
bot = ["dep:schemars", "dep:unicode-normalization"]
bot-task = ["inbox", "dep:chrono", "dep:chrono-tz", "dep:cron"]
device-bot = ["bot", "inbox", "data-classification", "dep:serde_json"]
inbox = ["dep:blake3", "dep:serde_json", "dep:schemars"]
cache = ["dep:schemars"]
channel = ["dep:serde_json", "dep:schemars"]
realtime = ["dep:serde_json", "dep:schemars", "channel", "inbox"]
dispatch = ["dep:blake3", "dep:serde_json", "channel"]
maintenance = ["cache"]
storage-paths = ["dep:blake3"]

[dependencies]
blake3 = { version = "1.8.2", optional = true }
chrono = { version = "0.4.41", default-features = false, features = ["std", "clock"], optional = true }
chrono-tz = { version = "0.10.4", optional = true }
cron = { version = "0.15.0", optional = true }
schemars = { version = "1.1.0", features = ["preserve_order"], optional = true }
serde = { version = "1.0.219", features = ["derive", "rc"] }
serde_json = { version = "1.0.134", optional = true }
unicode-normalization = { version = "0.1.25", optional = true }

[dev-dependencies]
serde_json = "1.0.134"
