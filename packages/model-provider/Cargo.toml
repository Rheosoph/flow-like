[package]
name = "flow-like-model-provider"
version = "0.1.0"
edition = "2024"

[features]
# default = ["local-ml"]
default = []
local-ml = ["dep:ort", "dep:tempfile", "image/default-formats", "image/rayon"]
# Remote ML execution via API proxy (for executors without local model capabilities)
remote-ml = []
# Execution feature - alias for local-ml for consistency across catalog crates
execute = ["local-ml"]

# Execution Provider features - these enable GPU/NPU acceleration
# Note: These are compile-time optional. At runtime, the EP gracefully falls back to CPU if unavailable.
# CUDA requires NVIDIA GPU with CUDA toolkit installed
cuda = ["ort/cuda"]
# TensorRT requires NVIDIA GPU with TensorRT runtime (often faster than CUDA for inference).
# Keep CUDA registered behind it as the device fallback when TensorRT cannot take a model.
tensorrt = ["cuda", "ort/tensorrt"]
# CoreML is Apple-only (macOS, iOS, tvOS) - compiles on all platforms but only activates on Apple
coreml = ["ort/coreml"]
# DirectML session settings are applied by the shared ONNX session builder.
directml = ["ort/directml"]
# NNAPI is Android-only and uses the device's available accelerator drivers
nnapi = ["ort/nnapi"]
# XNNPACK - optimized CPU inference for ARM and x86. Off by default: ORT claims Softmax nodes
# with a dynamic axis for it below opset 13 and then reads past the tensor, so only enable this
# for a deployment whose models are all exported at opset 13 or later. See `ml/ort_runtime.rs`.
xnnpack = ["ort/xnnpack"]

[dependencies]
bytes.workspace = true
reqwest-rig = { package = "reqwest", version = "0.13", default-features = false, features = ["rustls"] }
flow-like-model-protocol.workspace = true
flow-like-types-contracts.workspace = true
anyhow = "1.0.97"
async-trait.workspace = true
async-stream = "0.3.6"
image = { version = "0.25.6", default-features = false }
rand = "0.9.0"
regex.workspace = true
reqwest-eventsource = "0.6.0"
tokio = { workspace = true, features = ["io-util", "process", "net", "time", "sync", "macros", "rt"] }
serde_json.workspace = true
base64 = "0.22"
text-splitter = {version = "0.27.0", features = ["markdown", "tokenizers", "tiktoken-rs"]}
tokenizers = {version="0.22.2", default-features = false, features = ["onig"]}
schemars.workspace = true
futures.workspace = true
tracing.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
tiktoken-rs = "0.7.0"
aws-types = "1.5.0"
ndarray.workspace = true
tempfile = { version = "3.20.0", optional = true }
rig.workspace = true
rig-vertexai.workspace = true
google-cloud-auth.workspace = true
http = "1.4.0"
jsonschema.workspace = true
reqwest = { workspace = true, features = ["stream", "gzip", "brotli", "socks", "http2", "multipart"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Upstream ort >= rc.11 carries the iOS static-linking support (pykeio/ort#430) that
# previously required the Rheosoph fork. Pinning rc.12 alongside face_id keeps
# a single onnxruntime native link in the graph.
ort = { version = "=2.0.0-rc.12", features = ["api-24", "coreml", "copy-dylibs", "download-binaries", "ndarray", "xnnpack"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
ort = { version = "=2.0.0-rc.12", features = ["api-24", "copy-dylibs", "directml", "download-binaries", "ndarray", "xnnpack"], optional = true }

[target.'cfg(not(any(target_os = "ios", target_os = "tvos", target_os = "android", target_os = "macos", target_os = "windows")))'.dependencies]
ort = { version = "=2.0.0-rc.12", features = ["api-24", "copy-dylibs", "download-binaries", "ndarray", "xnnpack"], optional = true }

[target.'cfg(any(target_os = "ios", target_os = "tvos"))'.dependencies]
# Mobile targets use the vendored ORT 1.24.3 runtime and must not download or copy host binaries.
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["api-24", "coreml", "ndarray", "tracing", "xnnpack"], optional = true }

[target.'cfg(target_os = "android")'.dependencies]
# Android's full ORT 1.24.3 runtime includes NNAPI and XNNPACK. NNAPI registration falls back
# cleanly when a device driver or a model operation is unsupported; XNNPACK is compiled in but
# only registered by an explicit `xnnpack` build (see the feature comment above).
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["api-24", "ndarray", "nnapi", "xnnpack"], optional = true }
ndk-sys = "0.6"

[dev-dependencies]
blake3.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
dotenv = "0.15.0"

[[example]]
name = "embedding_probe"
required-features = ["local-ml"]
