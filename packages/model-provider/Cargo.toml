[package]
name = "flow-like-model-provider"
version = "0.1.0"
edition = "2024"

[features]
# default = ["local-ml"]
default = []
local-ml = ["dep:ort", "dep:fastembed"]
# Remote ML execution via API proxy (for executors without local model capabilities)
remote-ml = ["dep:reqwest"]
# Execution feature - alias for local-ml for consistency across catalog crates
execute = ["local-ml"]

# Execution Provider features - these enable GPU/NPU acceleration
# Note: These are compile-time optional. At runtime, the EP gracefully falls back to CPU if unavailable.
# CUDA requires NVIDIA GPU with CUDA toolkit installed
cuda = ["ort/cuda"]
# TensorRT requires NVIDIA GPU with TensorRT runtime (often faster than CUDA for inference)
tensorrt = ["ort/tensorrt"]
# CoreML is Apple-only (macOS, iOS, tvOS) - compiles on all platforms but only activates on Apple
coreml = ["ort/coreml"]
# DirectML is Windows-only - compiles on all platforms but only activates on Windows
directml = ["ort/directml"]
# XNNPACK - highly optimized CPU inference for ARM and x86 (great for mobile/edge)
xnnpack = ["ort/xnnpack"]

[dependencies]
flow-like-types.workspace = true
base64 = "0.22"
text-splitter = {version = "0.27.0", features = ["markdown", "tokenizers", "tiktoken-rs"]}
tokenizers = {version="0.22.2", default-features = false, features = ["onig"]}
schemars.workspace = true
futures.workspace = true
tracing.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
tiktoken-rs = "0.7.0"
aws-config = { workspace = true, features = ["behavior-version-latest"] }
aws-sdk-bedrockruntime = "1.101.0"
ndarray.workspace = true
rig.workspace = true
rig-vertexai.workspace = true
google-cloud-auth.workspace = true
rmcp.workspace = true
http = "1.4.0"
reqwest = { workspace = true, optional = true }

[target.'cfg(not(any(target_os = "ios", target_os = "tvos", target_os = "android")))'.dependencies]
# We can enable the standard ort crate again with the next release, when PR: https://github.com/pykeio/ort/pull/430 is merged and released.
# ort = { version = "=2.0.0-rc.10", features = ["download-binaries", "copy-dylibs", "ndarray"] }
#fastembed = { version = "5.2.0", default-features = false, features = ["ort-download-binaries"] }
ort = { git = "https://github.com/Rheosoph/ort.git", rev = "1d64032", features = ["download-binaries", "copy-dylibs", "ndarray"], optional = true }
fastembed = { git = "https://github.com/Rheosoph/fastembed-rs.git", rev = "784042c", default-features = false, features = ["ort-download-binaries"], optional = true }


[target.'cfg(any(target_os = "ios", target_os = "tvos", target_os = "android"))'.dependencies]
# Mobile targets: no prebuilt binaries available for download, so disable download-binaries and copy-dylibs
#ort = { version = "=2.0.0-rc.10", default-features = false, features=["ndarray"] }
#fastembed = { version = "5.2.0", default-features = false, features = []}
ort = { git = "https://github.com/Rheosoph/ort.git", rev = "1d64032", default-features = false, features=["ndarray"], optional = true }
fastembed = { git = "https://github.com/Rheosoph/fastembed-rs.git", rev = "784042c", default-features = false, features = [], optional = true }

[dev-dependencies]
dotenv = "0.15.0"
