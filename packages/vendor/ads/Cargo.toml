[package]
edition = "2018"
rust-version = "1.63"
name = "ads"
version = "0.4.4"
authors = ["Georg Brandl <g.brandl@fz-juelich.de>"]
build = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Client for the Beckhoff Automation Device Specification protocol for PLCs"
keywords = [
    "Beckhoff",
    "ADS",
    "automation",
    "device",
    "PLC",
]
license = "MIT/Apache-2.0"
repository = "https://github.com/birkenfeld/ads-rs"

[lib]
name = "ads"
path = "src/lib.rs"

[dependencies.byteorder]
version = "1.5.0"

[dependencies.crossbeam-channel]
version = "0.5.13"

[dependencies.itertools]
version = "0.13.0"

[dependencies.thiserror]
version = "1.0.63"

[dependencies.zerocopy]
version = "0.7.35"
features = ["derive"]

[dev-dependencies.chrono]
version = "0.4.38"

[dev-dependencies.clap]
version = "3.2.25"
features = ["derive"]

[dev-dependencies.once_cell]
version = "1.19.0"

[dev-dependencies.parse_int]
version = "0.6.0"

[dev-dependencies.quick-xml]
version = "0.36.1"

[dev-dependencies.regex]
version = "<1.10.0"

[dev-dependencies.strum]
version = "0.26.3"
features = ["derive"]
