[package]
name = "flow-like-storage-files"
version = "0.1.0"
edition = "2024"

[dependencies]
flow-like-types.workspace = true
object_store = { version = "0.12.4", features = ["gcp", "aws", "azure", "serde", "serde_json", "cloud"] }
chrono = { workspace = true, optional = true }
smb2 = { version = "0.11.3", optional = true }
blake3 = { workspace = true, features = ["rayon"] }
futures.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
urlencoding.workspace = true
schemars.workspace = true
base64.workspace = true
percent-encoding.workspace = true
infer = "0.19.0"

[features]
default = ["smb"]
smb = ["dep:chrono", "dep:smb2"]
tauri = []

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
