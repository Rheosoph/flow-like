[package]
name = "flow-like-storage-files"
version = "0.1.0"
edition = "2024"

[dependencies]
flow-like-types-contracts.workspace = true
flow-like-types-data-url.workspace = true
anyhow = "1.0.97"
async-trait.workspace = true
bytes = "1.10.1"
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
mime_guess = "2.0.5"
reqwest = { workspace = true, features = ["gzip", "brotli", "socks", "http2"] }
tokio = { workspace = true, features = ["sync", "fs", "io-util"] }
tempfile = "3"
object_store = { version = "=0.13.2", features = ["gcp", "aws", "azure", "serde", "serde_json", "cloud"] }
# Lance 13 is built on object_store 0.14; DataFusion and the file stores stay on 0.13.
lance_object_store = { package = "object_store", version = "=0.14.1", features = ["gcp", "aws", "azure"], optional = true }
chrono = { workspace = true, optional = true }
smb2 = { version = "0.12.1", optional = true }
blake3 = { workspace = true, features = ["rayon"] }
futures.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
urlencoding.workspace = true
schemars.workspace = true
base64.workspace = true
percent-encoding.workspace = true
tracing.workspace = true
infer = "0.19.0"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["fs"] }

[features]
default = ["smb"]
smb = ["dep:chrono", "dep:smb2"]
tauri = []
# Stores and caches handed to Lance, on object_store 0.14.
lance = ["dep:lance_object_store"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
