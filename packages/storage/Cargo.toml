[package]
name = "flow-like-storage"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { version = "1", optional = true }
flow-like-storage-files = { workspace = true, optional = true }
flow-like-storage-contracts = { workspace = true, features = ["all"], optional = true }
flow-like-types = { workspace = true, optional = true }
flow-like-geometry = { workspace = true, optional = true }
geodatafusion = { version = "=0.5.0", optional = true }
geoarrow-array = { version = "=0.8.0", optional = true }
# DataFusion 54 and the file stores stay on object_store 0.13; Lance 13 needs 0.14.
# Every store handed to Lance implements `lance_object_store` directly.
object_store = { version = "=0.13.2", features = ["gcp", "aws", "azure", "serde", "serde_json", "cloud"], optional = true }
lance_object_store = { package = "object_store", version = "=0.14.1", features = ["gcp", "aws", "azure"], optional = true }
chrono = { workspace = true, optional = true }
# fp16kernels are not supported on Windows (lance skips compiling the C kernels for MSVC)
# 0.40 is the newest LanceDB release on DataFusion 54, shared by the Delta,
# Iceberg and federated providers. Upgrade this group together.
lancedb = { version = "=0.40.0", features = ["remote", "aws", "azure", "gcs"], optional = true }
lance-io = { version = "=13.0.0", optional = true }
lance = { version = "=13.0.0", default-features = false, features = ["geo"], optional = true }
lance-datafusion = { version = "=13.0.0", optional = true }
lance-index = { version = "=13.0.0", features = ["geo"], optional = true }
lance-file = { version = "=13.0.0", optional = true }
lance-table = { version = "=13.0.0", optional = true }
arrow-array = { version = "=58.4.0", optional = true }
arrow-schema = { version = "=58.4.0", features = ["serde"], optional = true }
arrow = { version = "=58.4.0", optional = true }
serde_arrow = { version = "0.14.2", features = ["arrow-58"], optional = true }
blake3 = { workspace = true, features = ["rayon"], optional = true }
futures = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive", "rc"], optional = true }
schemars = { workspace = true, optional = true }
sqlparser = { workspace = true, optional = true }
# `sql` is required for `ctx.sql` and `DFParser`. Placeholder discovery uses the direct,
# lightweight `sqlparser` dependency above and therefore does not activate DataFusion.
datafusion = { version = "=54.1.0", default-features = false, features = ["sql", "recursive_protection", "regex_expressions", "string_expressions", "unicode_expressions", "array_expressions", "nested_expressions", "math_expressions", "datetime_expressions", "parquet"], optional = true }
num_cpus = { version = "1.16", optional = true }

# Graph query engine
# The graph fork preserves our graph behavior while sharing DataFusion 54.
lance-graph = { git = "https://github.com/Rheosoph/lance-graph.git", rev = "e260cf67a15e9da0e76edb7896b0022db9e5005e", default-features = false, optional = true }
serde_json = { version = "1", optional = true }
tokio = { version = "1", features = ["time", "sync"], optional = true }
petgraph = { version = "0.8", optional = true }
tracing = { workspace = true, optional = true }

# Data lake formats share Arrow 58 and DataFusion 54 with LanceDB. Neither has a
# release on DataFusion 54, so both come from fork branches of upstream main.
deltalake = { git = "https://github.com/Rheosoph/delta-rs.git", rev = "37ee982736b645b4d3f79a5d59e680add229a58c", optional = true, default-features = false, features = ["datafusion", "rustls"] }

# Federation support for query push-down to remote databases
datafusion-federation = { version = "=0.5.5", optional = true }

iceberg = { git = "https://github.com/Rheosoph/iceberg-rust.git", rev = "c8fc70e5dcf4591a4c0d834223b4c7078ddb28c2", optional = true }
iceberg-datafusion = { git = "https://github.com/Rheosoph/iceberg-rust.git", rev = "c8fc70e5dcf4591a4c0d834223b4c7078ddb28c2", optional = true }

[target.'cfg(all(any(target_os = "macos", target_os = "linux"), any(target_arch = "x86_64", target_arch = "aarch64")))'.dependencies]
lancedb = { version = "=0.40.0", features = ["fp16kernels"], optional = true }

[dev-dependencies]
jsonb = { version = "=0.5.6", default-features = false, features = ["databend"] }
# `tokio` is only a regular dependency under `graph`, but the parameter-binding tests
# execute real DataFusion queries and must run without that feature too.
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[features]
default = ["files", "database-runtime", "smb"]

# Object/file stores without Lance, Arrow, or DataFusion. This is the feature to use for
# metadata, board, media, and artifact paths that only need object storage.
files = ["dep:flow-like-storage-files"]
smb = ["files", "flow-like-storage-files/smb"]

# SQL/filter placeholder discovery is kept independent of the database runtime because
# FlowScript reconciliation needs it while editing metadata.
query-parser = ["dep:anyhow", "dep:serde_json", "dep:sqlparser"]

# Lance/Arrow/DataFusion implementation layer. Default-on preserves the historical public
# surface; focused consumers can opt into only `files` or `query-parser`.
database-runtime = [
    "files",
    "query-parser",
    "dep:flow-like-types",
    "dep:flow-like-geometry",
    "dep:geodatafusion",
    "dep:geoarrow-array",
    "dep:object_store",
    "dep:lance_object_store",
    "flow-like-storage-files/lance",
    "dep:chrono",
    "dep:blake3",
    "dep:futures",
    "dep:serde",
    "dep:schemars",
    "dep:flow-like-storage-contracts",
    "dep:lancedb",
    "dep:lance-io",
    "dep:lance",
    "dep:lance-datafusion",
    "dep:lance-index",
    "dep:lance-file",
    "dep:lance-table",
    "dep:arrow-array",
    "dep:arrow-schema",
    "dep:arrow",
    "dep:serde_arrow",
    "dep:async-trait",
    "dep:datafusion",
    "dep:num_cpus",
]

tauri = ["files", "flow-like-storage-files/tauri"]

# Data lake features
delta = ["database-runtime", "dep:deltalake"]
iceberg = ["database-runtime", "dep:iceberg", "dep:iceberg-datafusion"]
all-lakes = ["delta", "iceberg"]

# Graph query engine
graph = ["database-runtime", "dep:lance-graph", "dep:serde_json", "dep:tokio", "dep:petgraph", "dep:tracing"]

# Federation feature for query push-down
federation = ["database-runtime", "dep:datafusion-federation"]

# Full feature set
full = ["all-lakes", "federation", "graph"]
