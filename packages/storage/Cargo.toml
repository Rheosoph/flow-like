[package]
name = "flow-like-storage"
version = "0.1.0"
edition = "2024"

[dependencies]
flow-like-types.workspace = true
object_store = {version="0.12.4", features = ["gcp", "aws", "azure", "serde", "serde_json", "cloud"] }
# fp16kernels are not supported on Windows (lance skips compiling the C kernels for MSVC)
lancedb = { version = "=0.27.2", features = ["polars", "remote", "aws", "azure", "gcs"] }
lance-io = { version = "=4.0.0" }
lance = { version = "=4.0.0", default-features = false }
lance-file = { version = "=4.0.0" }
polars = "0.39.2"
polars-arrow = "0.39.2"
arrow-array = "=57.2.0"
arrow-schema = { version = "=57.2.0", features = ["serde"] }
arrow = "=57.2.0"
serde_arrow = { version = "0.13.7", features = ["arrow-57"] }
blake3 = {workspace=true, features = ["rayon"]}
futures.workspace = true
async-trait.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
futures-channel = "0.3.31"
crossbeam-channel = "0.5.15"
futures-util = "0.3.31"
urlencoding.workspace = true
schemars.workspace = true
base64.workspace = true
datafusion = { version = "=52.5.0", default-features = false, features = ["recursive_protection", "regex_expressions", "string_expressions", "unicode_expressions", "array_expressions", "nested_expressions", "math_expressions", "datetime_expressions", "parquet"] }
num_cpus = "1.16"
percent-encoding.workspace = true
infer = "0.19.0"
rig-core.workspace = true
rmcp.workspace = true

# Graph query engine
lance-graph = { git = "https://github.com/TM9657/lance-graph", branch = "main", default-features = false, optional = true }
serde_json = { version = "1", optional = true }
tokio = { version = "1", features = ["time", "sync"], optional = true }

# Data lake formats - Delta Lake 0.31.x aligns with Arrow 57 and DataFusion 52.
deltalake = { version = "=0.31.1", optional = true, default-features = false, features = ["datafusion", "rustls"] }

# Federation support for query push-down to remote databases
datafusion-federation = { version = "=0.4.14", optional = true }

# Iceberg 0.9.x aligns with Arrow 57 and DataFusion 52.
iceberg = { version = "=0.9.0", optional = true }
iceberg-datafusion = { version = "=0.9.0", optional = true }

[target.'cfg(all(any(target_os = "macos", target_os = "linux"), any(target_arch = "x86_64", target_arch = "aarch64")))'.dependencies]
lancedb = { version = "=0.27.2", features = ["fp16kernels"] }

[features]
tauri = []
default = []

# Data lake features
delta = ["deltalake"]
iceberg = ["dep:iceberg", "dep:iceberg-datafusion"]
all-lakes = ["delta", "iceberg"]

# Graph query engine
graph = ["dep:lance-graph", "dep:serde_json", "dep:tokio"]

# Federation feature for query push-down
federation = ["datafusion-federation"]

# Full feature set
full = ["all-lakes", "federation", "graph"]
