[package]
name = "flow-like-storage-contracts"
version = "0.1.0"
edition = "2024"

[features]
default = ["all"]
all = ["graph", "vector"]
graph = ["dep:schemars", "dep:serde"]
vector = ["dep:arrow-schema"]

[dependencies]
anyhow = "1"
arrow-schema = { version = "=57.2.0", features = ["serde"], optional = true }
async-trait = "0.1.89"
schemars = { version = "1.1.0", features = ["preserve_order"], optional = true }
serde = { version = "1.0.219", features = ["derive", "rc"], optional = true }
serde_json = "1.0.134"
