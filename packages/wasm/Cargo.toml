[package]
name = "flow-like-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly runtime for Flow-Like custom nodes"
license = "MIT"
repository = "https://github.com/Rheosoph/flow-like"

[dependencies]
# WASM Runtime
wasmtime = { workspace = true }
wasmtime-wasi = { workspace = true }
wasmtime-wasi-http = { workspace = true }
hyper = { workspace = true }

# Flow-Like dependencies
flow-like-wasm-schema = { workspace = true, features = ["bundle", "nodes"] }
flow-like-types.workspace = true
flow-like-storage.workspace = true
flow-like = { workspace = true, features = ["model"] }
flow-like-model-provider.workspace = true
flow-like-catalog-core.workspace = true
flow-like-catalog-llm.workspace = true

# Schema generation
schemars.workspace = true
once_cell = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Hashing for module caching
blake3.workspace = true
# Error handling
thiserror = "2"
anyhow = "1"

# Async
tokio = { version = "1", features = ["sync", "rt", "fs"] }
futures = "0.3"
async-trait = "0.1"

# Concurrency
parking_lot = "0.12"
dashmap.workspace = true
ahash.workspace = true

# HTTP Client
reqwest.workspace = true

# WebSocket Client
tokio-tungstenite.workspace = true

# Directories
dirs-next = "2"

# Logging
tracing = "0.1"

# Cryptographically secure randomness
getrandom.workspace = true

# Utilities
bytes = "1"
bitflags = "2"
chrono = { version = "0.4", features = ["serde"] }
toml.workspace = true
base64 = "0.22"
utoipa = { version = "5", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
wat = "1"

[features]
default = ["component-model"]
# Enable full WASI preview support
wasi = []
# Enable Component Model support (for Python, etc.)
component-model = ["wasmtime/component-model"]
# Enable model/embedding support for WASM host functions, including the
# authenticated embedding proxy used by hosted/remote-capable Bits.
model = ["flow-like/model", "flow-like/remote-ml"]
# Enable OpenAPI schema generation
openapi = ["dep:utoipa", "flow-like/openapi", "flow-like-wasm-schema/openapi"]
# Enable all cranelift backends for cross-compilation
all-arch = ["wasmtime/all-arch"]
# Load WASM modules directly from a URL (`WasmEngine::load_module_from_url`).
# reqwest is already an unconditional dependency, so no dep gating is needed.
http = []
