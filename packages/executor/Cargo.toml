[package]
name = "flow-like-executor"
version = "0.1.0"
edition = "2021"
description = "Environment-agnostic execution runtime for Flow-Like"

[features]
# Preserve the historical metadata-only catalog for direct/default consumers.
# Workspace products disable defaults and select one of the complete bundles
# below so a remote-only runtime does not regain ONNX metadata by unification.
default = ["portable-metadata"]
benchmarks = [
    "flow-like-catalog/compat",
    "dep:flow-like-catalog-data",
    "dep:flow-like-catalog-std-ui",
    "tokio/full",
]
portable-metadata = ["flow-like-catalog/portable-metadata"]
# Compatibility aliases retain their historical all-implementation semantics.
execute = ["flow-like-catalog/execute"]
all-execute = ["flow-like-catalog/all-execute"]
server-execute = ["flow-like-catalog/server-execute", "code-sandbox", "bot-tools-heavy"]
all-server-execute = ["flow-like-catalog/all-server-execute"]
# Product-oriented bundles make the runtime capability selection obvious.
server = ["flow-like-catalog/server", "code-sandbox", "bot-tools-heavy"]
server-local-ml = ["flow-like-catalog/server-local-ml"]
executor = ["flow-like-catalog/executor", "code-sandbox", "bot-tools-heavy"]
executor-local-ml = ["flow-like-catalog/executor-local-ml"]
local-runtime = ["flow-like-catalog/local-runtime"]
local-runtime-ml = ["flow-like-catalog/local-runtime-ml"]
local-ml = ["flow-like-catalog/local-ml"]
local-ml-cuda = ["local-ml", "flow-like-runtime/local-ml-cuda", "flow-like-catalog/local-ml-cuda"]
local-ml-tensorrt = ["local-ml-cuda", "flow-like-runtime/local-ml-tensorrt", "flow-like-catalog/local-ml-tensorrt"]
training-cpu = ["flow-like-catalog/training-cpu"]
training-auto = ["flow-like-catalog/training-auto"]
training-wgpu = ["training-cpu", "flow-like-catalog/training-wgpu"]
training-cuda = ["training-cpu", "flow-like-catalog/training-cuda"]
training-rocm = ["training-cpu", "flow-like-catalog/training-rocm"]
training-onnx-export = ["training-cpu", "flow-like-catalog/training-onnx-export"]
sensor-opcua = ["flow-like-catalog/sensor-opcua"]
sensor-genicam = ["flow-like-catalog/sensor-genicam"]
tauri = ["flow-like-catalog/tauri"]
code-sandbox = ["dep:flow-like-catalog-code-interpreter", "flow-like-bot-tools?/code"]
# `POST /tool`: bot tool jobs. The light set (files, knowledge, data on Lance tables) needs only this;
# `bot-tools-heavy` adds documents, file sources and the database drivers.
bot-tools = ["dep:flow-like-bot-tools", "dep:flow-like-bot-tools-host", "dep:async-trait", "flow-like-bot-tools/mcp"]
bot-tools-heavy = ["bot-tools", "flow-like-bot-tools/documents", "flow-like-bot-tools/connectors"]
# Cloud channel transports; each executor binary enables exactly its own cloud.
channel-aws = ["flow-like-channels/aws"]
channel-azure = ["flow-like-channels/azure"]
channel-gcp = ["flow-like-channels/gcp"]
channel-nats = ["flow-like-channels/nats"]

[dependencies]
flow-like-runtime = { workspace = true, features = ["flow-metadata", "flow-runtime", "model"] }
flow-like-types.workspace = true
flow-like-storage.workspace = true
flow-like-catalog.workspace = true
flow-like-wasm = { workspace = true, features = ["model"] }
flow-like-channels.workspace = true
flow-like-catalog-data = { workspace = true, optional = true, features = ["execute"] }
flow-like-catalog-code-interpreter = { workspace = true, optional = true, features = ["execute"] }
flow-like-catalog-std-ui = { workspace = true, optional = true, features = ["execute"] }
flow-like-bot-tools = { workspace = true, optional = true, features = ["data"] }
flow-like-bot-tools-host = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }

blake3.workspace = true
moka.workspace = true
wasmtime.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tracing.workspace = true
chrono.workspace = true
reqwest.workspace = true
tokio = { version = "1", features = ["sync", "time"] }
axum.workspace = true
futures-util.workspace = true
thiserror.workspace = true

# JWT verification
jsonwebtoken.workspace = true
base64 = "0.22"
p256 = { version = "0.13", features = ["pkcs8", "pem"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

[[example]]
name = "widget_action_bench"
required-features = ["benchmarks"]
