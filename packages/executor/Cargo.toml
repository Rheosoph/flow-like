[package]
name = "flow-like-executor"
version = "0.1.0"
edition = "2021"
description = "Environment-agnostic execution runtime for Flow-Like"

[features]
# Preserve the historical metadata-only catalog for direct/default consumers.
# Workspace products disable defaults and select one of the complete bundles
# below so a remote-only runtime does not regain ONNX metadata by unification.
default = ["portable-metadata"]
portable-metadata = ["flow-like-catalog/portable-metadata"]
# Compatibility aliases retain their historical all-implementation semantics.
execute = ["flow-like-catalog/execute"]
all-execute = ["flow-like-catalog/all-execute"]
server-execute = ["flow-like-catalog/server-execute"]
all-server-execute = ["flow-like-catalog/all-server-execute"]
# Product-oriented bundles make the runtime capability selection obvious.
server = ["flow-like-catalog/server"]
server-local-ml = ["flow-like-catalog/server-local-ml"]
executor = ["flow-like-catalog/executor"]
executor-local-ml = ["flow-like-catalog/executor-local-ml"]
local-runtime = ["flow-like-catalog/local-runtime"]
local-runtime-ml = ["flow-like-catalog/local-runtime-ml"]
local-ml = ["flow-like-catalog/local-ml"]
local-ml-cuda = ["local-ml", "flow-like-runtime/local-ml-cuda", "flow-like-catalog/local-ml-cuda"]
local-ml-tensorrt = ["local-ml-cuda", "flow-like-runtime/local-ml-tensorrt", "flow-like-catalog/local-ml-tensorrt"]
tauri = ["flow-like-catalog/tauri"]
# Cloud channel transports; each executor binary enables exactly its own cloud.
channel-aws = ["flow-like-channels/aws"]
channel-azure = ["flow-like-channels/azure"]
channel-gcp = ["flow-like-channels/gcp"]

[dependencies]
flow-like-runtime = { workspace = true, features = ["flow-metadata", "flow-runtime", "model"] }
flow-like-types.workspace = true
flow-like-storage.workspace = true
flow-like-catalog.workspace = true
flow-like-wasm = { workspace = true, features = ["model"] }
flow-like-channels.workspace = true

blake3.workspace = true
moka.workspace = true
wasmtime.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tracing.workspace = true
chrono.workspace = true
reqwest.workspace = true
tokio = { version = "1", features = ["sync", "time"] }
axum.workspace = true
futures-util.workspace = true
thiserror.workspace = true

# JWT verification
jsonwebtoken.workspace = true
base64 = "0.22"
p256 = { version = "0.13", features = ["pkcs8", "pem"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
