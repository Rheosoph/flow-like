[package]
name = "flow-like-ml-burn"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
default = ["cpu"]
engine = ["dep:burn", "dep:sha2"]
cpu = ["engine", "burn/flex"]
wgpu = ["engine", "burn/wgpu"]
cuda = ["engine", "burn/cuda", "dep:libloading"]
rocm = ["engine", "burn/rocm", "dep:libloading"]
training-auto = ["cpu", "dep:flow-like-ml-platform", "dep:libloading"]
onnx-export = ["engine", "dep:burn-onnx"]

[dependencies]
flow-like-ml-core = { path = "../core" }
flow-like-ml-platform = { path = "../platform", optional = true, features = ["automatic"] }
burn = { version = "=0.22.0", optional = true, default-features = false, features = ["std", "autodiff", "store", "optim"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = { version = "0.10", optional = true }
burn-onnx = { version = "=0.22.0", optional = true, default-features = false, features = ["export"] }
schemars = { version = "1", features = ["derive"] }
libloading = { version = "0.8", optional = true }

[dev-dependencies]
tempfile = "3"
