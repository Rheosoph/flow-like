[package]
name = "flow-like-catalog"
version = "0.1.0"
edition = "2024"

[features]
# Preserve the historical aggregate API for direct/default callers, including
# the CachedDB re-export. Workspace products inherit default-features=false and
# should prefer the friendly bundles below, so everyday metadata checks stay
# off the database implementation.
default = ["all-metadata", "compat"]
compat = ["flow-like-catalog-core/execute"]

package-std = ["dep:flow-like-catalog-std"]
package-data = ["dep:flow-like-catalog-data"]
package-web = ["dep:flow-like-catalog-web"]
package-media = ["dep:flow-like-catalog-media"]
package-ml = ["dep:flow-like-catalog-ml"]
package-onnx = ["dep:flow-like-catalog-onnx"]
package-llm = ["dep:flow-like-catalog-llm"]
package-processing = ["dep:flow-like-catalog-processing"]
package-geo = ["dep:flow-like-catalog-geo"]
package-automation = ["dep:flow-like-catalog-automation"]
# Product catalogs omit nodes whose optional runtime implementation is absent.
# Metadata tooling leaves this disabled so it can inspect every valid node.
runtime-catalog = []
portable-metadata = [
    "package-std",
    "package-data",
    "package-web",
    "package-media",
    "package-ml",
    "package-onnx",
    "package-llm",
    "package-processing",
    "package-geo",
]
# Metadata for remote-only execution. ONNX nodes require the local inference
# runtime, so advertising them in this bundle creates catalog entries whose
# implementations can only return a feature-disabled error.
remote-metadata = [
    "runtime-catalog",
    "package-std",
    "package-data",
    "package-web",
    "package-media",
    "package-ml",
    "package-llm",
    "package-processing",
    "package-geo",
]
# Metadata advertised by APIs paired with a local-ML server executor. The API
# can describe ONNX nodes without linking their execution dependencies.
server-local-metadata = ["remote-metadata", "package-onnx"]
# Metadata paired with executors that also ship desktop/RPA automation.
executor-local-metadata = ["server-local-metadata", "package-automation"]
all-metadata = [
    "portable-metadata",
    "package-automation",
]

# Product-oriented bundles keep the CLI/task UX simple. Applications select one intent rather
# than reproducing a long and easy-to-drift feature list.
desktop = ["all-execute", "tauri", "local-ml", "local-tts", "local-stt", "local"]
desktop-apple = [
    "desktop",
    "local-tts-metal",
    "local-tts-accelerate",
    "local-stt-metal",
    "local-stt-accelerate",
]
mobile = [
    "portable-all",
    "portable-execute",
    "tauri",
    "local-ml",
    "local-tts",
    "local-stt",
    "local",
]
mobile-apple = [
    "mobile",
    "local-tts-metal",
    "local-tts-accelerate",
    "local-stt-metal",
    "local-stt-accelerate",
]
# Remote-only headless bundle used by deployments that deliberately do not
# ship a native inference runtime. The historical `server-execute` feature
# remains compatibility-complete below; product crates should use this bundle.
server = ["remote-all", "portable-execute", "remote"]
server-local-ml = ["server", "package-onnx", "local-ml"]
executor = [
    "remote-all",
    "portable-execute",
    "package-automation",
    "flow-like-catalog-automation/execute",
    "remote",
]
executor-local-ml = ["executor", "local-ml"]
# Self-contained local runtime bundle. Depending on this feature alone must
# enable both the package cfg flags used by get_catalog() and their execution
# implementations; relying on a sibling executor dependency to unify `all`
# made the advertised bundle silently empty in isolation.
local-runtime = [
    "remote-all",
    "portable-execute",
    "package-automation",
    "flow-like-catalog-automation/execute",
    "remote",
]
local-runtime-ml = ["local-runtime", "local-ml"]

# Execution environment - determines how interactions are handled
# local: Desktop app with polling-based interactions
# remote: Server execution with SSE-based interactions via API
local = [
    "package-data",
    "package-web",
    "flow-like-catalog-data/local",
    "flow-like-catalog-web/local",
]
remote = [
    "package-data",
    "package-web",
    "flow-like-catalog-data/remote",
    "flow-like-catalog-web/remote",
]

local-ml = [
    "package-std",
    "package-data",
    "package-web",
    "package-media",
    "package-ml",
    "package-onnx",
    "package-llm",
    "package-processing",
    "flow-like-catalog-core/local-ml",
    "flow-like-catalog-std/local-ml",
    "flow-like-catalog-data/local-ml",
    "flow-like-catalog-web/local-ml",
    "flow-like-catalog-media/local-ml",
    "flow-like-catalog-ml/local-ml",
    "flow-like-catalog-onnx/local-ml",
    "flow-like-catalog-llm/local-ml",
    "flow-like-catalog-processing/local-ml",
]
# NVIDIA ORT distributions are deployment-specific, so expose them as opt-ins.
# Feature unification applies the provider to ONNX nodes and core FastEmbed sessions.
local-ml-cuda = ["local-ml", "flow-like-catalog-onnx/cuda"]
local-ml-tensorrt = ["local-ml-cuda", "flow-like-catalog-onnx/tensorrt"]
local-tts = ["package-media", "flow-like-catalog-media/local-tts"]
local-tts-metal = ["local-tts", "flow-like-catalog-media/local-tts-metal"]
local-tts-cuda = ["local-tts", "flow-like-catalog-media/local-tts-cuda"]
local-tts-accelerate = ["local-tts", "flow-like-catalog-media/local-tts-accelerate"]
local-stt = ["package-media", "flow-like-catalog-media/local-stt"]
local-stt-metal = ["local-stt", "flow-like-catalog-media/local-stt-metal"]
local-stt-cuda = ["local-stt", "flow-like-catalog-media/local-stt-cuda"]
local-stt-accelerate = ["local-stt", "flow-like-catalog-media/local-stt-accelerate"]
remote-ml = [
    "package-llm",
    "flow-like-catalog-core/remote-ml",
    "flow-like-catalog-llm/remote-ml",
]
tauri = [
    "package-llm",
    "flow-like-catalog-llm/tauri",
]
mimalloc = ["dep:mimalloc"]


# Portable execution support shared by desktop, mobile, and headless runtimes.
# Automation is deliberately separate because that package has no iOS/Android
# nodes. ONNX execution is also separate because it requires local inference.
# `local-ml` enables it only for products that opt in, leaving the base `server`
# bundle remote-only.
portable-execute = [
    "runtime-catalog",
    "remote-ml",
    "flow-like-catalog-core/execute",
    "flow-like-catalog-std/execute",
    "flow-like-catalog-data/execute",
    "flow-like-catalog-web/execute",
    "flow-like-catalog-media/execute",
    "flow-like-catalog-ml/execute",
    "flow-like-catalog-llm/execute",
    "flow-like-catalog-processing/execute",
    "flow-like-catalog-geo/execute",
]

# Historical execution feature: enables every node implementation, including
# local ONNX inference and desktop/RPA automation. APIs that only serve catalog
# metadata should NOT enable this. New products should prefer the named bundles
# above so their local-inference intent is visible in their manifest.
execute = [
    "all-metadata",
    "portable-execute",
    "flow-like-catalog-automation/execute",
    "local-ml",
]

# Historical server execution surface: all portable implementations, including
# local ONNX inference, but no desktop/RPA automation. `server` is the new
# remote-only product bundle; `server-local-ml` states the old behavior
# explicitly.
server-execute = ["portable-metadata", "portable-execute", "local-ml"]

# Data lake formats
delta = ["package-data", "flow-like-catalog-data/delta"]
iceberg = ["package-data", "flow-like-catalog-data/iceberg"]
all-lakes = ["delta", "iceberg"]

# Database providers
postgres = ["package-data", "flow-like-catalog-data/postgres"]
mysql = ["package-data", "flow-like-catalog-data/mysql"]
sqlite = ["package-data", "flow-like-catalog-data/sqlite"]
duckdb = ["package-data", "flow-like-catalog-data/duckdb"]
clickhouse = ["package-data", "flow-like-catalog-data/clickhouse"]
flight = ["package-data", "flow-like-catalog-data/flight"]
bigquery = ["package-data", "flow-like-catalog-data/bigquery"]
odbc = ["package-data", "flow-like-catalog-data/odbc"]
# ODBC excluded by default - requires system library (unixodbc on macOS/Linux)
all-databases = ["postgres", "mysql", "sqlite", "duckdb", "clickhouse", "flight", "bigquery"]
all-databases-with-odbc = ["all-databases", "odbc"]

# Federation support
federation = ["package-data", "flow-like-catalog-data/federation"]
postgres-federation = ["package-data", "flow-like-catalog-data/postgres-federation"]
mysql-federation = ["package-data", "flow-like-catalog-data/mysql-federation"]
# Explicit rustls variants (transparent — postgres/mysql already use rustls under the hood)
sqlite-federation = ["package-data", "flow-like-catalog-data/sqlite-federation"]
duckdb-federation = ["package-data", "flow-like-catalog-data/duckdb-federation"]
clickhouse-federation = ["package-data", "flow-like-catalog-data/clickhouse-federation"]
odbc-federation = ["package-data", "flow-like-catalog-data/odbc-federation"]
# ODBC excluded by default - requires system library (unixodbc on macOS/Linux)
all-databases-federation = ["postgres-federation", "mysql-federation", "sqlite-federation", "duckdb-federation", "clickhouse-federation"]
all-databases-federation-with-odbc = ["all-databases-federation", "odbc-federation"]

# Full feature bundle (all databases + federation + data lakes) - catalog metadata only
# ODBC excluded by default to avoid runtime crashes if unixodbc is not installed
all = ["all-metadata", "all-lakes", "all-databases", "all-databases-federation"]
all-with-odbc = ["all-metadata", "all-lakes", "all-databases-with-odbc", "all-databases-federation-with-odbc"]
portable-all = ["portable-metadata", "all-lakes", "all-databases", "all-databases-federation"]
remote-all = ["remote-metadata", "all-lakes", "all-databases", "all-databases-federation"]

# Full with execution (for executors and desktop app)
all-execute = ["all", "execute"]

# Full with server execution (no RPA/desktop automation)
all-server-execute = ["portable-all", "server-execute"]

[dependencies]
flow-like-catalog-core.workspace = true
flow-like-catalog-std = { workspace = true, optional = true }
flow-like-catalog-data = { workspace = true, optional = true }
flow-like-catalog-web = { workspace = true, optional = true }
flow-like-catalog-media = { workspace = true, optional = true }
flow-like-catalog-ml = { workspace = true, optional = true }
flow-like-catalog-onnx = { workspace = true, optional = true }
flow-like-catalog-llm = { workspace = true, optional = true }
flow-like-catalog-processing = { workspace = true, optional = true }
flow-like-catalog-geo = { workspace = true, optional = true }
flow-like-catalog-automation = { workspace = true, optional = true }
mimalloc = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
criterion = { version = "0.7", features = ["html_reports", "async_tokio"] }
rkyv.workspace = true
flow-like.workspace = true
flow-like-ast.workspace = true
flow-like-types.workspace = true
flow-like-storage.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[[bench]]
name = "flow_bench"
harness = false

[[bench]]
name = "throughput_bench"
harness = false

[[bench]]
name = "allocator_bench"
harness = false

[[bench]]
name = "exec_bench"
harness = false
