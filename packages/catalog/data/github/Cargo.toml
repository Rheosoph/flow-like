[package]
name = "flow-like-catalog-data-github"
version = "0.1.0"
edition = "2024"

[features]
default = []
execute = ["flow-like-catalog-core/execute", "dep:jsonwebtoken", "dep:git2"]
local-ml = ["flow-like-catalog-core/local-ml"]

[dependencies]
flow-like-catalog-core.workspace = true
flow-like-runtime = { workspace = true, features = ["flow-metadata"] }
flow-like-types.workspace = true
schemars.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
flow-like-catalog-data-support.workspace = true
flow-like-storage.workspace = true
uuid.workspace = true
base64.workspace = true
urlencoding.workspace = true
git2 = { workspace = true, optional = true }
jsonwebtoken = { workspace = true, optional = true }

[build-dependencies]
flow-like-catalog-build-helper.workspace = true

[dev-dependencies]
git2.workspace = true
futures.workspace = true
rsa = "0.9"
rand = "0.8"
