[package]
name = "flow-like-catalog-ml"
version = "0.1.0"
edition = "2024"

[features]
default = []
local-ml = ["flow-like-catalog-core/local-ml"]
# Execution feature - enables heavy ML dependencies for node execution
execute = [
    "flow-like-catalog-core/execute",
    "dep:linfa",
    "dep:linfa-datasets",
    "dep:linfa-clustering",
    "dep:linfa-nn",
    "dep:linfa-linear",
    "dep:linfa-reduction",
    "dep:linfa-svm",
    "dep:linfa-bayes",
    "dep:linfa-trees",
    "dep:linfa-logistic",
    "dep:linfa-elasticnet",
    "dep:linfa-ensemble",
    "dep:linfa-preprocessing",
    "dep:linfa-tsne",
    "dep:rand_xoshiro",
    "dep:flow-like-ordinal",
    "dep:fory",
    "dep:fory-core",
    "dep:rmp-serde",
]

[dependencies]
flow-like-catalog-core.workspace = true
flow-like-runtime = { workspace = true, features = ["flow-metadata"] }
flow-like-types.workspace = true
flow-like-model-provider.workspace = true
flow-like-storage = { workspace = true, default-features = false }
flow-like-catalog-macros.workspace = true
ahash.workspace = true
tracing.workspace = true
schemars.workspace = true
futures.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
uuid.workspace = true
async-trait.workspace = true
# linfa 0.8 is built against ndarray 0.16, so this catalog stays on 0.16 while the ort-backed
# catalogs (onnx, model-provider) track the workspace ndarray 0.17 required by ort rc.12.
ndarray = "0.16"

# ML dependencies - only included when execute feature is enabled
linfa = { version = "0.8.0", features = ["serde"], optional = true }
linfa-datasets = { version = "0.8.0", features = ["generate"], optional = true }
linfa-clustering = { version = "0.8.0", features = ["serde"], optional = true }
linfa-nn = { version = "0.8.0", features = ["serde"], optional = true }
linfa-linear = { version = "0.8.0", features = ["serde"], optional = true }
linfa-reduction = { version = "0.8.0", features = ["serde"], optional = true }
linfa-svm = { version = "0.8.0", features = ["serde"], optional = true }
linfa-bayes = { version = "0.8.1", features = ["serde"], optional = true }
linfa-trees = { version = "0.8.1", features = ["serde"], optional = true }
linfa-logistic = { version = "0.8.1", features = ["serde"], optional = true }
linfa-elasticnet = { version = "0.8.1", features = ["serde"], optional = true }
linfa-ensemble = { version = "0.8.1", optional = true }
linfa-preprocessing = { version = "0.8.1", features = ["serde"], optional = true }
# linfa-tsne publishes no serde feature; t-SNE is transductive, so nothing is persisted.
linfa-tsne = { version = "0.8.1", optional = true }
# linfa 0.8 is built against rand 0.8, while flow_like_types::rand is 0.9. Seeded RNGs handed to
# linfa must therefore come from the rand 0.8 ecosystem; rand_xoshiro is what linfa itself uses.
rand_xoshiro = { version = "0.6", optional = true }

# Ordinal targets (low < medium < high). linfa has no estimator for ordered classes, so these live
# in a dependency-light crate of their own rather than bloating this catalog's build.
flow-like-ordinal = { workspace = true, optional = true, features = ["serde"] }

# Binary serialization - schema-safe, fast, cross-language
fory = { version = "0.14.1", optional = true }
fory-core = { version = "0.14.1", optional = true }
rmp-serde = { version = "1.3", optional = true }

[build-dependencies]
flow-like-catalog-build-helper.workspace = true
