[package]
name = "flow-like-catalog-automation"
version = "0.1.0"
edition = "2024"

[features]
default = []
local-ml = ["flow-like-catalog-core/local-ml"]
# Execution feature - enables heavy dependencies for node execution
execute = [
    "flow-like-catalog-core/execute",
    "dep:thirtyfour",
    "dep:enigo",
    "dep:rdev",
    "dep:xcap",
    "dep:rustautogui",
    "dep:rig",
    "dep:jsonschema",
    "dep:arboard",
]

[dependencies]
flow-like-catalog-core.workspace = true
flow-like = { workspace = true, default-features = false, features = ["flow-metadata"] }
flow-like-types.workspace = true
flow-like-model-provider.workspace = true
flow-like-storage = { workspace = true, default-features = false }
flow-like-catalog-macros.workspace = true
ahash.workspace = true
tracing.workspace = true
schemars.workspace = true
futures.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "process"] }
uuid.workspace = true
async-trait.workspace = true
chrono.workspace = true

# LLM integration for self-healing automation
rig = { workspace = true, optional = true }
jsonschema = { workspace = true, optional = true }

# Image encoding
image = { workspace = true }

# Desktop-only deps — not available on iOS / Android
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
thirtyfour = { version = "0.36.1", optional = true }
enigo = { version = "0.6.1", optional = true }
# Pinned: see apps/desktop/src-tauri/Cargo.toml — 0.8.2+ needs PipeWire >= 1.4 headers.
xcap = { version = "=0.8.1", optional = true }
arboard = { version = "3.5", optional = true }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
rustautogui = { version = "2.5", optional = true, features = ["dev"] }

[target.'cfg(windows)'.dependencies]
rustautogui = { version = "2.5", optional = true }

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
rdev = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
rdev = { workspace = true, optional = true, features = ["x11", "wayland"] }

[dev-dependencies]
serde_json = { workspace = true }

[build-dependencies]
flow-like-catalog-build-helper.workspace = true
