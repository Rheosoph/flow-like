[package]
name = "flow-like-catalog-automation"
version = "0.1.0"
edition = "2024"

[features]
default = []
local-ml = ["flow-like-catalog-core/local-ml"]
# Execution feature - enables heavy dependencies for node execution
execute = [
    "flow-like-catalog-std-ui/local-clipboard",
    "flow-like-catalog-core/execute",
    "dep:thirtyfour",
    "dep:enigo",
    "dep:rdev",
    "dep:xcap",
    "dep:rustautogui",
    "dep:rig",
    "dep:jsonschema",
    "dep:arboard",
    "dep:imageproc",
    "dep:tokio-tungstenite",
    "dep:atspi",
    "dep:ashpd",
    "dep:libwayshot-xcap",
    "dep:x11rb",
    "dep:http",
    "dep:windows",
]

[dependencies]
flow-like-catalog-std-ui = { workspace = true }
flow-like-catalog-core.workspace = true
flow-like-runtime = { workspace = true, features = ["flow-metadata"] }
flow-like-types.workspace = true
flow-like-model-provider.workspace = true
flow-like-storage = { workspace = true, default-features = false }
flow-like-catalog-macros.workspace = true
ahash.workspace = true
tracing.workspace = true
schemars.workspace = true
futures.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "process"] }
uuid.workspace = true
async-trait.workspace = true
chrono.workspace = true

# LLM integration for self-healing automation
rig = { workspace = true, optional = true }
jsonschema = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
http = { version = "1", optional = true }

# Image encoding
image = { workspace = true }
imageproc = { workspace = true, optional = true }

# Desktop-only deps — not available on iOS / Android
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
thirtyfour = { version = "0.36.1", optional = true }
enigo = { version = "0.6.1", optional = true }
xcap = { version = "0.8.1", optional = true }
arboard = { version = "3.5", optional = true }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
rustautogui = { version = "2.5", optional = true, features = ["dev"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", optional = true, features = ["Win32_UI_Accessibility", "Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
rdev = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
atspi = { version = "0.25", features = ["zbus"], optional = true }
ashpd = { version = "0.12.1", default-features = false, features = ["async-std"], optional = true }
libwayshot-xcap = { version = "0.3.2", optional = true }
x11rb = { version = "0.13", optional = true }
rdev = { workspace = true, optional = true, features = ["x11", "wayland"] }

[dev-dependencies]
serde_json = { workspace = true }

[build-dependencies]
flow-like-catalog-build-helper.workspace = true
