[package]
name = "flow-like-catalog-media-document"
version = "0.1.0"
edition = "2024"

[features]
default = []
local-ml = ["flow-like-catalog-core/local-ml"]
execute = ["flow-like-catalog-core/execute", "dep:zip", "dep:quick-xml", "dep:lopdf", "dep:pulldown-cmark", "dep:flate2"]

[dependencies]
flow-like-catalog-core.workspace = true
flow-like = { package = "flow-like-runtime", path = "../../core/runtime", default-features = false, features = ["flow-metadata"] }
flow-like-types.workspace = true
schemars.workspace = true
bytes.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
async-trait.workspace = true
http = "1.4.0"
zip = { version = "8.2.0", default-features = false, features = ["deflate-flate2-zlib-rs"], optional = true }
quick-xml = { version = "0.39.2", features = ["serialize"], optional = true }
lopdf = { version = "0.39.0", optional = true }
pulldown-cmark = { version = "0.13.1", optional = true }
flate2 = { workspace = true, optional = true }

[build-dependencies]
flow-like-catalog-build-helper.workspace = true
