[package]
name = "flow-like-catalog-std-text"
version = "0.1.0"
edition = "2024"

[features]
default = []
local-ml = ["flow-like-catalog-core/local-ml", "flow-like-catalog-std-support/local-ml"]
execute = [
    "flow-like-catalog-core/execute",
    "flow-like-catalog-std-support/execute",
    "dep:futures",
    "dep:htmd",
    "dep:pulldown-cmark",
    "dep:csv-async",
    "dep:flate2",
]

[dependencies]
flow-like-catalog-core = { workspace = true, default-features = false }
flow-like = { package = "flow-like-runtime", path = "../../core/runtime", default-features = false, features = ["flow-metadata"] }
flow-like-types = { workspace = true }
flow-like-catalog-std-support = { workspace = true }
flow-like-storage = { workspace = true, default-features = false }
ahash = { workspace = true }
futures = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive", "rc"] }
schemars = { workspace = true }
uuid = { workspace = true, features = ["v7"] }
strsim = "0.11.1"
regex = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
urlencoding = { workspace = true }
unicode-segmentation = "1.13"
sha2 = "0.11"
md-5 = "0.11"
aes-gcm = { workspace = true }
chacha20poly1305 = { workspace = true }
zeroize = { workspace = true }
htmd = { version = "0.5.0", optional = true }
pulldown-cmark = { version = "0.13.1", optional = true }
csv-async = { version = "1.3.0", features = ["tokio"], optional = true }
flate2 = { workspace = true, optional = true }

[build-dependencies]
flow-like-catalog-build-helper.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
