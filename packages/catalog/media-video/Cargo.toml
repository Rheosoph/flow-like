[package]
name = "flow-like-catalog-media-video"
version = "0.1.0"
edition = "2024"

[features]
default = []
local-ml = ["flow-like-catalog-core/local-ml"]
execute = ["flow-like-catalog-core/execute", "dep:video-utils-rs", "dep:symphonia", "dep:re_mp4", "dep:zip"]

[dependencies]
flow-like-catalog-core.workspace = true
flow-like-catalog-embedding.workspace = true
flow-like-runtime = { workspace = true, features = ["flow-metadata"] }
flow-like-types.workspace = true
flow-like-model-provider.workspace = true
flow-like-storage = { workspace = true, default-features = false }
google-cloud-auth.workspace = true
schemars.workspace = true
bytes.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
async-trait.workspace = true
http = "1.4.0"
zip = { version = "8.2.0", default-features = false, features = ["deflate-flate2-zlib-rs"], optional = true }
video-utils-rs = { git = "https://github.com/Rheosoph/video-utils-rs.git", rev = "b4c9185504f98b1eb8eb9d34c8baa0b6f5f8cab4", default-features = false, features = ["portable-core", "platform-codecs", "audio-io", "image-io", "preview", "codec-h264-rust", "codec-h265-rust", "codec-av1-rust", "codec-openh264-ffi", "codec-apple", "codec-android", "codec-windows", "codec-gstreamer", "codec-web"], optional = true }
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "adpcm", "aiff", "flac", "isomp4", "mkv", "mp1", "mp2", "mp3", "ogg", "pcm", "vorbis", "wav"], optional = true }
re_mp4 = { version = "0.5.0", optional = true }
flow-like-catalog-media-support.workspace = true

[build-dependencies]
flow-like-catalog-build-helper.workspace = true

[dev-dependencies]
tempfile = "3.20.0"
