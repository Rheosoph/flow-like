[package]
name = "flow-like-catalog-std"
version = "0.1.0"
edition = "2024"

[features]
default = []
local-ml = ["flow-like-catalog-core/local-ml"]
# Execution feature - enables heavy dependencies for node execution
execute = [
    "flow-like-catalog-core/execute",
    "flow-like-catalog-data/execute",
    "dep:fasteval",
    "dep:nalgebra",
    "dep:htmd",
    "dep:csv-async",
    "dep:csv",
    "dep:fake",
    "dep:rand",
]

[dependencies]
flow-like-catalog-core.workspace = true
flow-like.workspace = true
flow-like-types.workspace = true
flow-like-model-provider.workspace = true
flow-like-storage.workspace = true
flow-like-catalog-macros.workspace = true
flow-like-catalog-data.workspace = true
ahash.workspace = true
tracing.workspace = true
schemars.workspace = true
futures.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
uuid.workspace = true
async-trait.workspace = true
strsim = "0.11.1"
regex.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
iana-time-zone.workspace = true
once_cell = "1.21.3"
urlencoding.workspace = true
sha2 = "0.11"
md-5 = "0.11"

# Computation dependencies - only included when execute feature is enabled
fasteval = { version = "0.2.4", optional = true }
nalgebra = { version = "0.34.0", optional = true }
htmd = { version = "0.5.0", optional = true }
csv-async = { version = "1.3.0", features = ["tokio"], optional = true }
csv = { version = "1.3", optional = true }
fake = { version = "4", features = ["derive"], optional = true }
rand = { version = "0.9", optional = true }

[build-dependencies]
flow-like-catalog-build-helper.workspace = true
