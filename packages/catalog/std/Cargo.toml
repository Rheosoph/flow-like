[package]
name = "flow-like-catalog-std"
version = "0.1.0"
edition = "2024"

[features]
default = []
local-ml = [
    "flow-like-catalog-core/local-ml",
    "flow-like-catalog-std-ui/local-ml",
    "flow-like-catalog-std-values/local-ml",
    "flow-like-catalog-std-numbers/local-ml",
    "flow-like-catalog-std-text/local-ml",
    "flow-like-catalog-std-runtime/local-ml",
    "flow-like-catalog-std-support/local-ml",
]
execute = [
    "flow-like-catalog-core/execute",
    "flow-like-catalog-std-ui/execute",
    "flow-like-catalog-std-values/execute",
    "flow-like-catalog-std-numbers/execute",
    "flow-like-catalog-std-text/execute",
    "flow-like-catalog-std-runtime/execute",
    "flow-like-catalog-std-support/execute",
]

[dependencies]
flow-like-catalog-core = { workspace = true, default-features = false }
flow-like-catalog-std-ui.workspace = true
flow-like-catalog-std-values.workspace = true
flow-like-catalog-std-numbers.workspace = true
flow-like-catalog-std-text.workspace = true
flow-like-catalog-std-runtime.workspace = true
flow-like-catalog-std-support.workspace = true

[dev-dependencies]
flow-like = { package = "flow-like-runtime", path = "../../core/runtime", default-features = false, features = ["flow-metadata"] }
flow-like-types.workspace = true
flow-like-storage = { workspace = true, default-features = false }
futures.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
