[package]
name = "flow-like-catalog-web"
version = "0.1.0"
edition = "2024"

[features]
default = []
local-ml = ["flow-like-catalog-core/local-ml", "flow-like-catalog-web-telegram/local-ml", "flow-like-catalog-web-discord/local-ml", "flow-like-catalog-web-mail/local-ml"]

# Execution environment - determines how server nodes (REST/MCP) behave
# local: bind a socket and serve in-process (desktop app)
# remote: emit a structured server-config event and return (server runtimes)
local = []
remote = []

h264-software = ["dep:openh264"]
platform-codecs = ["dep:ndk", "dep:windows"]

# Execution feature - enables heavy dependencies for node execution
execute = [
    "flow-like-catalog-web-telegram/execute",
    "flow-like-catalog-web-discord/execute",
    "flow-like-catalog-web-mail/execute",
    "flow-like-catalog-core/execute",
    "dep:scraper",
    "dep:tokio-rustls",
    "dep:rustls-pki-types",
    "dep:webpki-roots",
    "dep:tokio-tungstenite",
    "dep:rumqttc",
    "dep:rcgen",
    "dep:jsonwebtoken",
    "dep:reqwest",
    "dep:hmac",
    "dep:sha2",
    "dep:retina",
    "h264-software",
    "platform-codecs",
    "dep:url",
]

[dependencies]
flow-like-catalog-web-telegram.workspace = true
flow-like-catalog-web-discord.workspace = true
flow-like-catalog-web-mail.workspace = true
flow-like-catalog-core.workspace = true
flow-like-runtime = { workspace = true, features = ["flow-metadata"] }
flow-like-types.workspace = true
flow-like-storage = { workspace = true, default-features = false }
ahash.workspace = true
tracing.workspace = true
schemars.workspace = true
futures.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
uuid.workspace = true
base64.workspace = true
bytes.workspace = true
urlencoding.workspace = true

# Scraping and shared transport dependencies enabled for execution
scraper = { version = "0.23.1", optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"], optional = true }
rustls-pki-types = { version = "1", optional = true }
webpki-roots = { version = "0.26", optional = true }


# WebSocket support
tokio-tungstenite = { workspace = true, optional = true }

# MQTT support
rumqttc = { workspace = true, optional = true }

# TLS certificate generation
rcgen = { version = "0.14.8", features = ["x509-parser"], optional = true }

# OAuth bearer/JWKS validation
jsonwebtoken = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
retina = { version = "0.4.19", optional = true }
openh264 = { version = "0.9.3", optional = true }
url = { version = "2.5", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
ndk = { version = "0.9.0", features = ["media"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", optional = true, features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
] }

[build-dependencies]
flow-like-catalog-build-helper.workspace = true
