[package]
name = "flow-like-catalog-std-numbers"
version = "0.1.0"
edition = "2024"

[features]
default = []
local-ml = ["flow-like-catalog-core/local-ml", "flow-like-catalog-std-support/local-ml"]
execute = [
    "flow-like-catalog-core/execute",
    "flow-like-catalog-std-support/execute",
    "dep:fasteval",
    "dep:nalgebra",
    "dep:fake",
    "dep:rand",
]

[dependencies]
flow-like-catalog-core = { workspace = true, default-features = false }
flow-like-runtime = { workspace = true, features = ["flow-metadata"] }
flow-like-types = { workspace = true }
flow-like-catalog-std-support = { workspace = true }
fasteval = { version = "0.2.4", optional = true }
nalgebra = { version = "0.34.0", optional = true }
fake = { version = "4", features = ["derive"], optional = true }
rand = { version = "0.9", optional = true }

[build-dependencies]
flow-like-catalog-build-helper.workspace = true
