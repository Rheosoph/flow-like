[package]
name = "flow-like-catalog-media"
version = "0.1.0"
edition = "2024"

[features]
default = []
local-ml = ["flow-like-catalog-media-audio/local-ml", "flow-like-catalog-media-document/local-ml", "flow-like-catalog-media-image/local-ml", "flow-like-catalog-media-video/local-ml", "flow-like-catalog-core/local-ml"]
local-tts = ["flow-like-catalog-media-audio/local-tts"]
local-tts-metal = ["flow-like-catalog-media-audio/local-tts-metal"]
local-tts-cuda = ["flow-like-catalog-media-audio/local-tts-cuda"]
local-tts-accelerate = ["flow-like-catalog-media-audio/local-tts-accelerate"]
local-stt = ["flow-like-catalog-media-audio/local-stt"]
local-stt-metal = ["flow-like-catalog-media-audio/local-stt-metal"]
local-stt-cuda = ["flow-like-catalog-media-audio/local-stt-cuda"]
local-stt-accelerate = ["flow-like-catalog-media-audio/local-stt-accelerate"]
execute = ["flow-like-catalog-media-audio/execute", "flow-like-catalog-media-document/execute", "flow-like-catalog-media-image/execute", "flow-like-catalog-media-video/execute", "flow-like-catalog-core/execute"]

[dependencies]
flow-like-catalog-core.workspace = true
flow-like = { package = "flow-like-runtime", path = "../../core/runtime", default-features = false, features = ["flow-metadata"] }
flow-like-types.workspace = true
schemars.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
flow-like-catalog-media-audio.workspace = true
flow-like-catalog-media-document.workspace = true
flow-like-catalog-media-image.workspace = true
flow-like-catalog-media-video.workspace = true

[build-dependencies]
flow-like-catalog-build-helper.workspace = true

[dev-dependencies]
ahash.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
lopdf = "0.39.0"
