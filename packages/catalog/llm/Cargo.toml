[package]
name = "flow-like-catalog-llm"
version = "0.1.0"
edition = "2024"

[features]
default = []
local-ml = ["flow-like-catalog-core/local-ml"]
remote-ml = ["flow-like-catalog-core/remote-ml"]
tauri = ["flow-like-catalog-core/tauri"]
# Execution feature - enables heavy dependencies for node execution
execute = [
    "flow-like-catalog-core/execute",
    "flow-like-catalog-data/execute",
    "dep:rig",
    "dep:rmcp",
    "dep:jsonschema",
    "dep:copilot-sdk",
]

[dependencies]
flow-like-catalog-core.workspace = true
flow-like-catalog-data.workspace = true
flow-like = { workspace = true, default-features = false, features = ["flow-metadata"] }
flow-like-types.workspace = true
flow-like-model-provider.workspace = true
flow-like-storage = { workspace = true, default-features = false }
flow-like-catalog-macros.workspace = true
ahash.workspace = true
tracing.workspace = true
schemars.workspace = true
futures.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
uuid.workspace = true
async-trait.workspace = true
rig = { workspace = true, optional = true, features = ["rmcp"] }
rmcp = { workspace = true, optional = true }
jsonschema = { workspace = true, optional = true }
copilot-sdk = { workspace = true, optional = true }
regex.workspace = true

[build-dependencies]
flow-like-catalog-build-helper.workspace = true
