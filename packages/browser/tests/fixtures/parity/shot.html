<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shot fixture</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; }
  .box { position: absolute; }
  #s_small { left: 20px; top: 20px; width: 100px; height: 50px; background: #ff0000; }
  #s_frac { left: 150.5px; top: 20.25px; width: 80.5px; height: 40.75px; background: #00aa00; border: 3px solid #0000ff; }
  #s_tall { left: 300px; top: 100px; width: 120px; height: 2000px; background: linear-gradient(#ff00ff, #00ffff); }
  #s_wide { left: 1000px; top: 200px; width: 600px; height: 60px; background: #ffaa00; }
  #s_below { left: 20px; top: 3000px; width: 90px; height: 40px; background: #333399; }
  #s_scroller { left: 20px; top: 120px; width: 200px; height: 100px; overflow: auto; border: 1px solid #000; }
  #s_inner { margin-top: 400px; width: 150px; height: 30px; background: #009999; }
</style>
</head>
<body style="height:4000px">
  <div class="box" id="s_small"></div>
  <div class="box" id="s_frac"></div>
  <div class="box" id="s_tall"></div>
  <div class="box" id="s_wide"></div>
  <div class="box" id="s_below"></div>
  <div class="box" id="s_scroller"><div id="s_inner"></div></div>
</body>
</html>
