[package]
name = "flow-like"
description = "Flow-Like, Automation done with the press of a Button. Core Library for Flow Execution and Management"
version = "0.1.0"
edition = "2024"
authors = ["TM9657 GmbH"]
repository = "https://github.com/TM9657/flow-like/"
categories = ["GenAI", "AI", "Productivity"]
license-file = "LICENSE"
readme = "README.md"

[lib]
name = "flow_like"
crate-type = ["lib", "cdylib", "staticlib"]
bench = false

[dependencies]
flow-like-types.workspace = true
flow-like-bits.workspace = true
flow-like-model-provider.workspace = true
flow-like-storage.workspace = true
rig.workspace = true
rmcp.workspace = true
rayon = "1.11.0"
portpicker = "0.1.1"
dirs-next.workspace = true
sysinfo = "0.37.0"
mime_guess = "2.0.5"
image = "0.25.6"
num_cpus = "1.17.0"
strsim = "0.11.1"
tempfile = "3.20.0"
lz4_flex = "0.11.6"
url = {version = "2.5.4", features = ["serde"]}
json5 = "0.4.1"
ahash.workspace = true
schemars.workspace = true
jsonschema.workspace = true
chrono.workspace = true
futures.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
once_cell = "1.21.3"
tracing.workspace = true
highway = "1.3.0"
canonical_json = "0.5.0"
zip = {version = "8.2.0", default-features = false, features = ["deflate"] }
flate2.workspace = true
chacha20poly1305 = {version="0.10.1", features=["stream", "std"]}
argon2 = "0.5.3"
zeroize = "1.8.1"
thiserror.workspace = true
serde_json.workspace = true
async-trait.workspace = true
percent-encoding.workspace = true
utoipa = { version = "5", optional = true }
any-tts = { version = "0.1.2", default-features = false, optional = true }

[features]
tauri = ["flow-like-storage/tauri"]
local-ml = ["flow-like-model-provider/local-ml"]
local-tts = [
    "dep:any-tts",
    "any-tts/kokoro",
    "any-tts/omnivoice",
    "any-tts/qwen3-tts",
    "any-tts/vibevoice",
    "any-tts/voxtral",
]
local-tts-metal = ["local-tts", "any-tts/metal"]
local-tts-cuda = ["local-tts", "any-tts/cuda"]
local-tts-accelerate = ["local-tts", "any-tts/accelerate"]
remote-ml = ["flow-like-model-provider/remote-ml"]
schema-gen = []
flow-runtime = []
flow = ["flow-runtime"]
hub = []
bit = ["hub"]
model = ["bit"]
app = ["bit", "model", "hub"]
openapi = ["utoipa"]
full = ["schema-gen", "flow-runtime", "flow", "hub", "bit", "model", "app"]
default = ["schema-gen", "flow-runtime", "flow", "hub", "bit", "model", "app"]
[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true
opt-level = "z"

[profile.dev]
opt-level = 1
