[package]
name = "flow-like"
description = "Flow-Like, Automation done with the press of a Button. Core Library for Flow Execution and Management"
version = "0.1.0"
edition = "2024"
authors = ["Rheosoph GmbH"]
repository = "https://github.com/Rheosoph/flow-like/"
categories = ["GenAI", "AI", "Productivity"]
license-file = "LICENSE"
readme = "README.md"

[lib]
name = "flow_like"
crate-type = ["rlib"]
bench = false

[dependencies]
flow-like-runtime.workspace = true
flow-like-editor = { workspace = true, optional = true }

[features]
tauri = ["flow-like-runtime/tauri"]
local-ml = ["flow-like-runtime/local-ml"]
local-ml-cuda = ["local-ml", "flow-like-runtime/local-ml-cuda"]
local-ml-tensorrt = ["local-ml-cuda", "flow-like-runtime/local-ml-tensorrt"]
local-tts = ["flow-like-runtime/local-tts"]
local-tts-metal = ["local-tts", "flow-like-runtime/local-tts-metal"]
local-tts-cuda = ["local-tts", "flow-like-runtime/local-tts-cuda"]
local-tts-accelerate = ["local-tts", "flow-like-runtime/local-tts-accelerate"]
local-stt = ["flow-like-runtime/local-stt"]
local-stt-metal = ["local-stt", "flow-like-runtime/local-stt-metal"]
local-stt-cuda = ["local-stt", "flow-like-runtime/local-stt-cuda"]
local-stt-accelerate = ["local-stt", "flow-like-runtime/local-stt-accelerate"]
remote-ml = ["flow-like-runtime/remote-ml"]
schema-gen = ["app", "flow-metadata", "flow-like-runtime/schema-gen"]
flow-metadata = ["app", "flow-like-runtime/flow-metadata", "dep:flow-like-editor"]
flow = ["flow-runtime", "flow-like-runtime/flow"]
flow-runtime = ["flow-metadata", "flow-like-runtime/flow-runtime", "flow-like-editor?/flow-runtime"]
hub = ["flow-like-runtime/hub"]
bit = ["hub", "flow-like-runtime/bit"]
model = ["bit", "flow-metadata", "flow-like-runtime/model"]
app = ["bit", "model", "hub", "flow-like-runtime/app"]
app-runtime = ["flow-runtime", "app", "flow-like-runtime/app-runtime"]
openapi = ["flow-like-runtime/openapi"]
full = ["schema-gen", "app-runtime", "flow-like-runtime/full"]
default = ["full"]

[dev-dependencies]
flow-like-types.workspace = true
flow-like-model-provider.workspace = true
flow-like-storage.workspace = true
blake3.workspace = true
lz4_flex = "0.11.6"
ahash.workspace = true
rkyv.workspace = true
proptest = "1"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
