[package]
name = "flow-like-core-contracts"
version = "0.1.0"
edition = "2024"
description = "Dependency-light public contracts shared by Flow-Like core consumers"
license-file = "../../../LICENSE"

[dependencies]
serde = { workspace = true, features = ["derive"] }
anyhow = "1.0.97"
tracing.workspace = true
schemars = { workspace = true, optional = true }

[features]
default = []
schema = ["dep:schemars"]
