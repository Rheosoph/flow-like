[package]
name = "flow-like-editor"
version = "0.1.0"
edition = "2024"
description = "FlowScript editing and copilot services on the shared Flow runtime"
license-file = "../../../LICENSE"

[dependencies]
flow-like-runtime = { workspace = true, features = ["flow-metadata"] }
flow-like-editor-contracts.workspace = true
flow-like-core-contracts.workspace = true
flow-like-types.workspace = true
flow-like-ast.workspace = true
flow-like-bot-memory.workspace = true
flow-like-bot-tools.workspace = true
flow-like-model-provider.workspace = true
flow-like-storage.workspace = true
async-trait.workspace = true
blake3.workspace = true
chrono.workspace = true
dom_smoothie = "0.18.2"
futures.workspace = true
htmd = "0.5.4"
jsonschema.workspace = true
rig.workspace = true
schemars.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true
serde_path_to_error = "0.1.20"
strsim = "0.11.1"
thiserror.workspace = true
tracing.workspace = true
url = { version = "2.5.4", features = ["serde"] }

[features]
default = []
flow-runtime = ["flow-like-runtime/flow-runtime"]

[dev-dependencies]
proptest = "1"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
