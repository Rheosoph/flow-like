[package]
name = "sales-insights-node"
version = "0.1.0"
edition = "2021"
description = "WASM nodes powering the Sales Insights example package"
license = "MIT"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
flow-like-wasm-sdk = "0.3.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
