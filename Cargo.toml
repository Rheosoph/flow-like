[workspace]
resolver = "2"
# Bare Cargo commands target the shared editing loop. Product crates remain one
# short alias away, while CI always passes --workspace explicitly.
default-members = [
    "packages/core/dev-check",
    "packages/ast",
    "packages/types/contracts",
]
members = [
    "apps/desktop/src-tauri",
    "apps/backend/local/api",
    "apps/backend/local/runtime",
    "apps/schema-gen",
    "apps/backend/aws/api",
    "apps/backend/aws/executor",
    "apps/backend/aws/executor-async",
    "apps/backend/aws/event-bridge",
    "apps/backend/aws/maintenance",
    "apps/backend/aws/media-transformer",
    "apps/backend/aws/file-tracker",
    "apps/backend/aws/compiler-lambda",
    "apps/backend/aws/compiler-ecs",
    "apps/backend/aws/executor-ecs",
    "apps/backend/azure/api",
    "apps/backend/azure/queue-worker",
    "packages/azure-data",
    "apps/backend/gcp/api",
    "apps/backend/gcp/queue-worker",
    "packages/gcp-data",
    "packages/scheduler-tick",
    "apps/backend/azure/executor",
    "apps/backend/azure/maintenance",
    "apps/backend/azure/scheduler",
    "apps/backend/gcp/executor",
    "apps/backend/gcp/maintenance",
    "apps/backend/gcp/scheduler",
    "apps/backend/kubernetes/api",
    "apps/backend/kubernetes/executor",
    "apps/backend/kubernetes/compiler",
    "apps/backend/kubernetes/sink-trigger",
    "apps/backend/docker-compose/api",
    "apps/backend/docker-compose/runtime",
    "apps/backend/docker-compose/sink-services",
    "packages/core",
    "packages/core/contracts",
    "packages/core/dev-check",
    "packages/ast",
    "packages/model-provider",
    "packages/model-provider/protocol",
    "packages/types",
    "packages/types/contracts",
    "packages/types/proto",
    "packages/catalog",
    "packages/catalog/core",
    "packages/catalog/std",
    "packages/catalog/data",
    "packages/catalog/web",
    "packages/catalog/media",
    "packages/catalog/ml",
    "packages/ordinal",
    "packages/catalog/onnx",
    "packages/catalog/llm",
    "packages/catalog/processing",
    "packages/catalog/geo",
    "packages/catalog/automation",
    "libs/nodes/code-interpreter",
    "packages/catalog-macros",
    "packages/catalog-build-helper",
    "packages/storage",
    "packages/storage/contracts",
    "packages/storage/files",
    "packages/api",
    "packages/api/entity",
    "packages/sinks",
    "packages/secrets",
    "packages/executor",
    "packages/channels",
    "packages/compiler",
    "packages/wasm",
    "packages/wasm/schema",
    "apps/utils/board-decoder",
    "apps/utils/flowscript-render-data",
    "packages/dexie-tauri-adapter/backend",
]

[workspace.dependencies]
flow-like = { path = "packages/core", default-features = false, features = ["flow-metadata"] }
flow-like-ast = { path = "packages/ast" }
flow-like-types = { path = "packages/types", default-features = false }
flow-like-types-contracts = { path = "packages/types/contracts", default-features = false }
flow-like-types-proto = { path = "packages/types/proto", default-features = false }
flow-like-api = { path = "packages/api", default-features = false }
flow-like-api-entity = { path = "packages/api/entity", default-features = false }
flow-like-core-contracts = { path = "packages/core/contracts", default-features = false }
flow-like-model-provider = { path = "packages/model-provider" }
flow-like-model-protocol = { path = "packages/model-provider/protocol", default-features = false }
flow-like-catalog = { path = "packages/catalog", default-features = false }
flow-like-catalog-core = { path = "packages/catalog/core", default-features = false }
flow-like-catalog-std = { path = "packages/catalog/std" }
flow-like-catalog-data = { path = "packages/catalog/data" }
flow-like-catalog-web = { path = "packages/catalog/web" }
flow-like-catalog-media = { path = "packages/catalog/media" }
flow-like-catalog-ml = { path = "packages/catalog/ml" }
flow-like-ordinal = { path = "packages/ordinal" }
flow-like-catalog-onnx = { path = "packages/catalog/onnx" }
flow-like-catalog-llm = { path = "packages/catalog/llm" }
flow-like-catalog-processing = { path = "packages/catalog/processing" }
flow-like-catalog-geo = { path = "packages/catalog/geo" }
flow-like-catalog-automation = { path = "packages/catalog/automation" }
flow-like-catalog-macros = { path = "packages/catalog-macros" }
flow-like-catalog-build-helper = { path = "packages/catalog-build-helper" }
flow-like-storage = { path = "packages/storage", default-features = false, features = ["files", "query-parser"] }
flow-like-storage-contracts = { path = "packages/storage/contracts", default-features = false }
flow-like-storage-files = { path = "packages/storage/files", default-features = false }
flow-like-sinks = { path = "packages/sinks" }
flow-like-executor = { path = "packages/executor", default-features = false }
flow-like-channels = { path = "packages/channels", default-features = false }
flow-like-compiler = { path = "packages/compiler" }
flow-like-wasm = { path = "packages/wasm" }
flow-like-wasm-schema = { path = "packages/wasm/schema", default-features = false }
flow-like-secrets = { path = "packages/secrets" }
flow-like-azure-data = { path = "packages/azure-data" }
flow-like-gcp-data = { path = "packages/gcp-data" }
flow-like-scheduler-tick = { path = "packages/scheduler-tick" }
tauri-plugin-flow-like-dexie-blob-offload = { path = "packages/dexie-tauri-adapter/backend" }
lambda_http = "0.15.1"
futures = "0.3.31"
bytes = "1.10.1"
serde = { version = "1.0.219", features = ["derive", "rc"] }
serde_json = "1.0.134"
schemars = { version = "1.1.0", features = ["preserve_order", "chrono04"] }
chrono = {version="0.4.41", features = ["serde"]}
chrono-tz = "0.10.4"
icalendar = "0.17.4"
uuid = { version = "1.19.0", features = ["v4", "serde"] }
iana-time-zone = "0.1.64"
axum = {version="0.8.4", features=["http2", "multipart"]}
sea-orm = { version = "1.1.17", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-json", "seaography" ] }
tower = "0.5.2"
tracing-subscriber = "0.3.22"
dotenv = "0.15.0"
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
hyper = {version = "1.5.2", features = ["full", "client"]}
hyper-util = {version = "0.1.10", features = ["full"]}
tracing = "0.1.41"
sentry-tracing = "0.46.2"
sentry = { version = "0.46.2", default-features = false, features = ["anyhow", "backtrace", "contexts", "debug-images", "panic", "release-health", "reqwest", "rustls", "tokio"] }
sentry-tower = { version = "0.46.2", features = ["axum", "axum-matched-path"] }
tower-http = {version="0.6.6", features = ["full"]}
async-stripe = {version="0.41.0", features = ["runtime-tokio-hyper"]}
futures-util = "0.3.31"
moka = { version = "0.12.11", features = ["sync"] }
bitflags = "2.9.4"
blake3 = "1.8.2"
lambda_runtime = "0.14.2"
aws-config = "1.11.0"
aws-sdk-dynamodb = { version = "1.80.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-lambda = { version = "1.120", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-s3 = { version = "1.93.0", default-features = false, features = ["default-https-client", "rt-tokio", "sigv4a", "http-1x"] }
aws-sdk-sesv2 = { version = "1.85.0", default-features = false, features = ["default-https-client", "rt-tokio", "sigv4a"] }
aws-sdk-sqs = { version = "1.63.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sts = { version = "1.88.0", default-features = false, features = ["default-https-client", "rt-tokio", "sigv4a"] }
aws_lambda_events = "1.0.3"
tokio = {version="1.47.1"}
urlencoding = "2.1.3"
image = "0.25.6"
imageproc = "0.25.0"
webp = "0.3.1"
ahash = "0.8.12"
rkyv = { version = "0.8.18", features = ["bytecheck"] }
zstd = "0.13.3"
base64 = "0.22.1"
aes-gcm = "0.10.3"
argon2 = "0.5.3"
chacha20poly1305 = "0.10.1"
zeroize = "1.8.1"
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
opentelemetry = "0.32"
opentelemetry_sdk = "0.32.1"
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
    "grpc-tonic",
    "trace",
    "metrics",
    "logs",
    "internal-logs",
] }
tracing-opentelemetry = "0.33"
ndarray = "0.17"
dirs-next = "2.0.0"
regex = "1.11.3"
rig = { package = "rig-core", version="0.38.2", default-features = false, features = ["rustls"]}
rig-vertexai = { version = "=0.38.2" }
google-cloud-auth = "1.0"
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-webpki-roots"] }
rumqttc = "0.25.1"
copilot-sdk = { git = "https://github.com/pjperez/copilot-sdk-rust.git", branch = "fix/protocol-v3-support" }
async-trait = "0.1.89"
sqlparser = "0.59.0"
jsonschema = "0.33.0"
rmcp = { version = "=1.7.0", features = ["auth", "client", "client-side-sse", "macros", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }
thiserror = "2.0.17"
mimalloc = { version = "0.1.48", default-features = false }
lettre = { version = "0.11.22", default-features = false, features = ["tokio1-rustls-tls", "builder", "hostname", "pool", "smtp-transport"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
markitdown = { git = "https://github.com/Rheosoph/markitdown-rs.git", rev = "2dac5f1", default-features = false, features = ["rustls-tls", "static-liblzma"] }
kube = { version = "0.98", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.24", features = ["v1_32"] }
percent-encoding = "2.3.2"
toml = "0.9.8"
toml_edit = "0.23.9"
# Force flate2 to use pure Rust backend (no C zlib) for iOS compatibility
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
getrandom = "0.4.1"
dashmap = "6"
sourcemap = "9.3"

rdev = { git = "https://github.com/Rheosoph/rdev", branch = "macos-thread-safety" }

wasmtime = { version = "47.0.3", default-features = false, features = [
    "anyhow",
    "async",
    "component-model",
    "component-model-async",
    "cranelift",
    "gc-drc",
    "parallel-compilation",
    "pulley",
    "runtime",
    "stack-switching",
    "std",
    "threads",
    "wit-parser",
] }
wasmtime-wasi = "47.0.3"
wasmtime-wasi-http = "47.0.3"

[patch.crates-io]
# Fix Windows CRT mismatch (upstream hardcodes static CRT /MT,
# conflicting with ort_sys which uses dynamic CRT /MD -> LNK2038).
esaxx-rs = { git = "https://github.com/Rheosoph/esaxx-rs.git", branch = "main" }
# Fix erasable's unstable extern type / never type probes on newer stable Rust toolchains.
erasable = { git = "https://github.com/Rheosoph/pointer-utils.git", rev = "e1c31813a156e656f8d0b2c194410ac7192ffbd4" }

# Keep useful backtraces with much smaller debug data; developer artifacts stay unstripped.
[profile.dev]
debug = "line-tables-only"
incremental = true
strip = "none"

# Fastest cold compilation. Add named opt-level=1 exceptions only
# for dependencies that are unusably slow at runtime otherwise.
[profile.dev.package."*"]
debug = false
opt-level = 0

[profile.dev-run]
inherits = "dev"

[profile.dev-run.package."*"]
debug = false
opt-level = 1

[profile.ci]
inherits = "dev"
debug = "none"
incremental = false

[profile.ci.package."*"]
debug = false
opt-level = 0

[profile.release-fast]
inherits = "release"
opt-level = 2
lto = "off"
codegen-units = 16

[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 8
strip = "symbols"
