[package]
name = "flow-like-desktop"
version = "0.0.2"
description = "Flow-Like, Automation done with the press of a Button"
authors = ["Rheosoph GmbH"]
repository = "https://github.com/Rheosoph/flow-like/"
edition = "2024"
homepage = "https://flow-like.com"
categories = ["GenAI", "AI", "Productivity"]
license-file = "LICENSE"
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app"
# Tauri's generated mobile projects link this exact target (`libapp.a` on iOS
# and the corresponding shared library on Android). `src/lib.rs` therefore
# keeps these required crate types, but includes the application only for
# `cfg(mobile)`; host builds compile it directly through `src/main.rs`.
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
blake3.workspace = true
tauri-build = { version = "2.7.4", features = [] }
serde_json = "1"
plist = "1.8.0"

[features]
default = []
local-ml-cuda = ["flow-like/local-ml-cuda", "flow-like-catalog/local-ml-cuda"]
local-ml-tensorrt = ["local-ml-cuda", "flow-like/local-ml-tensorrt", "flow-like-catalog/local-ml-tensorrt"]
training-cpu = ["flow-like-catalog/training-cpu"]
training-auto = ["flow-like-catalog/training-auto"]
training-wgpu = ["training-cpu", "flow-like-catalog/training-wgpu"]
training-cuda = ["training-cpu", "flow-like-catalog/training-cuda"]
training-rocm = ["training-cpu", "flow-like-catalog/training-rocm"]
training-onnx-export = ["training-cpu", "flow-like-catalog/training-onnx-export"]
sensor-opcua = ["flow-like-catalog/sensor-opcua"]
sensor-genicam = ["flow-like-catalog/sensor-genicam"]
local-tts-accelerate = ["flow-like/local-tts-accelerate", "flow-like-catalog/local-tts-accelerate"]
local-tts-cuda = ["flow-like/local-tts-cuda", "flow-like-catalog/local-tts-cuda"]
local-tts-metal = ["flow-like/local-tts-metal", "flow-like-catalog/local-tts-metal"]
local-stt-accelerate = ["flow-like/local-stt-accelerate", "flow-like-catalog/local-stt-accelerate"]
local-stt-cuda = ["flow-like/local-stt-cuda", "flow-like-catalog/local-stt-cuda"]
local-stt-metal = ["flow-like/local-stt-metal", "flow-like-catalog/local-stt-metal"]

[dependencies]
icu_collator = "=2.2.1"
jsonschema.workspace = true
flow-like = { workspace = true, features = ["app-runtime", "tauri", "local-ml", "local-tts", "local-stt"] }
flow-like-types.workspace = true
flow-like-catalog-ml = { workspace = true, default-features = false, features = ["studio"] }
flow-like-wasm = { workspace = true, features = ["model"] }
flow-like-offline-writes = { workspace = true, features = ["runtime"] }
flow-like-device-protocol.workspace = true

# Tauri 2.12 uses Tao's corrected iOS scene lifecycle and configuration ownership.
tauri = { version = "2.12.5", features = [
    "protocol-asset",
    "macos-private-api",
    "tray-icon",
] }

anyhow = "1.0.95"
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
tracing = { version = "0.1.41", features = ["async-await", "attributes"] }

dirs-next.workspace = true
futures.workspace = true
tokio-tungstenite.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true
image.workspace = true
webp.workspace = true
reqwest = { workspace = true, features = ["blocking", "multipart"] }
unicode-normalization = "0.1"
chacha20poly1305.workspace = true
zeroize.workspace = true
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
jsonwebtoken.workspace = true

tauri-plugin-shell = "2.5.0"
tauri-plugin-log = "2.10.1"
tauri-plugin-notification = "2.7.0"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-deep-link = "2.6.2"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-http = "2.8.3"
tauri-plugin-devtools = "2.2.2"
tauri-plugin-fs = "2.7.1"
urlencoding.workspace = true
toml.workspace = true
toml_edit.workspace = true
tauri-plugin-opener = "2.7.2"

rusqlite = { version = "0.32.0", features = ["bundled-full", "serde_json"] }
serenity = { version = "0.12.4", default-features = false, features = ["client", "gateway", "model", "rustls_backend", "cache"] }
teloxide = { version = "0.17", default-features = false, features = ["macros", "rustls", "ctrlc_handler"] }
flow-like-bots = { workspace = true, features = ["telegram", "discord"] }

pulldown-cmark = "0.12"
lazy_static = "1.5.0"
async-trait.workspace = true
dashmap.workspace = true
cron = "0.15.0"
chrono.workspace = true
axum = { version = "0.8.6", features = ["multipart"] }
tower = "0.5.2"
chrono-tz.workspace = true
mimalloc.workspace = true

blake3.workspace = true
tauri-plugin-flow-like-dexie-blob-offload.workspace = true
sha2 = "0.10"
copilot-sdk.workspace = true
rmcp.workspace = true
uuid.workspace = true
once_cell = "1.21.3"
tokio.workspace = true
rayon = "1.11.0"
tauri-plugin-remote-push = { git = "https://github.com/Rheosoph/tauri-plugin-remote-push.git", branch = "main" }

[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\"))".dependencies]
flow-like-browser.workspace = true
flow-like-device-client.workspace = true
flow-like-device-crypto.workspace = true
tauri-plugin-single-instance = { version = "2.5.4", features = ["deep-link"] }
tauri-plugin-window-state = "2.5.0"
tauri-plugin-updater = "2.14.0"
xcap = "0.8.1"
arboard = "3.6.1"
enigo = "0.6.1"

[target."cfg(unix)".dependencies]
rustix = { version = "1.1", features = ["fs"] }

[target."cfg(any(target_os = \"macos\", windows))".dependencies]
rdev.workspace = true

[target."cfg(any(target_os = \"macos\", target_os = \"ios\"))".dependencies]
flow-like = { workspace = true, features = ["app-runtime", "tauri", "local-ml", "local-tts-metal", "local-tts-accelerate", "local-stt-metal", "local-stt-accelerate"] }

[target."cfg(target_os = \"android\")".dependencies]
flow-like-catalog = { workspace = true, default-features = false, features = ["mobile", "draft-testing"] }

[target."cfg(target_os = \"linux\")".dependencies]
flow-like-catalog = { workspace = true, default-features = false, features = ["desktop", "draft-testing"] }
rdev = { workspace = true, features = ["x11", "wayland"] }
# Never enable zbus/tokio here: features unify across the graph, and it switches
# zbus::block_on to building its own runtime, which panics inside tokio workers
# (notify-rust notifications, tauri-plugin-opener reveal-in-dir).
atspi = { version = "0.25", features = ["zbus"] }

[target."cfg(target_os = \"macos\")".dependencies]
flow-like-catalog = { workspace = true, default-features = false, features = ["desktop-apple", "draft-testing"] }
cocoa = "0.26"
macos-app-nap = "0.0.1"
core-graphics = "0.25"
objc2 = "0.6.3"

[target."cfg(windows)".dependencies]
flow-like-catalog = { workspace = true, default-features = false, features = ["desktop", "draft-testing"] }
windows = { version = "0.62", features = [
    "Win32_UI_Accessibility",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_Storage_FileSystem",
] }
webview2-com = "0.39.1"

[target."cfg(target_os = \"ios\")".dependencies]
# libc 0.2.190 removed Apple APIs still used by sysinfo on iOS.
# Remove this pin when sysinfo supports the changed bindings.
libc = "=0.2.189"
flow-like-catalog = { workspace = true, default-features = false, features = ["mobile-apple", "draft-testing"] }
objc2 = "0.6.3"
security-framework = "3.7"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSObject", "NSString", "NSDictionary", "NSError", "NSFileManager"] }
tracing-oslog = "0.3.0"
