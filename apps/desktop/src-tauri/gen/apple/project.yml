name: app
options:
  bundleIdPrefix: com.flow-like.app
  deploymentTarget:
    iOS: "17.0"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.11.0
  FlowLikeMLX:
    path: ../../apple/FlowLikeMLX
  FlowLikeNative:
    path: ../../apple/FlowLikeNative
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: Flow Like
      PRODUCT_BUNDLE_IDENTIFIER: com.flow-like.app
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  flow-like-desktop_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../../apple/FlowLikeNative/Sources/FlowLikeNative/Intents.swift
      - path: Assets.xcassets
      - path: icon.icon
      - path: Externals
      - path: flow-like-desktop_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: flow-like-desktop_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 0.0.4
        CFBundleVersion: "0.0.4"
        NSSupportsLiveActivities: true
        NSLocationWhenInUseUsageDescription: Flow Like uses your location when you request it in a workflow or map.
        NSLocationAlwaysAndWhenInUseUsageDescription: Flow Like monitors the regions you enable so location Events can run when you arrive or leave, including while the app is closed.
        NSUserActivityTypes: [com.flow-like.app.page]
    entitlements:
      path: flow-like-desktop_iOS/flow-like-desktop_iOS.entitlements
      properties:
        com.apple.security.application-groups: [group.com.flow-like.app]
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: icon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: false
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) FLOW_LIKE_INTENTS_HOST FLOW_LIKE_SHORTCUTS_HOST"
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64
        RUSTUP_TOOLCHAIN: 1.97.1
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(TOOLCHAIN_DIR)/usr/lib/swift/$(PLATFORM_NAME) $(TOOLCHAIN_DIR)/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(TOOLCHAIN_DIR)/usr/lib/swift/$(PLATFORM_NAME) $(TOOLCHAIN_DIR)/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
        OTHER_LDFLAGS: ["-lz"]
      groups: [app]
    dependencies:
      - package: Firebase
        product: FirebaseMessaging
      - package: Firebase
        product: FirebaseInAppMessaging-Beta
      - package: FlowLikeNative
        product: FlowLikeNative
      - target: FlowLikeWidgets
        embed: true
      - target: FlowLikeShare
        embed: true
      - target: FlowLikeNotifications
        embed: true
      - package: FlowLikeMLX
        product: FlowLikeMLX
      - framework: libapp.a
        embed: false
      - framework: thirdparty/onnxruntime.xcframework
        embed: false
      - sdk: Accelerate.framework
      - sdk: CoreML.framework
      - sdk: CoreFoundation.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: VideoToolbox.framework
      - sdk: WebKit.framework
    preBuildScripts:
      # Xcode archives cannot reliably connect to a user-level sccache daemon.
      # Empty environment overrides keep Cargo from loading wrappers configured
      # in ~/.cargo/config.toml while leaving normal developer builds unchanged.
      - script: RUSTC_WRAPPER= RUSTC_WORKSPACE_WRAPPER= bun tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a
  FlowLikeWidgets:
    type: app-extension
    platform: iOS
    sources:
      - ../../apple/FlowLikeNative/Extensions/Widgets/FlowLikeWidgets.swift
      - ../../apple/FlowLikeNative/Sources/FlowLikeNative/Intents.swift
    dependencies:
      - package: FlowLikeNative
    entitlements:
      path: ../../apple/FlowLikeNative/Extensions/Widgets/Widgets-iOS.entitlements
    settings:
      base:
        INFOPLIST_FILE: "$(DERIVED_FILE_DIR)/FlowLikeNative-Info.plist"
        ENABLE_USER_SCRIPT_SANDBOXING: false
        PRODUCT_BUNDLE_IDENTIFIER: com.flow-like.app.widgets
        SWIFT_VERSION: "5.0"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) FLOW_LIKE_INTENTS_HOST"
        DEVELOPMENT_TEAM: VVT9DYMA6M
        APPLICATION_EXTENSION_API_ONLY: true
    preBuildScripts:
      - name: Match Containing App Version
        script: >-
          python3 "${PROJECT_DIR}/../../../scripts/apple-bundle-version.py"
          --config "${PROJECT_DIR}/../../tauri.conf.json" --platform iOS
          --container-info "${PROJECT_DIR}/flow-like-desktop_iOS/Info.plist"
          --template "${PROJECT_DIR}/../../apple/FlowLikeNative/Extensions/Widgets/Info-iOS.plist"
          --output "${DERIVED_FILE_DIR}/FlowLikeNative-Info.plist"
        basedOnDependencyAnalysis: false
        outputFiles: ["$(DERIVED_FILE_DIR)/FlowLikeNative-Info.plist"]
    scheme: {}
  FlowLikeShare:
    type: app-extension
    platform: iOS
    sources: [../../apple/FlowLikeNative/Extensions/Share/ShareViewController.swift]
    dependencies:
      - package: FlowLikeNative
    entitlements:
      path: ../../apple/FlowLikeNative/Extensions/Share/Share-iOS.entitlements
    settings:
      base:
        INFOPLIST_FILE: "$(DERIVED_FILE_DIR)/FlowLikeNative-Info.plist"
        ENABLE_USER_SCRIPT_SANDBOXING: false
        PRODUCT_BUNDLE_IDENTIFIER: com.flow-like.app.share
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: VVT9DYMA6M
        APPLICATION_EXTENSION_API_ONLY: true
    preBuildScripts:
      - name: Match Containing App Version
        script: >-
          python3 "${PROJECT_DIR}/../../../scripts/apple-bundle-version.py"
          --config "${PROJECT_DIR}/../../tauri.conf.json" --platform iOS
          --container-info "${PROJECT_DIR}/flow-like-desktop_iOS/Info.plist"
          --template "${PROJECT_DIR}/../../apple/FlowLikeNative/Extensions/Share/Info-iOS.plist"
          --output "${DERIVED_FILE_DIR}/FlowLikeNative-Info.plist"
        basedOnDependencyAnalysis: false
        outputFiles: ["$(DERIVED_FILE_DIR)/FlowLikeNative-Info.plist"]
    scheme: {}
  FlowLikeNotifications:
    type: app-extension
    platform: iOS
    sources: [../../apple/FlowLikeNative/Extensions/Notifications/NotificationService.swift]
    settings:
      base:
        INFOPLIST_FILE: "$(DERIVED_FILE_DIR)/FlowLikeNative-Info.plist"
        ENABLE_USER_SCRIPT_SANDBOXING: false
        PRODUCT_BUNDLE_IDENTIFIER: com.flow-like.app.notifications
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: VVT9DYMA6M
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: true
        SKIP_INSTALL: true
    preBuildScripts:
      - name: Match Containing App Version
        script: >-
          python3 "${PROJECT_DIR}/../../../scripts/apple-bundle-version.py"
          --config "${PROJECT_DIR}/../../tauri.conf.json" --platform iOS
          --container-info "${PROJECT_DIR}/flow-like-desktop_iOS/Info.plist"
          --template "${PROJECT_DIR}/../../apple/FlowLikeNative/Extensions/Notifications/Info-iOS.plist"
          --output "${DERIVED_FILE_DIR}/FlowLikeNative-Info.plist"
        basedOnDependencyAnalysis: false
        outputFiles: ["$(DERIVED_FILE_DIR)/FlowLikeNative-Info.plist"]
    scheme: {}
