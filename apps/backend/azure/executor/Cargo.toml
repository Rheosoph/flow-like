[package]
name = "azure-executor"
version = "0.1.0"
edition = "2024"
description = "Flow-Like Azure synchronous executor server"

[dependencies]
axum.workspace = true
base64.workspace = true
# The remote-only server bundle matches the Azure queue worker. It excludes
# ONNX metadata, ONNX Runtime, local model weights and desktop automation nodes.
# Remote-capable text model nodes reach the authenticated API proxy.
flow-like-catalog = { workspace = true, default-features = false, features = ["server"] }
flow-like-executor = { workspace = true, features = ["server", "channel-azure"] }
# Startup validates BACKEND_PUB with the exact decoder the executor uses per
# request, so a bad key fails the revision instead of every run.
jsonwebtoken.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
mimalloc.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
tokio = { workspace = true, features = ["full", "signal"] }
tracing.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
