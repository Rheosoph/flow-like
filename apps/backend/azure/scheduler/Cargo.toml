[package]
name = "azure-scheduler"
version = "0.1.0"
edition = "2024"
description = "Flow-Like Azure scheduler tick: run-once Container Apps job that dispatches cron sinks with Cosmos DB claim state"

[dependencies]
chrono.workspace = true
flow-like-scheduler-tick = { workspace = true, features = ["azure"] }
mimalloc.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
url = "2.5"
uuid.workspace = true
