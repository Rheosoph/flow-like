# Configure DATABASE_URL, MIGRATION_DATABASE_URL, AUDIT_DATABASE_URL and Redis URLs.
# db-init runs on every `up`: it re-applies the schema and the audit privilege
# boundary before the API and the audit worker start.
services:
  postgres:
    profiles: [disabled-bundled-datastores]
  redis:
    profiles: [disabled-bundled-datastores]
  db-init:
    depends_on: !reset {}
    networks: !override [app]
  api:
    depends_on:
      postgres: !reset null
      redis: !reset null
  signaling:
    depends_on:
      redis: !reset null
  sink-services:
    depends_on:
      redis: !reset null
  runtime:
    depends_on:
      redis: !reset null
  queue-bridge:
    depends_on:
      redis: !reset null
  postgres-exporter:
    depends_on: !reset {}
    networks: !override [app, monitoring]
  redis-exporter:
    depends_on: !reset {}
    networks: !override [app, monitoring]
    environment:
      REDIS_ADDR: ${METRICS_REDIS_URL:?Set a metrics Redis URL for the external datastore}
      REDIS_USER: ""
      REDIS_PASSWORD: ""
