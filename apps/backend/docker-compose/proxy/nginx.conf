# Request queries and headers can contain temporary credentials or OAuth codes.
log_format flowlike_safe '$request_method $uri $status $body_bytes_sent';
access_log /dev/stdout flowlike_safe;
# Nginx error context can include the unsanitized request query.
error_log /dev/null;
resolver 127.0.0.11 valid=10s ipv6=off;
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
upstream flowlike_api { zone api 64k; least_conn; server api:8080 resolve; keepalive 32; }
upstream flowlike_web { zone web 64k; server web:3001 resolve; keepalive 16; }
upstream flowlike_signaling { zone signaling 64k; least_conn; server signaling:4444 resolve; }

# Replace forwarded headers from clients. When terminating TLS upstream, configure
# its trusted addresses explicitly here before accepting its forwarded scheme.
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_buffering off;
proxy_request_buffering off;
proxy_next_upstream off;
proxy_read_timeout 86400s;
proxy_send_timeout 86400s;
client_max_body_size 64m;
server {
    listen 8080;
    server_name _;
    location / { proxy_pass http://flowlike_api; }
    location = /health { access_log off; proxy_pass http://flowlike_api/api/v1/health; }
}
server {
    listen 3001;
    server_name _;
    location / { proxy_pass http://flowlike_web; }
}
server {
    listen 4444;
    server_name _;
    location / { proxy_pass http://flowlike_signaling; }
}
