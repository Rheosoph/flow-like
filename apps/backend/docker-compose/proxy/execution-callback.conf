# Request queries and headers can contain temporary credentials or OAuth codes.
log_format flowlike_safe '$request_method $uri $status $body_bytes_sent';
access_log /dev/stdout flowlike_safe;
# Nginx error context can include the unsanitized request query.
error_log /dev/null;
resolver 127.0.0.11 valid=10s ipv6=off;
upstream callback_api { zone callback_api 64k; server api:8080 resolve; keepalive 16; }
server {
    listen 8080;
    client_max_body_size 16m;
    location = /health { access_log off; return 200 'ok'; }
    # Per-run gateway further checks methods and the authenticated run identity.
    location ~ ^/(api/v1/)?(execution|channels)/ {
        proxy_pass http://callback_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_next_upstream off;
        proxy_buffering off;
        proxy_read_timeout 86400s;
    }
    # Compiler callbacks carry their own signed job identity. The run gateway
    # does not expose this route to workflows.
    location = /api/v1/registry/compilation-callback {
        limit_except POST { deny all; }
        proxy_pass http://callback_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_next_upstream off;
    }
    location / { return 403; }
}
