# Request queries and headers can contain temporary credentials or OAuth codes.
log_format flowlike_safe '$request_method $uri $status $body_bytes_sent';
access_log /dev/stdout flowlike_safe;
# Nginx error context can include the unsanitized request query.
error_log /dev/null;
resolver 127.0.0.11 valid=10s ipv6=off;
upstream compilers { zone compilers 64k; least_conn; server compiler:8081 resolve; keepalive 16; }
server {
    listen 8081;
    client_max_body_size 64m;
    location = /health { access_log off; proxy_pass http://compilers/health; }
    location / {
        proxy_pass http://compilers;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_next_upstream off;
        proxy_read_timeout 86400s;
    }
}
