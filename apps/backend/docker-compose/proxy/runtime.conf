# Request queries and headers can contain temporary credentials or OAuth codes.
log_format flowlike_safe '$request_method $uri $status $body_bytes_sent';
access_log /dev/stdout flowlike_safe;
# Nginx error context can include the unsanitized request query.
error_log /dev/null;
resolver 127.0.0.11 valid=10s ipv6=off;
upstream runtimes { zone runtimes 64k; least_conn; server runtime:9000 resolve; keepalive 16; }
server {
    listen 9000;
    client_max_body_size 64m;
    location = /health { access_log off; proxy_pass http://runtimes/health; }
    location / {
        proxy_pass http://runtimes;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_next_upstream off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
