# Request queries and headers can contain temporary credentials or OAuth codes.
log_format flowlike_safe '$request_method $uri $status $body_bytes_sent';
access_log /dev/stdout flowlike_safe;
# Nginx error context can include the unsanitized request query.
error_log /dev/null;

# Only successful build-versioned assets can stay cached across deployments.
map "$status:$uri" $flowlike_cache_control {
    default "no-cache";
    ~^(200|206|304):/_next/static/ "public, max-age=31536000, immutable";
    ~^[0-9]+:/runtime-config\.js$ "no-store, max-age=0";
}

# Keep callback codes out of Referer headers, including URL normalization redirects.
map $request_uri $flowlike_referrer_policy {
    default "strict-origin-when-cross-origin";
    ~^/(thirdparty/)?callback(/|\.html)?(\?|$) "no-referrer";
}

server {
    listen 3001;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json application/manifest+json application/wasm image/svg+xml;

    # Preserve these headers when a location adds its own response headers.
    add_header_inherit merge;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Content-Security-Policy-Report-Only "script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' blob:; object-src 'none'; base-uri 'self'" always;
    add_header Referrer-Policy $flowlike_referrer_policy always;
    add_header Cache-Control $flowlike_cache_control always;

    # Runtime settings must not use the immutable JavaScript asset cache.
    location = /runtime-config.js {
        alias /tmp/flow-like-web/runtime-config.js;
        default_type application/javascript;
        expires off;
        etag off;
    }

    # Resolve hosted app routes in the browser using the exported entry point.
    location ^~ /a/ { try_files /a.html =404; }
    location ^~ /use/ { try_files $uri /use.html =404; }

    # Missing chunks must return 404 instead of a cached application entry point.
    location ^~ /_next/static/ {
        try_files $uri =404;
    }

    # Public assets can change at the same URL and must revalidate.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
    }

    # Handle Next.js static export routing
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Health check endpoint
    location /health {
        access_log off;
        default_type text/plain;
        return 200 "OK";
    }
}
