services:
  # =============================================================================
  # PostgreSQL Database
  # =============================================================================
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flowlike}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowlike_dev}
      POSTGRES_DB: ${POSTGRES_DB:-flowlike}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - flowlike

  # =============================================================================
  # Redis (Execution State + Job Queue)
  # =============================================================================
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - flowlike

  # =============================================================================
  # Database Migration Job
  # =============================================================================
  db-init:
    image: ${DB_INIT_IMAGE:-flow-like-db-init:latest}
    build:
      context: ../../../packages/api
      dockerfile: ../../apps/backend/docker-compose/db-init/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /workspace
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flowlike}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowlike_dev}
      POSTGRES_DB: ${POSTGRES_DB:-flowlike}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    entrypoint: ["/usr/local/bin/export-database-url.sh"]
    command:
      - bash
      - -lc
      - |
        wait-for-postgres.sh &&
        bun install || true &&
        make-postgres-prisma-mirror.sh &&
        bunx prisma db push --schema=prisma-postgres-mirror/schema &&
        echo '✅ Database schema applied!' &&
        rm -rf node_modules bun.lockb bun.lock prisma-postgres-mirror &&
        echo '✅ Cleanup complete!'
    restart: "no"
    deploy:
      replicas: 1
      restart_policy:
        condition: none
    networks:
      - flowlike

  # =============================================================================
  # Flow-Like API Service
  # =============================================================================
  api:
    image: ${API_IMAGE:-flow-like-api:latest}
    scale: ${API_REPLICAS:-2}
    build:
      context: ../../..
      dockerfile: apps/backend/docker-compose/api/Dockerfile
      args:
        FLOW_LIKE_CONFIG: ${FLOW_LIKE_CONFIG:-apps/backend/docker-compose/flow-like.config.example.json}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    expose:
      - "8080"
      - "9090"
    environment:
      # Server
      PORT: 8080
      RUST_LOG: ${RUST_LOG:-info,docker_compose_api=debug}

      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-flowlike}:${POSTGRES_PASSWORD:-flowlike_dev}@postgres:5432/${POSTGRES_DB:-flowlike}

      # Redis (execution state + job queue)
      REDIS_URL: redis://redis:6379
      EXECUTION_STATE_BACKEND: ${EXECUTION_STATE_BACKEND:-redis}
      EXECUTION_STATE_TTL_SECONDS: ${EXECUTION_STATE_TTL_SECONDS:-86400}
      CACHE_BACKEND: ${CACHE_BACKEND:-redis}
      CACHE_DEFAULT_TTL_SECONDS: ${CACHE_DEFAULT_TTL_SECONDS:-0}

      # Storage provider
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-aws}
      RUNTIME_CREDENTIALS_PROVIDER: ${RUNTIME_CREDENTIALS_PROVIDER-${STORAGE_PROVIDER:-aws}}

      # Generic bucket names (fallback for all providers)
      META_BUCKET: ${META_BUCKET:-flow-like-meta}
      CONTENT_BUCKET: ${CONTENT_BUCKET:-flow-like-content}
      LOG_BUCKET: ${LOG_BUCKET:-flow-like-logs}
      CDN_BUCKET_NAME: ${CDN_BUCKET_NAME:-}

      # AWS S3 (when STORAGE_PROVIDER=aws)
      AWS_ENDPOINT: ${AWS_ENDPOINT:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_USE_PATH_STYLE: ${AWS_USE_PATH_STYLE:-true}
      AWS_META_BUCKET: ${AWS_META_BUCKET:-}
      AWS_CONTENT_BUCKET: ${AWS_CONTENT_BUCKET:-}
      AWS_LOG_BUCKET: ${AWS_LOG_BUCKET:-}
      META_BUCKET_EXPRESS_ZONE: ${META_BUCKET_EXPRESS_ZONE:-false}
      CONTENT_BUCKET_EXPRESS_ZONE: ${CONTENT_BUCKET_EXPRESS_ZONE:-false}
      LOGS_BUCKET_EXPRESS_ZONE: ${LOGS_BUCKET_EXPRESS_ZONE:-false}
      # Role ARN for scoped credentials (per-user/per-app isolation)
      RUNTIME_ROLE_ARN: ${RUNTIME_ROLE_ARN:-}

      # Azure Blob (when STORAGE_PROVIDER=azure)
      AZURE_STORAGE_ACCOUNT_NAME: ${AZURE_STORAGE_ACCOUNT_NAME:-}
      AZURE_STORAGE_ACCOUNT_KEY: ${AZURE_STORAGE_ACCOUNT_KEY:-}
      AZURE_META_CONTAINER: ${AZURE_META_CONTAINER:-}
      AZURE_CONTENT_CONTAINER: ${AZURE_CONTENT_CONTAINER:-}
      AZURE_LOG_CONTAINER: ${AZURE_LOG_CONTAINER:-}

      # GCP Storage (when STORAGE_PROVIDER=gcp)
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}
      GCP_META_BUCKET: ${GCP_META_BUCKET:-}
      GCP_CONTENT_BUCKET: ${GCP_CONTENT_BUCKET:-}
      GCP_LOG_BUCKET: ${GCP_LOG_BUCKET:-}

      # Cloudflare R2 temporary credentials (when the runtime credential
      # provider is configured as R2 in the hub config)
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_API_TOKEN: ${R2_API_TOKEN:-}

      # Execution Backend Configuration
      # EXECUTION_BACKEND: For /invoke (streaming) - default http
      # ASYNC_EXECUTION_BACKEND: For /invoke/async - default redis
      EXECUTION_BACKEND: ${EXECUTION_BACKEND:-http}
      ASYNC_EXECUTION_BACKEND: ${ASYNC_EXECUTION_BACKEND:-redis}
      EXECUTOR_URL: ${EXECUTOR_URL:-http://runtime:9000}
      REDIS_EXECUTION_QUEUE: ${REDIS_EXECUTION_QUEUE:-exec:jobs}
      EXECUTION_TIMEOUT_SECONDS: ${EXECUTION_TIMEOUT_SECONDS:-3600}
      COMPILATION_BACKEND: ${COMPILATION_BACKEND:-inline}
      COMPILER_URL: ${COMPILER_URL:-http://compiler:8081}
      API_BASE_URL: ${API_BASE_URL:-http://api:8080}
      WASM_COMPILATION_TARGETS: ${WASM_COMPILATION_TARGETS:-}

      # Unified backend JWT keys (used for execution, realtime, etc.)
      BACKEND_KEY: ${BACKEND_KEY:-}
      BACKEND_PUB: ${BACKEND_PUB:-}
      BACKEND_KID: ${BACKEND_KID:-backend-es256-v1}
      SINK_SECRET: ${SINK_SECRET:-}
      MAINTENANCE_TOKEN: ${MAINTENANCE_TOKEN:-}
      SINK_TOKEN_ENCRYPTION_KEY: ${SINK_TOKEN_ENCRYPTION_KEY:-}

      # Optional services
      SENTRY_DSN: ${SENTRY_DSN:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_ENDPOINT: ${OPENROUTER_ENDPOINT:-https://openrouter.ai/api}
      HOSTED_OPENAI_API_KEY: ${HOSTED_OPENAI_API_KEY:-}
      HOSTED_OPENAI_ENDPOINT: ${HOSTED_OPENAI_ENDPOINT:-https://api.openai.com}
      HOSTED_ANTHROPIC_API_KEY: ${HOSTED_ANTHROPIC_API_KEY:-}
      HOSTED_ANTHROPIC_ENDPOINT: ${HOSTED_ANTHROPIC_ENDPOINT:-https://api.anthropic.com}
      HOSTED_AZURE_API_KEY: ${HOSTED_AZURE_API_KEY:-}
      HOSTED_AZURE_ENDPOINT: ${HOSTED_AZURE_ENDPOINT:-}
      HOSTED_BEDROCK_ENDPOINT: ${HOSTED_BEDROCK_ENDPOINT:-}
      HOSTED_VERTEX_API_KEY: ${HOSTED_VERTEX_API_KEY:-}
      HOSTED_VERTEX_ENDPOINT: ${HOSTED_VERTEX_ENDPOINT:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_ENDPOINT: ${OPENAI_ENDPOINT:-}

      # Stripe (required when premium features enabled in config)
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}

      # Tracing (OTLP) - set OTEL_EXPORTER_OTLP_ENDPOINT when using monitoring profile
      OTEL_SERVICE_NAME: flow-like-api
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.1}
    deploy:
      replicas: ${API_REPLICAS:-2}
      update_config:
        parallelism: 1
        order: start-first
      restart_policy:
        condition: any
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flowlike

  # =============================================================================
  # API Gateway (single published API port for scaled API replicas)
  # =============================================================================
  api-gateway:
    image: nginx:alpine
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:8080"
    configs:
      - source: api_gateway_nginx
        target: /etc/nginx/conf.d/default.conf
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    networks:
      - flowlike

  # =============================================================================
  # Execution Runtime (Shared Mode + Queue Worker)
  # =============================================================================
  runtime:
    image: ${RUNTIME_IMAGE:-flow-like-runtime:latest}
    scale: ${RUNTIME_REPLICAS:-3}
    build:
      context: ../../..
      dockerfile: apps/backend/docker-compose/runtime/Dockerfile
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "9000"
    environment:
      # Server mode (multiple concurrent executions)
      EXECUTOR_SERVER_MODE: "true"
      PORT: 9000
      RUST_LOG: ${RUST_LOG:-info,docker_compose_runtime=debug}

      # API callback URL
      API_URL: http://api:8080

      # Redis queue worker (for async execution)
      QUEUE_WORKER_ENABLED: ${QUEUE_WORKER_ENABLED:-true}
      REDIS_URL: redis://redis:6379
      REDIS_EXECUTION_QUEUE: ${REDIS_EXECUTION_QUEUE:-exec:jobs}
      QUEUE_WORKER_CONCURRENCY: ${QUEUE_WORKER_CONCURRENCY:-10}
      QUEUE_POLL_TIMEOUT_SECS: ${QUEUE_POLL_TIMEOUT_SECS:-30}

      # Backend JWT public key for verifying API tokens
      BACKEND_PUB: ${BACKEND_PUB:-}

      # Execution limits
      MAX_CONCURRENT_EXECUTIONS: ${MAX_CONCURRENT_EXECUTIONS:-10}
      EXECUTION_TIMEOUT_SECONDS: ${EXECUTION_TIMEOUT_SECONDS:-3600}

      # Tracing (OTLP) - set OTEL_EXPORTER_OTLP_ENDPOINT when using monitoring profile
      OTEL_SERVICE_NAME: flow-like-runtime
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.1}
    deploy:
      replicas: ${RUNTIME_REPLICAS:-3}
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '1'
          memory: 2G
      update_config:
        parallelism: 1
        order: start-first
      restart_policy:
        condition: any
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flowlike

  # =============================================================================
  # WASM Compiler Service
  # =============================================================================
  compiler:
    image: ${COMPILER_IMAGE:-flow-like-compiler:latest}
    build:
      context: ../../..
      dockerfile: apps/backend/docker-compose/compiler/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${COMPILER_PORT:-8081}:8081"
      - "${COMPILER_METRICS_PORT:-9092}:9091"
    environment:
      PORT: 8081
      METRICS_PORT: 9091
      RUST_LOG: ${RUST_LOG:-info,k8s_compiler=debug}
      API_URL: http://api:8080
      BACKEND_PUB: ${BACKEND_PUB:-}
      BACKEND_KID: ${BACKEND_KID:-backend-es256-v1}
      COMPILER_TIMEOUT_SECS: ${COMPILER_TIMEOUT_SECS:-600}
      COMPILER_CALLBACK_TIMEOUT_MS: ${COMPILER_CALLBACK_TIMEOUT_MS:-10000}
      COMPILER_CALLBACK_RETRIES: ${COMPILER_CALLBACK_RETRIES:-3}
      COMPILER_MAX_PARALLEL_TARGETS: ${COMPILER_MAX_PARALLEL_TARGETS:-}
      OTEL_SERVICE_NAME: flow-like-compiler
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.1}
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '1'
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flowlike

  # =============================================================================
  # Sink Services (Cron Scheduler, Discord, Telegram bots)
  # =============================================================================
  sink-services:
    image: ${SINK_SERVICES_IMAGE:-flow-like-sink-services:latest}
    build:
      context: ../../..
      dockerfile: apps/backend/docker-compose/sink-services/Dockerfile
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      RUST_LOG: ${RUST_LOG:-info,docker_compose_sink_services=debug}
      API_BASE_URL: http://api:8080
      REDIS_URL: redis://redis:6379
      SINK_TRIGGER_JWT: ${SINK_TRIGGER_JWT:-}
      CONFIG_PATH: /app/flow-like.config.json
    configs:
      - source: flowlike_runtime_config
        target: /app/flow-like.config.json
    restart: unless-stopped
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    networks:
      - flowlike

  # =============================================================================
  # Realtime Collaboration Signaling (Yjs/y-webrtc)
  # =============================================================================
  signaling:
    image: ${SIGNALING_IMAGE:-flow-like-signaling:latest}
    build:
      context: ../../..
      dockerfile: apps/backend/docker-compose/signaling/Dockerfile
    ports:
      - "${SIGNALING_PORT:-4444}:4444"
    environment:
      PORT: 4444
      REDIS_URL: redis://redis:6379
      SIGNAL_CHANNEL: ${SIGNAL_CHANNEL:-signal:publish}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4444/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    networks:
      - flowlike

  # =============================================================================
  # Web Application (Next.js Static Export)
  # =============================================================================
  web:
    image: ${WEB_IMAGE:-flow-like-web:latest}
    build:
      context: ../../..
      dockerfile: apps/backend/docker-compose/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_REDIRECT_URL: ${NEXT_PUBLIC_REDIRECT_URL:-http://localhost:3001/callback}
        NEXT_PUBLIC_REDIRECT_LOGOUT_URL: ${NEXT_PUBLIC_REDIRECT_LOGOUT_URL:-http://localhost:3001/}
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flowlike

  # =============================================================================
  # Monitoring Stack (Optional - set MONITORING_ENABLED=true)
  # =============================================================================
  prometheus:
    image: prom/prometheus:v2.48.0
    profiles:
      - monitoring
    ports:
      - "${PROMETHEUS_PORT:-9091}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flowlike

  grafana:
    image: grafana/grafana:10.2.2
    profiles:
      - monitoring
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_healthy
    ports:
      - "${GRAFANA_PORT:-3002}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3002}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flowlike

  redis-exporter:
    image: oliver006/redis_exporter:v1.55.0
    profiles:
      - monitoring
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${REDIS_EXPORTER_PORT:-9121}:9121"
    environment:
      REDIS_ADDR: redis://redis:6379
    networks:
      - flowlike

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    profiles:
      - monitoring
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${POSTGRES_EXPORTER_PORT:-9187}:9187"
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-flowlike}:${POSTGRES_PASSWORD:-flowlike_dev}@postgres:5432/${POSTGRES_DB:-flowlike}?sslmode=disable
    networks:
      - flowlike

  # =============================================================================
  # Tempo (Distributed Tracing)
  # =============================================================================
  tempo:
    image: grafana/tempo:2.3.1
    profiles:
      - monitoring
    ports:
      - "${TEMPO_HTTP_PORT:-3200}:3200"
      - "${TEMPO_OTLP_GRPC_PORT:-4317}:4317"
      - "${TEMPO_OTLP_HTTP_PORT:-4318}:4318"
    volumes:
      - ./monitoring/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    command:
      - -config.file=/etc/tempo/tempo.yaml
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flowlike

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  tempo_data:


networks:
  flowlike:

configs:
  api_gateway_nginx:
    file: ./proxy/nginx.conf
  flowlike_runtime_config:
    file: ${FLOW_LIKE_RUNTIME_CONFIG_FILE:-./flow-like.config.example.json}
