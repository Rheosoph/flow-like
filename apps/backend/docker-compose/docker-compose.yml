services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flowlike}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup-env.py and configure .env}
      POSTGRES_DB: ${POSTGRES_DB:-flowlike}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - database
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    user: postgres
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-100}
    deploy:
      resources:
        limits:
          cpus: ${POSTGRES_CPUS:-2}
          memory: ${POSTGRES_MEMORY:-2G}
          pids: ${POSTGRES_PIDS:-256}
    pids_limit: ${POSTGRES_PIDS:-256}
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    command:
      - sh
      - /etc/redis/start.sh
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$$REDIS_METRICS_PASSWORD" redis-cli --user metrics ping | grep -q PONG
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - queue
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    user: redis
    environment:
      REDIS_API_PASSWORD: ${REDIS_API_PASSWORD:?Run scripts/setup-env.py and configure .env}
      REDIS_RUNTIME_PASSWORD: ${REDIS_RUNTIME_PASSWORD:?Run scripts/setup-env.py and configure .env}
      REDIS_SIGNALING_PASSWORD: ${REDIS_SIGNALING_PASSWORD:?Run scripts/setup-env.py and configure .env}
      REDIS_SINK_PASSWORD: ${REDIS_SINK_PASSWORD:?Run scripts/setup-env.py and configure .env}
      REDIS_METRICS_PASSWORD: ${REDIS_METRICS_PASSWORD:?Run scripts/setup-env.py and configure .env}
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-768mb}
    configs:
      - source: redis_start
        target: /etc/redis/start.sh
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    deploy:
      resources:
        limits:
          cpus: ${REDIS_CPUS:-1}
          memory: ${REDIS_MEMORY:-1G}
          pids: ${REDIS_PIDS:-256}
    pids_limit: ${REDIS_PIDS:-256}
  db-init:
    image: ${DB_INIT_IMAGE:-flow-like-db-init:latest}
    build:
      context: ../../..
      dockerfile: apps/backend/docker-compose/db-init/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /workspace
    environment:
      DATABASE_URL: ${DATABASE_URL:?Run scripts/setup-env.py and configure .env}
      MIGRATION_LOCK_TIMEOUT_SECONDS: ${MIGRATION_LOCK_TIMEOUT_SECONDS:-120}
    command:
      - bun
      - /workspace/run-migration.ts
    restart: no
    deploy:
      replicas: 1
      restart_policy:
        condition: none
      resources:
        limits:
          cpus: ${DB_INIT_CPUS:-1}
          memory: ${DB_INIT_MEMORY:-1G}
          pids: ${DB_INIT_PIDS:-256}
    networks:
      - database
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    pids_limit: ${DB_INIT_PIDS:-256}
  api:
    image: ${API_IMAGE:-flow-like-api:latest}
    scale: ${API_REPLICAS:-2}
    build:
      context: ../../..
      dockerfile: apps/backend/docker-compose/api/Dockerfile
      args:
        FLOW_LIKE_CONFIG: ${FLOW_LIKE_CONFIG:-apps/backend/docker-compose/flow-like.config.example.json}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      object-store-init:
        condition: service_completed_successfully
    expose:
      - "8080"
      - "9090"
    environment:
      PORT: 8080
      RUST_LOG: ${RUST_LOG:-info,docker_compose_api=debug}
      DATABASE_URL: ${DATABASE_URL:?Run scripts/setup-env.py and configure .env}
      DATABASE_POOL_MAX_CONNECTIONS: ${DATABASE_POOL_MAX_CONNECTIONS:-10}
      DATABASE_POOL_MIN_CONNECTIONS: ${DATABASE_POOL_MIN_CONNECTIONS:-1}
      REDIS_URL: ${REDIS_URL:-redis://api:${REDIS_API_PASSWORD}@redis:6379}
      EXECUTION_STATE_BACKEND: ${EXECUTION_STATE_BACKEND:-redis}
      EXECUTION_STATE_TTL_SECONDS: ${EXECUTION_STATE_TTL_SECONDS:-86400}
      CHANNEL_TTL_SECONDS: ${CHANNEL_TTL_SECONDS:-7200}
      CACHE_BACKEND: ${CACHE_BACKEND:-redis}
      CACHE_DEFAULT_TTL_SECONDS: ${CACHE_DEFAULT_TTL_SECONDS:-0}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-aws}
      RUNTIME_CREDENTIALS_PROVIDER: ${RUNTIME_CREDENTIALS_PROVIDER:-${STORAGE_PROVIDER:-aws}}
      META_BUCKET: ${META_BUCKET:-flow-like-meta}
      CONTENT_BUCKET: ${CONTENT_BUCKET:-flow-like-content}
      LOG_BUCKET: ${LOG_BUCKET:-flow-like-logs}
      CDN_BUCKET_NAME: ${CDN_BUCKET_NAME:-}
      AWS_ENDPOINT: ${AWS_ENDPOINT:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_USE_PATH_STYLE: ${AWS_USE_PATH_STYLE:-true}
      AWS_META_BUCKET: ${AWS_META_BUCKET:-}
      AWS_CONTENT_BUCKET: ${AWS_CONTENT_BUCKET:-}
      AWS_LOG_BUCKET: ${AWS_LOG_BUCKET:-}
      META_BUCKET_EXPRESS_ZONE: ${META_BUCKET_EXPRESS_ZONE:-false}
      CONTENT_BUCKET_EXPRESS_ZONE: ${CONTENT_BUCKET_EXPRESS_ZONE:-false}
      LOGS_BUCKET_EXPRESS_ZONE: ${LOGS_BUCKET_EXPRESS_ZONE:-false}
      S3_KMS_KEY_ARN: ${S3_KMS_KEY_ARN:-}
      META_BUCKET_KMS_KEY_ARN: ${META_BUCKET_KMS_KEY_ARN:-}
      CONTENT_BUCKET_KMS_KEY_ARN: ${CONTENT_BUCKET_KMS_KEY_ARN:-}
      LOG_BUCKET_KMS_KEY_ARN: ${LOG_BUCKET_KMS_KEY_ARN:-}
      S3_KMS_BUCKET_KEY: ${S3_KMS_BUCKET_KEY:-false}
      RUNTIME_ROLE_ARN: ${RUNTIME_ROLE_ARN:-}
      AZURE_STORAGE_ACCOUNT_NAME: ${AZURE_STORAGE_ACCOUNT_NAME:-}
      AZURE_STORAGE_ACCOUNT_KEY: ${AZURE_STORAGE_ACCOUNT_KEY:-}
      AZURE_META_CONTAINER: ${AZURE_META_CONTAINER:-}
      AZURE_CONTENT_CONTAINER: ${AZURE_CONTENT_CONTAINER:-}
      AZURE_LOG_CONTAINER: ${AZURE_LOG_CONTAINER:-}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}
      GCP_META_BUCKET: ${GCP_META_BUCKET:-}
      GCP_CONTENT_BUCKET: ${GCP_CONTENT_BUCKET:-}
      GCP_LOG_BUCKET: ${GCP_LOG_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_API_TOKEN: ${R2_API_TOKEN:-}
      EXECUTION_BACKEND: ${EXECUTION_BACKEND:-http}
      ASYNC_EXECUTION_BACKEND: ${ASYNC_EXECUTION_BACKEND:-redis}
      EXECUTOR_URL: ${EXECUTOR_URL:-http://execution-gateway:9000}
      REDIS_EXECUTION_QUEUE: ${REDIS_EXECUTION_QUEUE:-exec:jobs:v3}
      EXECUTION_TIMEOUT_SECONDS: ${EXECUTION_TIMEOUT_SECONDS:-3600}
      COMPILATION_BACKEND: ${COMPILATION_BACKEND:-http}
      COMPILER_URL: ${COMPILER_URL:-http://compiler-gateway:8081}
      API_BASE_URL: ${API_BASE_URL:-http://execution-callback:8080}
      BACKEND_KEY: ${BACKEND_KEY:?Run scripts/setup-env.py and configure .env}
      BACKEND_PUB: ${BACKEND_PUB:?Run scripts/setup-env.py and configure .env}
      BACKEND_KID: ${BACKEND_KID:-backend-es256-v1}
      CLOUDFLARE_TURN_KEY_ID: ${CLOUDFLARE_TURN_KEY_ID:-}
      CLOUDFLARE_TURN_KEY_API_TOKEN: ${CLOUDFLARE_TURN_KEY_API_TOKEN:-}
      SINK_SECRET: ${SINK_SECRET:-}
      MAINTENANCE_TOKEN: ${MAINTENANCE_TOKEN:-}
      SINK_TOKEN_ENCRYPTION_KEY: ${SINK_TOKEN_ENCRYPTION_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_ENDPOINT: ${OPENROUTER_ENDPOINT:-https://openrouter.ai/api}
      HOSTED_OPENAI_API_KEY: ${HOSTED_OPENAI_API_KEY:-}
      HOSTED_OPENAI_ENDPOINT: ${HOSTED_OPENAI_ENDPOINT:-https://api.openai.com}
      HOSTED_ANTHROPIC_API_KEY: ${HOSTED_ANTHROPIC_API_KEY:-}
      HOSTED_ANTHROPIC_ENDPOINT: ${HOSTED_ANTHROPIC_ENDPOINT:-https://api.anthropic.com}
      HOSTED_AZURE_API_KEY: ${HOSTED_AZURE_API_KEY:-}
      HOSTED_AZURE_ENDPOINT: ${HOSTED_AZURE_ENDPOINT:-}
      HOSTED_BEDROCK_API_KEY: ${HOSTED_BEDROCK_API_KEY:-}
      HOSTED_BEDROCK_ENDPOINT: ${HOSTED_BEDROCK_ENDPOINT:-}
      HOSTED_VERTEX_API_KEY: ${HOSTED_VERTEX_API_KEY:-}
      HOSTED_VERTEX_ENDPOINT: ${HOSTED_VERTEX_ENDPOINT:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_ENDPOINT: ${OPENAI_ENDPOINT:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      OTEL_SERVICE_NAME: flow-like-api
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.1}
      S3_STS_PROVIDER: ${S3_STS_PROVIDER:-rustfs}
      S3_INTERNAL_ENDPOINT: ${S3_INTERNAL_ENDPOINT:-http://object-store:9000}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?Run scripts/setup-env.py and configure .env}
      STS_ENDPOINT_URL: ${STS_ENDPOINT_URL:-http://object-store:9000}
      STS_ISSUER_ACCESS_KEY: ${STS_ISSUER_ACCESS_KEY:-}
      STS_ISSUER_SECRET_KEY: ${STS_ISSUER_SECRET_KEY:-}
      STS_SESSION_TTL_SECONDS: ${STS_SESSION_TTL_SECONDS:-7200}
      META_BUCKET_ENDPOINT: ${META_BUCKET_ENDPOINT:-}
      CONTENT_BUCKET_ENDPOINT: ${CONTENT_BUCKET_ENDPOINT:-}
      LOGS_BUCKET_ENDPOINT: ${LOGS_BUCKET_ENDPOINT:-}
      EXECUTION_MANAGER_TOKEN: ${EXECUTION_MANAGER_TOKEN:?Run scripts/setup-env.py and configure .env}
      EXECUTION_ISOLATION_MODE: ${EXECUTION_ISOLATION_MODE:-per_run}
      METRICS_PORT: "9090"
      PUBLIC_API_URL: ${PUBLIC_API_URL:?Set the browser-reachable API origin}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set allowed browser origins}
      EXECUTION_QUEUE_MAX_DEPTH: ${EXECUTION_QUEUE_MAX_DEPTH:-10000}
      EXECUTION_QUEUE_MAX_WAIT_SECONDS: ${EXECUTION_QUEUE_MAX_WAIT_SECONDS:-300}
      EXECUTION_CREDENTIAL_MARGIN_SECONDS: ${EXECUTION_CREDENTIAL_MARGIN_SECONDS:-120}
      EXECUTION_STARTUP_GRACE_SECONDS: ${SANDBOX_STARTUP_TIMEOUT_SECONDS:-120}
      EXECUTION_TERMINAL_GRACE_SECONDS: ${EXECUTION_TERMINAL_GRACE_SECONDS:-60}
      EXECUTION_CLEANUP_TIMEOUT_SECONDS: ${EXECUTION_CLEANUP_TIMEOUT_SECONDS:-30}
    deploy:
      replicas: ${API_REPLICAS:-2}
      update_config:
        parallelism: 1
        order: start-first
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: ${API_CPUS:-2}
          memory: ${API_MEMORY:-2G}
          pids: ${API_PIDS:-256}
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8080/ready
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app
      - database
      - queue
      - storage
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    pids_limit: ${API_PIDS:-256}
    stop_grace_period: ${SHUTDOWN_GRACE_PERIOD:-60s}
  api-gateway:
    image: ${NGINX_IMAGE:-nginx:1.30.4-alpine@sha256:dc5069ad14f19660b141b21236140b91656bf89bbc3e2417c70ae650cd66104c}
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
      signaling:
        condition: service_healthy
    configs:
      - source: api_gateway_nginx
        target: /etc/nginx/conf.d/default.conf
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://localhost:8080/health
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: ${API_GATEWAY_CPUS:-1}
          memory: ${API_GATEWAY_MEMORY:-256M}
          pids: ${API_GATEWAY_PIDS:-256}
    networks:
      - app
      - edge
    restart: unless-stopped
    security_opt: &a3
      - no-new-privileges:true
    cap_drop: &a4
      - ALL
    logging: &a5
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    user: 101:101
    read_only: true
    tmpfs: &a2
      - /tmp:size=32m,mode=1777
      - /var/cache/nginx:size=32m,uid=101,gid=101
      - /var/run:size=1m,uid=101,gid=101
      - /etc/nginx/conf.d:size=1m,uid=101,gid=101
    entrypoint: &a1
      - nginx
      - -g
      - daemon off;
    ports:
      - ${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8080}:8080
      - ${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3001}:3001
      - ${BIND_ADDRESS:-127.0.0.1}:${SIGNALING_PORT:-4444}:4444
    pids_limit: ${API_GATEWAY_PIDS:-256}
  runtime:
    image: ${RUNTIME_IMAGE:-flow-like-runtime:latest}
    scale: ${RUNTIME_REPLICAS:-3}
    build:
      context: ../../..
      dockerfile: apps/backend/docker-compose/runtime/Dockerfile
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "9000"
    environment:
      EXECUTOR_SERVER_MODE: "true"
      PORT: 9000
      RUST_LOG: ${RUST_LOG:-info,docker_compose_runtime=debug}
      API_URL: http://api-gateway:8080
      API_BASE_URL: http://execution-callback:8080
      QUEUE_WORKER_ENABLED: ${QUEUE_WORKER_ENABLED:-true}
      REDIS_URL: ${RUNTIME_REDIS_URL:-redis://runtime:${REDIS_RUNTIME_PASSWORD}@redis:6379}
      REDIS_EXECUTION_QUEUE: ${REDIS_EXECUTION_QUEUE:-exec:jobs:v3}
      QUEUE_WORKER_CONCURRENCY: ${QUEUE_WORKER_CONCURRENCY:-10}
      QUEUE_POLL_TIMEOUT_SECS: ${QUEUE_POLL_TIMEOUT_SECS:-30}
      BACKEND_PUB: ${BACKEND_PUB:-}
      MAX_CONCURRENT_EXECUTIONS: ${MAX_CONCURRENT_EXECUTIONS:-10}
      OTEL_SERVICE_NAME: flow-like-runtime
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.1}
      EXECUTOR_TIMEOUT_SECS: ${EXECUTION_TIMEOUT_SECONDS:-3600}
      EXECUTION_ISOLATION_MODE: trusted_shared
      EXECUTION_QUEUE_MAX_DEPTH: ${EXECUTION_QUEUE_MAX_DEPTH:-10000}
      EXECUTION_QUEUE_MAX_WAIT_SECONDS: ${EXECUTION_QUEUE_MAX_WAIT_SECONDS:-300}
      EXECUTION_CREDENTIAL_MARGIN_SECONDS: ${EXECUTION_CREDENTIAL_MARGIN_SECONDS:-120}
      EXECUTION_STARTUP_GRACE_SECONDS: ${SANDBOX_STARTUP_TIMEOUT_SECONDS:-120}
      EXECUTION_TERMINAL_GRACE_SECONDS: ${EXECUTION_TERMINAL_GRACE_SECONDS:-60}
      EXECUTION_CLEANUP_TIMEOUT_SECONDS: ${EXECUTION_CLEANUP_TIMEOUT_SECONDS:-30}
      QUEUE_POLL_INTERVAL_MS: ${QUEUE_POLL_INTERVAL_MS:-250}
    deploy:
      replicas: ${RUNTIME_REPLICAS:-3}
      resources:
        limits:
          cpus: ${RUNTIME_CPUS:-4}
          memory: ${RUNTIME_MEMORY:-8G}
          pids: ${RUNTIME_PIDS:-512}
      update_config:
        parallelism: 1
        order: start-first
      restart_policy:
        condition: any
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:9000/health
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app
      - queue
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    profiles:
      - trusted
    read_only: true
    tmpfs:
      - /tmp:size=2g,mode=1777
    pids_limit: ${RUNTIME_PIDS:-512}
    stop_grace_period: ${EXECUTION_STOP_GRACE_PERIOD:-65m}
  compiler:
    image: ${COMPILER_IMAGE:-flow-like-compiler:latest}
    build:
      context: ../../..
      dockerfile: apps/backend/docker-compose/compiler/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      PORT: 8081
      METRICS_PORT: 9091
      RUST_LOG: ${RUST_LOG:-info,k8s_compiler=debug}
      API_URL: http://api-gateway:8080
      BACKEND_PUB: ${BACKEND_PUB:-}
      BACKEND_KID: ${BACKEND_KID:-backend-es256-v1}
      COMPILER_TIMEOUT_SECS: ${COMPILER_TIMEOUT_SECS:-600}
      COMPILER_CALLBACK_TIMEOUT_MS: ${COMPILER_CALLBACK_TIMEOUT_MS:-10000}
      COMPILER_CALLBACK_RETRIES: ${COMPILER_CALLBACK_RETRIES:-3}
      COMPILER_MAX_PARALLEL_TARGETS: ${COMPILER_MAX_PARALLEL_TARGETS:-}
      OTEL_SERVICE_NAME: flow-like-compiler
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.1}
      COMPILER_ALLOWED_STORAGE_HOSTS: ${COMPILER_ALLOWED_STORAGE_HOSTS:?Run scripts/setup-env.py and configure .env}
      COMPILER_MAX_CONCURRENT_JOBS: ${COMPILER_MAX_CONCURRENT_JOBS:-2}
    deploy:
      resources:
        limits:
          cpus: ${COMPILER_CPUS:-4}
          memory: ${COMPILER_MEMORY:-8G}
          pids: ${COMPILER_PIDS:-512}
      replicas: ${COMPILER_REPLICAS:-1}
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8081/health
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app
      - storage
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    read_only: true
    tmpfs:
      - /tmp:size=4g,mode=1777
    scale: ${COMPILER_REPLICAS:-1}
    pids_limit: ${COMPILER_PIDS:-512}
    stop_grace_period: ${SHUTDOWN_GRACE_PERIOD:-60s}
  sink-services:
    image: ${SINK_SERVICES_IMAGE:-flow-like-sink-services:latest}
    build:
      context: ../../..
      dockerfile: apps/backend/docker-compose/sink-services/Dockerfile
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      RUST_LOG: ${RUST_LOG:-info,docker_compose_sink_services=debug}
      API_BASE_URL: http://api-gateway:8080
      REDIS_URL: ${SINK_REDIS_URL:-redis://sink:${REDIS_SINK_PASSWORD}@redis:6379}
      SINK_TRIGGER_JWT: ${SINK_TRIGGER_JWT:-}
      CONFIG_PATH: /app/flow-like.config.json
    configs:
      - source: flowlike_runtime_config
        target: /app/flow-like.config.json
    restart: unless-stopped
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: ${SINK_SERVICES_CPUS:-1}
          memory: ${SINK_SERVICES_MEMORY:-512M}
          pids: ${SINK_SERVICES_PIDS:-256}
    networks:
      - app
      - queue
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    pids_limit: ${SINK_SERVICES_PIDS:-256}
    stop_grace_period: ${SHUTDOWN_GRACE_PERIOD:-60s}
  signaling:
    image: ${SIGNALING_IMAGE:-flow-like-signaling:latest}
    build:
      context: ../../..
      dockerfile: apps/backend/docker-compose/signaling/Dockerfile
    environment:
      PORT: 4444
      NODE_ENV: ${SIGNALING_NODE_ENV:-production}
      REDIS_URL: ${SIGNALING_REDIS_URL:-redis://signaling:${REDIS_SIGNALING_PASSWORD}@redis:6379}
      SIGNAL_CHANNEL: ${SIGNAL_CHANNEL:-signal:publish}
