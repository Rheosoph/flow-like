          memory: ${QUEUE_BRIDGE_MEMORY:-512M}
          pids: 128
      update_config:
        parallelism: 1
        order: start-first
      restart_policy:
        condition: any
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:9000/ready
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app
      - queue
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    profiles:
      - per-run
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    pids_limit: 128
    stop_grace_period: ${EXECUTION_STOP_GRACE_PERIOD:-65m}
  execution-gateway:
    image: ${NGINX_IMAGE:-nginx:1.30.4-alpine@sha256:dc5069ad14f19660b141b21236140b91656bf89bbc3e2417c70ae650cd66104c}
    user: 101:101
    entrypoint:
      - nginx
      - -g
      - daemon off;
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/cache/nginx:size=32m,uid=101,gid=101
      - /var/run:size=1m,uid=101,gid=101
      - /etc/nginx/conf.d:size=1m,uid=101,gid=101
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    configs:
      - source: execution_gateway
        target: /etc/nginx/conf.d/default.conf
    networks:
      - app
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://localhost:9000/health
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: ${RUNTIME_GATEWAY_CPUS:-0.5}
          memory: ${RUNTIME_GATEWAY_MEMORY:-128M}
          pids: ${RUNTIME_GATEWAY_PIDS:-256}
    pids_limit: ${RUNTIME_GATEWAY_PIDS:-256}
    profiles:
      - per-run
volumes:
  execution_manager_state: {}
  postgres_data: null
  redis_data: null
  prometheus_data: null
  grafana_data: null
  tempo_data: null
  object_store_data: {}
  object_store_logs: {}
networks:
  app: {}
  database:
    internal: true
  queue:
    internal: true
  storage:
    internal: true
  edge: {}
  monitoring:
    internal: true
  execution-egress:
    name: ${COMPOSE_PROJECT_NAME:-flowlike}-execution-egress
configs:
  api_gateway_nginx:
    file: ./proxy/nginx.conf
  flowlike_runtime_config:
    file: ${FLOW_LIKE_RUNTIME_CONFIG_FILE:-./flow-like.config.example.json}
  compiler_gateway:
    file: ./proxy/compiler.conf
  runtime_gateway:
    file: ./proxy/runtime.conf
  execution_callback:
    file: ./proxy/execution-callback.conf
  object_gateway:
    file: ./proxy/object-store.conf.template
  redis_start:
    file: ./scripts/redis-start.sh
  execution_gateway:
    file: ./proxy/execution.conf
