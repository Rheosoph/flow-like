[package]
name = "docker-compose-runtime"
version = "0.1.0"
edition = "2021"
description = "Flow-Like Docker Compose Execution Runtime"

[dependencies]
flow-like.workspace = true
flow-like-api = { workspace = true, features = ["kubernetes", "redis", "azure"] }
flow-like-catalog = { workspace = true, features = ["execute", "local-ml", "remote"] }
flow-like-executor = { workspace = true, features = ["all-execute"] }
flow-like-storage.workspace = true
mimalloc.workspace = true
axum.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
tracing-opentelemetry.workspace = true
tokio = { version = "1", features = ["full"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
