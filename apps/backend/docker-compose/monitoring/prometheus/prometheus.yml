global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers: []

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Flow-Like API metrics
  - job_name: 'flow-like-api'
    dns_sd_configs:
      - names: ['api']
        type: A
        port: 9090
        refresh_interval: 10s
    metrics_path: /metrics

  # Flow-Like Runtime/Executor metrics
  - job_name: 'flow-like-runtime'
    dns_sd_configs:
      - names: ['runtime', 'queue-bridge', 'execution-manager']
        type: A
        port: 9000
        refresh_interval: 10s
    metrics_path: /metrics

  # Flow-Like WASM Compiler metrics
  - job_name: 'flow-like-compiler'
    dns_sd_configs:
      - names: ['compiler']
        type: A
        port: 9091
        refresh_interval: 10s
    metrics_path: /metrics

  # Redis metrics (via redis-exporter)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  # PostgreSQL metrics (via postgres-exporter)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
