[package]
name = "docker-compose-api"
version = "0.1.0"
edition = "2024"
description = "Flow-Like Docker Compose API Service"

[dependencies]
flow-like = { workspace = true, features = ["app-runtime"] }
flow-like-api = { workspace = true, features = ["kubernetes", "redis", "cosmos", "azure", "gcp", "r2", "smtp", "sendgrid"] }
flow-like-types.workspace = true
flow-like-storage.workspace = true
flow-like-catalog = { workspace = true, features = ["all-metadata"] }
mimalloc.workspace = true
axum.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tower-http.workspace = true
hyper.workspace = true
hyper-util.workspace = true
chrono.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
tracing-opentelemetry.workspace = true

tokio = { version = "1", features = ["full"] }
reqwest.workspace = true
url = "2"
