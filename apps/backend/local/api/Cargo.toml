[package]
name = "local-api"
version = "0.1.0"
edition = "2024"

[dependencies]
flow-like.workspace = true
flow-like-api = { workspace = true, features = ["kubernetes", "redis", "azure", "smtp", "sendgrid", "sentry"] }
flow-like-types.workspace = true
flow-like-storage.workspace = true
flow-like-catalog.workspace = true
mimalloc.workspace = true
socket2 = "0.6.0"
tracing.workspace = true
tracing-subscriber.workspace = true
dotenv.workspace = true
sentry-tracing.workspace = true
sentry.workspace = true
oasgen = {version="0.25.0", features = ["axum"]}

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false

[profile.dev]
opt-level = 1
debug = 1
split-debuginfo = "unpacked"
incremental = true

[profile.dev.package."*"]
opt-level = 0
