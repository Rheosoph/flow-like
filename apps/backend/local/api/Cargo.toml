[package]
name = "local-api"
version = "0.1.0"
edition = "2024"

[dependencies]
flow-like = { workspace = true, features = ["app-runtime"] }
flow-like-api = { workspace = true, features = ["kubernetes", "redis", "cosmos", "azure", "smtp", "sendgrid", "sentry"] }
flow-like-secrets.workspace = true
flow-like-types.workspace = true
flow-like-storage.workspace = true
flow-like-catalog = { workspace = true, features = ["executor-local-metadata"] }
flow-like-aws-data = { workspace = true, optional = true }
mimalloc.workspace = true
socket2 = "0.6.0"
tracing.workspace = true
tracing-subscriber.workspace = true
dotenv.workspace = true
sentry-tracing.workspace = true
sentry.workspace = true
oasgen = {version="0.25.0", features = ["axum"]}

[features]
default = ["dsql"]
# Aurora DSQL connectivity through IAM tokens, selected at runtime by
# `DSQL_CLUSTER_ENDPOINT`. Gated so a build that will never talk to DSQL can
# drop the connector; the AWS SDK core itself is already in this binary via
# the Bedrock model provider, so the feature only trims a handful of crates.
dsql = ["dep:flow-like-aws-data"]
