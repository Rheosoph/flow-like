[package]
name = "local-runtime"
version = "0.1.0"
edition = "2021"
description = "Flow-Like Local Development Execution Runtime"

[features]
default = []
local-ml-cuda = ["flow-like/local-ml-cuda", "flow-like-catalog/local-ml-cuda", "flow-like-executor/local-ml-cuda"]
local-ml-tensorrt = ["local-ml-cuda", "flow-like/local-ml-tensorrt", "flow-like-catalog/local-ml-tensorrt", "flow-like-executor/local-ml-tensorrt"]

[dependencies]
flow-like = { workspace = true, features = ["flow-runtime", "model"] }
flow-like-api = { workspace = true, features = ["kubernetes", "redis", "azure"] }
flow-like-catalog = { workspace = true, default-features = false, features = ["local-runtime-ml"] }
flow-like-executor = { workspace = true, features = ["local-runtime-ml"] }
flow-like-storage.workspace = true
mimalloc.workspace = true
axum.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
dotenv.workspace = true
