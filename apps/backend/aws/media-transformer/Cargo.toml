[package]
name = "media-transformer"
version = "0.1.0"
edition = "2021"

[dependencies]
aws_lambda_events = { version = "0.16.1", default-features = false, features = ["s3", "sqs"] }
# Decode accepted inputs; WebP output is encoded by libwebp.
image = { version = "0.25.6", default-features = false, features = ["jpeg", "png", "gif", "bmp", "tiff", "ico"] }

serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

aws-config.workspace = true
aws-sdk-s3.workspace = true

lambda_runtime.workspace = true
tokio = { workspace = true, features = ["macros", "fs", "io-util"] }
urlencoding.workspace = true
webp.workspace = true

tempfile = "3"
