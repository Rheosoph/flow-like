[package]
name = "aws-query"
version = "0.1.0"
edition = "2024"
description = "Flow-Like AWS Lambda query service with streaming responses"

[dependencies]
flow-like-query = { workspace = true, features = ["server", "client", "all-drivers", "forecast"] }
