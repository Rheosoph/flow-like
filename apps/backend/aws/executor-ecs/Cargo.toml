[package]
name = "aws-executor-ecs"
version = "0.1.0"
edition = "2021"
description = "Flow-Like ECS Executor (EventBridge Pipe → ECS RunTask)"

[dependencies]
flow-like.workspace = true
flow-like-catalog = { workspace = true, features = ["server-execute", "remote-ml", "remote"] }
flow-like-types.workspace = true
flow-like-executor = { workspace = true, features = ["all-server-execute"] }

mimalloc.workspace = true
tracing.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
sentry.workspace = true
sentry-tracing.workspace = true
tokio = { version = "1", features = ["full"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
