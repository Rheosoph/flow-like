[package]
name = "aws-executor-ecs"
version = "0.1.0"
edition = "2021"
description = "Flow-Like ECS Executor (EventBridge Pipe → ECS RunTask)"

[dependencies]
flow-like = { workspace = true, features = ["flow-runtime", "model"] }
flow-like-catalog = { workspace = true, default-features = false, features = ["server-local-ml"] }
flow-like-types-contracts = { workspace = true, features = ["dispatch"] }
flow-like-executor = { workspace = true, features = ["server-local-ml", "channel-aws"] }

mimalloc.workspace = true
tracing.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
sentry.workspace = true
sentry-tracing.workspace = true
tokio = { version = "1", features = ["full"] }
