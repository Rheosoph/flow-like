[package]
name = "aws-maintenance"
version = "0.1.0"
edition = "2024"
description = "Database-less Flow-Like maintenance scheduler Lambda"

[dependencies]
flow-like-types.workspace = true
lambda_runtime = { version = "1.0.2", features = ["anyhow"] }
mimalloc.workspace = true
reqwest.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tracing.workspace = true

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
