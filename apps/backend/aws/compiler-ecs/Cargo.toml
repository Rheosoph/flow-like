[package]
name = "aws-compiler-ecs"
version = "0.1.0"
edition = "2021"
description = "Flow-Like ECS WASM Compiler (EventBridge Pipe → ECS RunTask)"

[dependencies]
flow-like-compiler.workspace = true
flow-like-types-contracts = { workspace = true, features = ["dispatch"] }

mimalloc.workspace = true
reqwest.workspace = true
tracing.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
