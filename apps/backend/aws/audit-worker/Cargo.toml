[package]
name = "aws-audit-worker"
version = "0.1.0"
edition = "2024"
description = "Flow-Like audit worker Lambda: one seal, sign, archive and prune pass per scheduled invocation"

[dependencies]
flow-like-audit = { workspace = true, features = ["audit-kms-aws"] }
flow-like-aws-data.workspace = true
flow-like-db.workspace = true
flow-like-secrets = { workspace = true, features = ["aws"] }
anyhow = "1.0.97"
blake3.workspace = true
sea-orm.workspace = true
serde = { workspace = true, features = ["derive"] }
lambda_runtime = { version = "1.0.2", features = ["anyhow"] }
mimalloc.workspace = true
chrono.workspace = true
serde_json.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
