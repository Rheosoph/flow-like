[package]
name = "aws-executor-async"
version = "0.1.0"
edition = "2024"
description = "Tenant-isolated AWS Lambda worker for asynchronous workflow execution"

[dependencies]
flow-like-catalog = { workspace = true, default-features = false, features = ["server-local-ml"] }
flow-like-types-contracts = { workspace = true, features = ["dispatch"] }
flow-like-types.workspace = true
flow-like-executor = { workspace = true, features = ["server-local-ml", "channel-aws"] }
mimalloc.workspace = true
lambda_runtime = { version = "1.1.2", features = ["anyhow"] }
tracing.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tracing-subscriber.workspace = true
