[package]
name = "aws-api"
version = "0.1.0"
edition = "2024"

[dependencies]
flow-like = { workspace = true, features = ["app-runtime"] }
# `dynamodb` and `s3` must stay enabled here: without them EXECUTION_STATE_BACKEND and
# CACHE_BACKEND silently fall back to Postgres on the serverless target.
flow-like-api = { workspace = true, features = ["aws", "cognito", "ses", "smtp", "sendgrid", "lambda", "sqs", "sentry", "secrets-aws", "dynamodb", "s3"] }
flow-like-secrets = { workspace = true, features = ["aws"] }
flow-like-types.workspace = true
flow-like-storage.workspace = true
flow-like-catalog = { workspace = true, features = ["all-metadata"] }
mimalloc.workspace = true
lambda_http.workspace = true
axum.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true
sentry-tracing.workspace = true
sentry.workspace = true
sentry-tower.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
