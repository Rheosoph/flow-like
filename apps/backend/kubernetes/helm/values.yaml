# Default values for flow-like Kubernetes deployment

nameOverride: ""
fullnameOverride: ""

# Global settings
global:
  imageRegistry: ""
  imagePullSecrets: []

# API Service Configuration
api:
  enabled: true
  replicaCount: 1
  image:
    repository: k3d-flow-like.localhost:5000/flow-like-k8s-api
    tag: latest
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8080

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "1"

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilization: 70
    targetMemoryUtilization: 80

  nodeSelector: {}
  tolerations: []
  affinity: {}

  # Browser origins must match the deployed web application.
  corsAllowedOrigins:
    - http://localhost:3001
    - tauri://localhost
  publicUrl: ""
  # Keys: SINK_TOKEN_ENCRYPTION_KEY, SINK_SECRET, MAINTENANCE_TOKEN.
  existingSecret: ""
  terminationGracePeriodSeconds: 120
  env: []
  envFrom: []

# Web Application Configuration (Next.js Static Export)
web:
  enabled: true
  replicaCount: 1
  image:
    repository: k3d-flow-like.localhost:5000/flow-like-k8s-web
    tag: latest
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 3001
    # NodePort for local dev (use with type: NodePort)
    nodePort: ""

  resources:
    requests:
      memory: "64Mi"
      cpu: "10m"
    limits:
      memory: "128Mi"
      cpu: "100m"

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilization: 70
    targetMemoryUtilization: 80

  nodeSelector: {}
  tolerations: []
  affinity: {}

# WASM Compiler Configuration
compiler:
  enabled: false
  replicaCount: 1
  image:
    repository: k3d-flow-like.localhost:5000/flow-like-k8s-compiler
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 8080
  timeoutSecs: 600
  callbackTimeoutMs: 10000
  callbackRetries: 3
  maxParallelTargets: 2
  maxConcurrentJobs: 2
  # Exact storage origins, including scheme and port for HTTP endpoints.
  # The bundled object gateway is added automatically.
  allowedStorageHosts: []
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "4Gi"
      cpu: "4"
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilization: 70
    targetMemoryUtilization: 80
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Realtime Signaling Configuration (collaboration WebSockets)
# Verifies realtime JWTs with BACKEND_PUB/BACKEND_KID from the jwt secret, so
# the API's BACKEND_KEY signer must belong to the same keypair.
signaling:
  enabled: false
  replicaCount: 1
  image:
    repository: k3d-flow-like.localhost:5000/flow-like-k8s-signaling
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 4444
  # Exact origins allowed to open realtime WebSocket connections (max 20).
  # Must include your web app origin (e.g. https://app.flow-like.example.com)
  # in addition to the Tauri desktop origins below.
  allowedOrigins:
    - tauri://localhost
    - http://tauri.localhost
    - https://tauri.localhost
  # Fan-out between replicas: local (default; single replica, no Redis) or
  # redis (required when replicaCount > 1; uses the chart's Redis).
  fanoutMode: local
  # signalChannel: "signal:publish" # Redis pub/sub channel when fanoutMode=redis
  # maxConnectionsPerSub: 16 # concurrent WebSocket connections per user
  resources:
    requests:
      memory: "64Mi"
      cpu: "25m"
    limits:
      memory: "256Mi"
      cpu: "500m"
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Executor artifact and execution deadline configuration
executor:
  image:
    repository: k3d-flow-like.localhost:5000/flow-like-k8s-executor
    tag: latest
    pullPolicy: IfNotPresent

  runtimeClass: runsc
  timeout: 3600
  maxRetries: 0
  ttlSecondsAfterFinished: 3600

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "2Gi"
      cpu: "2"

  maxConcurrentJobs: 100

  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    readOnlyRootFilesystem: true

# Shared executor pool for explicitly trusted workflows
executorPool:
  enabled: true
  replicaCount: 1
  maxConcurrentExecutions: 10
  image:
    repository: k3d-flow-like.localhost:5000/flow-like-k8s-executor
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 8080
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "1"
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilization: 70
    targetMemoryUtilization: 80

# =============================================================================
# Backend JWT Configuration (Required for execution)
# =============================================================================
# ES256 keypair for signing execution JWTs
# Generate from the repository root with: ./tools/gen-execution-keys.sh --export
#
# IMPORTANT: Do NOT commit real keys here! Use one of these methods:
#   1. Create a pre-existing Kubernetes Secret and set jwt.existingSecret.
#   2. Create a separate values-secrets.yaml (already covered by .gitignore):
#      helm install flow-like ./helm -f values.yaml -f values-secrets.yaml
#
jwt:
  # Base64-encoded PEM private key (use an existing Secret or values-secrets.yaml)
  backendKey: ""
  # Base64-encoded PEM public key (use an existing Secret or values-secrets.yaml)
  backendPub: ""
  # Key identifier
  backendKid: "backend-es256-v1"
  # Use an existing Secret instead of creating one. It must contain
  # BACKEND_KEY, BACKEND_PUB, and BACKEND_KID.
  existingSecret: ""

# =============================================================================
# Execution Backend Configuration
# =============================================================================
# Controls how flow executions are dispatched
execution:
  isolationMode: per_run
  # Secret key EXECUTION_MANAGER_TOKEN, also mounted into the queue bridge.
  existingSecret: ""
  managerToken: ""
  queueName: exec:jobs:v3
  queueMaxDepth: 10000
  queueMaxWaitSeconds: 300
  credentialMarginSeconds: 120
  channelTtlSeconds: 7200
  stateTtlSeconds: 86400
  # Interactive requests use the isolated manager, or the explicit trusted pool.
  backend: http
  # Isolated mode requires redis; trusted_shared requires http.
  asyncBackend: redis
  # Optional externally managed executor/manager origin.
  executorUrl: ""

# =============================================================================
# Storage Configuration
# =============================================================================
# provider: aws | azure | gcp | r2 | s3
#   - aws: Native AWS S3 with STS credentials
#   - azure: Native Azure Blob Storage with SAS tokens
#   - gcp: Native Google Cloud Storage
#   - r2: Cloudflare R2 storage
#   - s3: Generic S3-compatible storage
#
# IMPORTANT: Do NOT commit credentials here! Use values-secrets.yaml or --set
#
storage:
  provider: "s3"

  # AWS S3 Configuration (when provider=aws)
  aws:
    accessKeyId: ""
    secretAccessKey: ""
    region: "us-east-1"
    metaBucket: "flow-like-meta"
    contentBucket: "flow-like-content"
    logBucket: "flow-like-logs"  # Bucket for execution logs
    usePathStyle: false
    # Role ARN for generating scoped STS credentials (optional but recommended)
    runtimeRoleArn: ""
    # Customer-managed KMS key encrypting the buckets. Scoped credentials carry
    # the KMS grant without this; naming the key narrows that grant to it and
    # sends explicit SSE-KMS headers on writes. The runtime role must allow
    # kms:Decrypt and kms:GenerateDataKey on the key either way.
    kmsKeyArn: ""
    kmsBucketKey: false
    existingSecret: ""

  # Cloudflare R2 Configuration (when provider=r2)
  r2:
    accountId: ""
    accessKeyId: ""
    secretAccessKey: ""
    metaBucket: "flow-like-meta"
    contentBucket: "flow-like-content"
    logBucket: "flow-like-logs"  # Bucket for execution logs
    existingSecret: ""

  # Azure Blob Storage Configuration (when provider=azure)
  azure:
    accountName: ""
    accountKey: ""
    metaContainer: "meta"
    contentContainer: "content"
    logContainer: "logs"  # Container for execution logs
    existingSecret: ""

  # Google Cloud Storage Configuration (when provider=gcp)
  gcp:
    projectId: ""
    serviceAccountKey: ""  # Base64-encoded service account JSON
    metaBucket: "flow-like-meta"
    contentBucket: "flow-like-content"
    logBucket: "flow-like-logs"  # Bucket for execution logs
    existingSecret: ""

  # S3-Compatible Storage Configuration (when provider=s3)
  s3:
    endpoint: ""
    # Presigned URLs use this exact origin, reachable by browsers AND pods.
    publicEndpoint: ""
    internalEndpoint: ""
    stsEndpoint: ""
    runtimeCredentialsProvider: rustfs
    stsSessionTtlSeconds: 7200
    stsIssuerAccessKey: ""
    stsIssuerSecretKey: ""
    runtimeRoleArn: arn:aws:iam::000000000000:role/flow-like-runtime
    region: "us-east-1"
    accessKeyId: ""
    secretAccessKey: ""
    metaBucket: "flow-like-meta"
    contentBucket: "flow-like-content"
    logBucket: "flow-like-logs"  # Bucket for execution logs
    usePathStyle: true
    existingSecret: ""

# =============================================================================
# LLM Provider Configuration
# =============================================================================
# Configure upstream credentials for the API's authenticated hosted-model
# proxy. Credentials are mounted only into API pods. Executors receive
# API_BASE_URL and call the proxy, so they never receive provider credentials.
# IMPORTANT: Do NOT commit credentials here! Use values-secrets.yaml or --set
#
llm:
  # OpenRouter Configuration (recommended default)
  openrouter:
    enabled: true
    apiKey: ""
    endpoint: "https://openrouter.ai/api"
    # Existing Secret keys: OPENROUTER_API_KEY and optional OPENROUTER_ENDPOINT
    existingSecret: ""

  # Hosted OpenAI Configuration
  openai:
    enabled: false
    apiKey: ""
    endpoint: "https://api.openai.com"
    # Existing Secret keys: HOSTED_OPENAI_API_KEY and optional
    # HOSTED_OPENAI_ENDPOINT
    existingSecret: ""

  # Hosted Anthropic Configuration
  anthropic:
    enabled: false
    apiKey: ""
    endpoint: "https://api.anthropic.com"
    # Existing Secret keys: HOSTED_ANTHROPIC_API_KEY and optional
    # HOSTED_ANTHROPIC_ENDPOINT
    existingSecret: ""

  # Hosted Azure OpenAI-compatible Configuration
  azure:
    enabled: false
    apiKey: ""
    # Required when apiKey is set. Existing Secrets must contain this endpoint.
    endpoint: ""
    # Existing Secret keys: HOSTED_AZURE_API_KEY and HOSTED_AZURE_ENDPOINT
    existingSecret: ""

  # Hosted Bedrock OpenAI-compatible Configuration
  bedrock:
    enabled: false
    apiKey: ""
    # Required when apiKey is set. Existing Secrets must contain this endpoint.
    endpoint: ""
    # Existing Secret keys: HOSTED_BEDROCK_API_KEY and HOSTED_BEDROCK_ENDPOINT
    existingSecret: ""

  # Hosted Vertex OpenAI-compatible Configuration
  vertex:
    enabled: false
    apiKey: ""
    # Required when apiKey is set. Existing Secrets must contain this endpoint.
    endpoint: ""
    # Existing Secret keys: HOSTED_VERTEX_API_KEY and HOSTED_VERTEX_ENDPOINT
    existingSecret: ""

# =============================================================================
# Database Configuration
# =============================================================================
# type: internal | external
#   - internal: Deploy a single-node CockroachDB for evaluation/development
#   - external: Use an external PostgreSQL/CockroachDB database
database:
  type: internal
  pool:
    maxConnections: 10
    minConnections: 1

  # Database migration job (runs on install/upgrade)
  migration:
    enabled: true
    image:
      repository: flow-like/migration
      tag: "dev"
      pullPolicy: Always
    backoffLimit: 5
    # The completed Job remains until the next Helm upgrade so new API pods
    # can verify that their release's migration completed.
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "500m"

  # Internal CockroachDB configuration (when type=internal)
  internal:
    # The current workload uses CockroachDB start-single-node and must remain 1.
    # Use database.type=external for a production database.
    replicas: 1
    image:
      repository: cockroachdb/cockroach
      tag: v24.2.0
      pullPolicy: IfNotPresent
    auth:
      username: flowlike
      password: ""  # Auto-generated if empty
      database: flowlike
    persistence:
      storageClass: ""
      size: 10Gi
    resources:
      requests:
        memory: "512Mi"
        cpu: "250m"
      limits:
        memory: "2Gi"
        cpu: "2"
    cache: "25%"
    maxSqlMemory: "25%"
    tls:
      enabled: false
      existingSecret: ""

  # External database configuration (when type=external)
  external:
    provider: postgresql
    connectionString: ""
    existingSecret: ""

# Redis Configuration (for job queue)
redis:
  enabled: true
  image: redis:7.4.11-alpine
  # When enabled=false, this Secret must contain a complete REDIS_URL.
  # Use rediss:// for a TLS endpoint; URL-encode username/password components.
  externalExistingSecret: ""
  maxmemory: 384mb
  architecture: standalone
  auth:
    enabled: true
    # Existing Secret requires REDIS_PASSWORD and complete, URL-encoded REDIS_URL.
    # Setup generates both without putting credentials in process arguments.
    existingSecret: ""
    password: ""
  master:
    persistence:
      enabled: true
      storageClass: ""
      size: 8Gi
    resources:
      requests:
        memory: "128Mi"
        cpu: "50m"
      limits:
        memory: "512Mi"
        cpu: "1"

# Ingress Configuration
ingress:
  enabled: false
  className: ""
  annotations: {}
  # Example with separate hosts for API and web:
  # hosts:
  #   - host: api.flow-like.local
  #     paths:
  #       - path: /
  #         pathType: Prefix
  #         service: api
  #   - host: app.flow-like.local
  #     paths:
  #       - path: /
  #         pathType: Prefix
  #         service: web
  # Example with path-based routing on single host:
  # hosts:
  #   - host: flow-like.local
  #     paths:
  #       - path: /api
  #         pathType: Prefix
  #         service: api
  #       - path: /
  #         pathType: Prefix
  #         service: web
  hosts:
    - host: flow-like.local
      paths:
        - path: /
          pathType: Prefix
          # service: api (default), web, or signaling
  tls: []

# Network Policies. per_run also requires Cilium host-egress deny enforcement.
networkPolicy:
  enabled: true

  # Select the ingress controller namespace used by this installation.
  ingressNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: ingress-nginx
  dnsNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: kube-system
  # Extra rules for external databases, Redis, custom DNS or storage endpoints.
  # Rules apply only to trusted control-plane components, never sandbox pods.
  controlPlaneExtraEgress: []
  executionGatewayExtraEgress: []
  trustedExecutorExtraEgress: []

# Service Account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Pod Security
podSecurityPolicy:
  enabled: false

# =============================================================================
# Monitoring Configuration
# =============================================================================
# Deploys Prometheus and Grafana with pre-configured dashboards
monitoring:
  enabled: true

  # Distributed Tracing Configuration
  # Traces are exported via OTLP (OpenTelemetry Protocol) to Grafana Tempo
  tracing:
    enabled: true
    # Retention period for traces
    retention: 72h

  # Tempo Configuration (trace backend)
  tempo:
    image:
      repository: grafana/tempo
      tag: "2.3.1"
      pullPolicy: IfNotPresent

    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "1Gi"
        cpu: "500m"

    persistence:
      enabled: false
      storageClass: ""
      size: 10Gi

  # ServiceMonitor for external Prometheus Operator (optional)
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s

  prometheusRule:
    enabled: false
    rules: []

  # Prometheus Configuration
  prometheus:
    image:
      repository: prom/prometheus
      tag: v2.48.0
      pullPolicy: IfNotPresent

    service:
      type: ClusterIP

    # Scrape and evaluation intervals
    scrapeInterval: 15s
    evaluationInterval: 15s

    # Data retention period
    retention: 15d

    # Persistence for metrics data
    persistence:
      enabled: true
      storageClass: ""
      size: 50Gi

    resources:
      requests:
        memory: "512Mi"
        cpu: "250m"
      limits:
        memory: "2Gi"
        cpu: "1"

    nodeSelector: {}
    tolerations: []

  # Grafana Configuration
  grafana:
    image:
      repository: grafana/grafana
      tag: "10.2.2"
      pullPolicy: IfNotPresent

    service:
      type: ClusterIP
      # NodePort for local dev (use with type: NodePort)
      nodePort: ""

    # Admin credentials (password auto-generated if empty)
    adminUser: admin
    adminPassword: ""

    # Domain for Grafana (used in URLs)
    domain: localhost

    # Anonymous access (read-only dashboards without login)
    anonymous:
      enabled: false

    # Persistence for dashboards and settings
    persistence:
      enabled: true
      storageClass: ""
      size: 10Gi

    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "500m"

    # Ingress for external access to Grafana
    ingress:
      enabled: false
      className: ""
      annotations: {}
      hosts:
        - host: grafana.flow-like.local
          paths:
            - path: /
              pathType: Prefix
      tls: []

    nodeSelector: {}
    tolerations: []

  # Alertmanager Configuration (optional)
  alertmanager:
    enabled: false

# =============================================================================
# Sink Services Configuration
# =============================================================================
# Manages event sinks (cron, webhooks, bots) that trigger flow executions
sinkServices:
  enabled: false

  # Image for the sink-trigger CronJob (ultra-lean ~500KB binary)
  image:
    repository: flow-like/sink-trigger
    tag: latest
    pullPolicy: IfNotPresent

  # Scoped JWT for authenticating sink trigger calls to the API
  # Generate with: bun run tools/gen-sink-jwt.ts --type cron --secret $SECRET
  triggerJwt: ""

  # Use existing secret instead of creating one
  # Secret must have key 'trigger-jwt' containing the JWT
  existingSecret: ""

  # API base URL for sink triggers (auto-configured if empty)
  apiBaseUrl: ""

  # CronJob configuration
  cronJob:
    # Concurrency policy: Allow, Forbid, Replace
    concurrencyPolicy: Forbid
    # How many successful job history to keep
    successfulJobsHistoryLimit: 3
    # How many failed job history to keep
    failedJobsHistoryLimit: 1
    # TTL for cleaning up completed jobs
    ttlSecondsAfterFinished: 86400

    resources:
      requests:
        memory: "8Mi"
        cpu: "5m"
      limits:
        memory: "32Mi"
        cpu: "50m"

  # Bot services (run as deployment, not CronJobs)
  bots:
    enabled: false
    # Discord bot configuration
    discord:
      enabled: false
      token: ""
      existingSecret: ""
    # Telegram bot configuration
    telegram:
      enabled: false
      token: ""
      existingSecret: ""

# The runtime must already be installed on the execution nodes.
runtimeClass:
  create: false
  name: runsc
  handler: runsc

# Bundled single-node RustFS. Use an external distributed store for host HA.
rustfs:
  enabled: true
  image: rustfs/rustfs:1.0.0-rc.5@sha256:c36b3efea3d1e503f1a2581abd0e7611e0e5820dd30e1850a52384b3fc52bda4
  # Contains only RUSTFS_ROOT_USER and RUSTFS_ROOT_PASSWORD.
  existingSecret: ""
  persistence:
    storageClass: ""
    size: 100Gi
  resources:
    requests: {cpu: "500m", memory: "512Mi"}
    limits: {cpu: "2", memory: "2Gi"}
  bootstrap:
    image:
      repository: flow-like/object-store-init
      tag: local
      pullPolicy: IfNotPresent
    resources:
      requests: {cpu: "100m", memory: "128Mi"}
      limits: {cpu: "500m", memory: "256Mi"}
  gateway:
    image: nginx:1.30.4-alpine@sha256:dc5069ad14f19660b141b21236140b91656bf89bbc3e2417c70ae650cd66104c
    replicaCount: 2
    resources:
      requests: {cpu: "50m", memory: "32Mi"}
      limits: {cpu: "1", memory: "128Mi"}
    ingress:
      enabled: false
      className: ""
      host: ""
      annotations: {}
      tls: []

# Warm slots are clean, single-use runner/gateway Pod pairs per manager replica.
# Reserve only the memory and CPU that the execution nodes can supply.
executionManager:
  replicaCount: 1
  workerThreads: 2
  image:
    repository: flow-like/execution-manager
    tag: local
    # Required digest also pins the external gateway enforcement image.
    digest: ""
    pullPolicy: IfNotPresent
  maxConcurrentExecutions: 10
  warmPoolSize: 2
  warmPoolMaxAgeSeconds: 600
  warmPoolCreationConcurrency: 2
  startupGraceSeconds: 30
  terminalGraceSeconds: 60
  cleanupTimeoutSeconds: 30
  sandbox:
    # Full repository@sha256 reference for the k8s-executor image.
    image: ""
    memoryMb: 1024
    cpus: 1
    tmpMb: 256
    nodeSelector: {}
    tolerations: []
  allowedHttpsHosts: []
  # Enable only when the HTTPS endpoint enforces a bucket-only data API.
  objectStoreTlsGateway: false
  resources:
    requests: {cpu: "100m", memory: "128Mi"}
    limits: {cpu: "1", memory: "512Mi"}
  nodeSelector: {}
  tolerations: []
  queueBridge:
    replicaCount: 1
    concurrency: 10
    image:
      repository: flow-like/runtime
      tag: local
      pullPolicy: IfNotPresent
    resources:
      requests: {cpu: "100m", memory: "256Mi"}
      limits: {cpu: "1", memory: "1Gi"}
