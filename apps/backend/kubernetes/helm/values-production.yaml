# Example production overrides for the Flow-Like Helm chart.
# Replace every placeholder and keep credentials in pre-created Kubernetes
# Secrets rather than in this file.

fullnameOverride: flow-like

global:
  imageRegistry: "registry.example.com/flow-like/"
  imagePullSecrets:
    - name: registry-credentials

api:
  existingSecret: flow-like-api-config
  publicUrl: https://api.flow-like.example.com
  corsAllowedOrigins: ["https://app.flow-like.example.com", "tauri://localhost", "http://tauri.localhost", "https://tauri.localhost"]
  replicaCount: 3
  image:
    repository: api
    tag: "replace-me"
    pullPolicy: IfNotPresent
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20

web:
  replicaCount: 2
  image:
    repository: web
    tag: "replace-me"
    pullPolicy: IfNotPresent

# Realtime collaboration signaling. The hub config's signaling URL must point
# at this service (wss://signaling.flow-like.example.com below), not the
# vendor-hosted default. Tokens are signed with this deployment's BACKEND_KEY.
signaling:
  enabled: true
  replicaCount: 2
  image:
    repository: signaling
    tag: "replace-me"
    pullPolicy: IfNotPresent
  allowedOrigins:
    - https://app.flow-like.example.com
    - tauri://localhost
    - http://tauri.localhost
    - https://tauri.localhost
  # replicaCount > 1 requires Redis fan-out so peers on different pods see each other.
  fanoutMode: redis

executor:
  image:
    repository: executor
    tag: "replace-me"
    pullPolicy: IfNotPresent
  # Install runsc on execution nodes before deploying.
  runtimeClass: runsc

# The shared pool is unused by per_run. To use it for explicitly trusted work,
# also select execution.isolationMode=trusted_shared and asyncBackend=http.
# Its HPA scales shared processes, not isolated execution capacity.
executorPool:
  enabled: false
  replicaCount: 2
  image:
    repository: executor
    tag: "replace-me"
    pullPolicy: IfNotPresent
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 20

execution:
  isolationMode: per_run
  existingSecret: flow-like-execution
  backend: http
  asyncBackend: redis

jwt:
  # Required keys: BACKEND_KEY, BACKEND_PUB, BACKEND_KID
  existingSecret: flow-like-backend-jwt

# Use an external PostgreSQL or CockroachDB service for production.
database:
  type: external
  external:
    # Required key: DATABASE_URL
    existingSecret: flow-like-database
  migration:
    image:
      repository: migration
      tag: "replace-me"
      pullPolicy: IfNotPresent

storage:
  provider: s3
  s3:
    # AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, STS_ISSUER_ACCESS_KEY,
    # STS_ISSUER_SECRET_KEY. Root credentials belong in a separate Secret.
    existingSecret: flow-like-storage
    publicEndpoint: https://s3.flow-like.example.com
    stsSessionTtlSeconds: 7200

redis:
  enabled: true
  auth:
    enabled: true
    # Required keys: REDIS_PASSWORD and URL-encoded REDIS_URL
    existingSecret: flow-like-redis
  master:
    persistence:
      enabled: true
      storageClass: ""
      size: 10Gi

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: api.flow-like.example.com
      paths:
        - path: /
          pathType: Prefix
          service: api
    - host: app.flow-like.example.com
      paths:
        - path: /
          pathType: Prefix
          service: web
    - host: signaling.flow-like.example.com
      paths:
        - path: /
          pathType: Prefix
          service: signaling
  tls:
    - secretName: flow-like-tls
      hosts:
        - api.flow-like.example.com
        - app.flow-like.example.com
        - signaling.flow-like.example.com

networkPolicy:
  enabled: true

monitoring:
  enabled: true
  serviceMonitor:
    enabled: false

# Creating a RuntimeClass does not install the runtime on the nodes.
runtimeClass:
  create: false
  name: runsc
  handler: runsc

executionManager:
  replicaCount: 2
  maxConcurrentExecutions: 20
  warmPoolSize: 4
  image:
    repository: execution-manager
    tag: replace-me
    digest: "" # Set the real pushed sha256 digest, or use values-images.yaml.
  sandbox:
    image: "" # Full registry/repository@sha256 reference.
    nodeSelector:
      flow-like.io/execution: "true"
  queueBridge:
    replicaCount: 2
    concurrency: 20
    image:
      repository: runtime
      tag: replace-me
  objectStoreTlsGateway: true

rustfs:
  enabled: true
  existingSecret: flow-like-rustfs-root
  bootstrap:
    image:
      repository: object-store-init
      tag: replace-me
  persistence:
    size: 250Gi
  gateway:
    ingress:
      enabled: true
      className: nginx
      host: s3.flow-like.example.com
      tls:
        - secretName: flow-like-s3-tls
          hosts: [s3.flow-like.example.com]
