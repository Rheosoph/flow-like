# Example production overrides for the Flow-Like Helm chart.
# Replace every placeholder and keep credentials in pre-created Kubernetes
# Secrets rather than in this file.

fullnameOverride: flow-like

global:
  imageRegistry: "registry.example.com/flow-like/"
  imagePullSecrets:
    - name: registry-credentials

api:
  replicaCount: 3
  image:
    repository: api
    tag: "replace-me"
    pullPolicy: IfNotPresent
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20

web:
  replicaCount: 2
  image:
    repository: web
    tag: "replace-me"
    pullPolicy: IfNotPresent

# Realtime collaboration signaling. The hub config's signaling URL must point
# at this service (wss://signaling.flow-like.example.com below), not the
# vendor-hosted default — tokens are signed with this deployment's BACKEND_KEY.
signaling:
  enabled: true
  replicaCount: 2
  image:
    repository: signaling
    tag: "replace-me"
    pullPolicy: IfNotPresent
  allowedOrigins:
    - https://app.flow-like.example.com
    - tauri://localhost
    - http://tauri.localhost
    - https://tauri.localhost
  # replicaCount > 1 requires Redis fan-out so peers on different pods see each other.
  fanoutMode: redis

executor:
  image:
    repository: executor
    tag: "replace-me"
    pullPolicy: IfNotPresent
  # Set this only after the named RuntimeClass handler exists on cluster nodes.
  runtimeClass: kata

executorPool:
  replicaCount: 2
  image:
    repository: executor
    tag: "replace-me"
    pullPolicy: IfNotPresent
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 20

execution:
  backend: http
  asyncBackend: redis

jwt:
  # Required keys: BACKEND_KEY, BACKEND_PUB, BACKEND_KID
  existingSecret: flow-like-backend-jwt

# Use an external PostgreSQL or CockroachDB service for production.
database:
  type: external
  external:
    # Required key: DATABASE_URL
    existingSecret: flow-like-database
  migration:
    image:
      repository: migration
      tag: "replace-me"
      pullPolicy: IfNotPresent

storage:
  provider: s3
  s3:
    # Required keys are documented in values.yaml and the Helm docs.
    existingSecret: flow-like-storage

redis:
  enabled: true
  auth:
    enabled: true
    # Required key: REDIS_PASSWORD
    existingSecret: flow-like-redis
  master:
    persistence:
      enabled: true
      storageClass: ""
      size: 10Gi

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: api.flow-like.example.com
      paths:
        - path: /
          pathType: Prefix
          service: api
    - host: app.flow-like.example.com
      paths:
        - path: /
          pathType: Prefix
          service: web
    - host: signaling.flow-like.example.com
      paths:
        - path: /
          pathType: Prefix
          service: signaling
  tls:
    - secretName: flow-like-tls
      hosts:
        - api.flow-like.example.com
        - app.flow-like.example.com
        - signaling.flow-like.example.com

networkPolicy:
  enabled: true

monitoring:
  enabled: true
  serviceMonitor:
    enabled: false

# Creating the object does not install Kata on the nodes.
runtimeClass:
  create: false
  name: kata
  handler: kata
