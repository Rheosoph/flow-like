{{- if .Values.compiler.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flow-like.fullname" . }}-compiler
  labels:
    {{- include "flow-like.compiler.labels" . | nindent 4 }}
spec:
  {{- if not .Values.compiler.autoscaling.enabled }}
  replicas: {{ .Values.compiler.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "flow-like.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: compiler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "flow-like.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: compiler
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      serviceAccountName: {{ include "flow-like.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: compiler
          image: "{{ .Values.global.imageRegistry }}{{ .Values.compiler.image.repository }}:{{ .Values.compiler.image.tag }}"
          imagePullPolicy: {{ .Values.compiler.image.pullPolicy }}
          env:
            - name: PORT
              value: "{{ .Values.compiler.service.port }}"
            - name: METRICS_PORT
              value: "9090"
            - name: RUST_LOG
              value: "info"
            - name: COMPILER_MAX_CONCURRENT_JOBS
              value: {{ .Values.compiler.maxConcurrentJobs | quote }}
            - name: COMPILER_ALLOWED_STORAGE_HOSTS
              value: {{ include "flow-like.compilerStorageHosts" . | quote }}
            - name: COMPILER_TIMEOUT_SECS
              value: {{ .Values.compiler.timeoutSecs | default 600 | quote }}
            - name: COMPILER_CALLBACK_TIMEOUT_MS
              value: {{ .Values.compiler.callbackTimeoutMs | default 10000 | quote }}
            - name: COMPILER_CALLBACK_RETRIES
              value: {{ .Values.compiler.callbackRetries | default 3 | quote }}
            {{- if .Values.compiler.maxParallelTargets }}
            - name: COMPILER_MAX_PARALLEL_TARGETS
              value: {{ .Values.compiler.maxParallelTargets | quote }}
            {{- end }}
            - name: API_URL
              value: "http://{{ include "flow-like.fullname" . }}-api:{{ .Values.api.service.port }}"
            {{- if and .Values.monitoring.enabled .Values.monitoring.tracing.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://{{ include "flow-like.fullname" . }}-tempo:4317"
            - name: OTEL_SERVICE_NAME
              value: "flow-like-compiler"
            {{- end }}
            - name: BACKEND_PUB
              valueFrom:
                secretKeyRef:
                  name: {{ include "flow-like.jwtSecretName" . }}
                  key: BACKEND_PUB
            - name: BACKEND_KID
              valueFrom:
                secretKeyRef:
                  name: {{ include "flow-like.jwtSecretName" . }}
                  key: BACKEND_KID
          securityContext:
            {{- include "flow-like.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - containerPort: {{ .Values.compiler.service.port }}
              name: http
            - containerPort: 9090
              name: metrics
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          {{- with .Values.compiler.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
      {{- with .Values.compiler.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.compiler.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.compiler.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
