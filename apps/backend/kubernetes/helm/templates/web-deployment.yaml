{{- if .Values.web.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flow-like.fullname" . }}-web
  labels:
    {{- include "flow-like.web.labels" . | nindent 4 }}
spec:
  {{- if not .Values.web.autoscaling.enabled }}
  replicas: {{ .Values.web.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "flow-like.web.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "flow-like.web.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      serviceAccountName: {{ include "flow-like.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: {{ include "flow-like.image" (dict "image" .Values.web.image "global" .Values.global) | quote }}
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          env:
            - name: FLOW_LIKE_WEB_API_URL
              value: {{ default .Values.api.publicUrl .Values.web.runtimeConfig.apiUrl | quote }}
            - name: FLOW_LIKE_WEB_HOSTED_API_URL
              value: {{ if .Values.web.hostedApiUrl }}{{ .Values.web.hostedApiUrl | quote }}{{ else if .Values.api.enabled }}{{ printf "http://%s-api:%d" (include "flow-like.fullname" .) (int .Values.api.service.port) | quote }}{{ else }}{{ default .Values.api.publicUrl .Values.web.runtimeConfig.apiUrl | quote }}{{ end }}
            - name: FLOW_LIKE_WEB_REDIRECT_URL
              value: {{ .Values.web.runtimeConfig.redirectUrl | quote }}
            - name: FLOW_LIKE_WEB_LOGOUT_URL
              value: {{ .Values.web.runtimeConfig.logoutUrl | quote }}
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext:
            {{- include "flow-like.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
      {{- with .Values.web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
