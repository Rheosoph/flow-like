{{- if .Values.redis.enabled }}
{{- $fullname := include "flow-like.fullname" . -}}
{{- $secretName := include "flow-like.redisSecretName" . -}}
{{- $usesExistingSecret := and .Values.redis.auth.enabled (ne (default "" .Values.redis.auth.existingSecret) "") -}}
{{- $existing := dict -}}
{{- if not $usesExistingSecret -}}
  {{- $existing = (lookup "v1" "Secret" .Release.Namespace $secretName) -}}
{{- end -}}
{{- $password := "" -}}
{{- if .Values.redis.auth.enabled -}}
  {{- if $usesExistingSecret -}}
    {{- /* The existing Secret is read by the pod; never copy its value into a rendered manifest. */ -}}
  {{- else if $existing -}}
    {{- $password = (index $existing.data "REDIS_PASSWORD" | b64dec) -}}
  {{- else -}}
    {{- $p := (default "" .Values.redis.auth.password) -}}
    {{- if ne $p "" -}}
      {{- $password = $p -}}
    {{- else -}}
      {{- $password = (randAlphaNum 32) -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- $host := printf "%s-redis-master" $fullname -}}
{{- $url := "" -}}
{{- if .Values.redis.auth.enabled -}}
  {{- $url = printf "redis://:%s@%s:6379" ($password | urlquery | replace "+" "%20") $host -}}
{{- else -}}
  {{- $url = printf "redis://%s:6379" $host -}}
{{- end -}}

{{- if not $usesExistingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "flow-like.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
type: Opaque
stringData:
  REDIS_URL: {{ $url | quote }}
  REDIS_PASSWORD: {{ $password | quote }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $host }}
  labels:
    {{- include "flow-like.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
  selector:
    app.kubernetes.io/name: {{ include "flow-like.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-redis
  labels:
    {{- include "flow-like.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "flow-like.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "flow-like.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: redis
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      terminationGracePeriodSeconds: 60
      containers:
        - name: redis
          image: {{ .Values.redis.image | quote }}
          ports:
            - containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: REDIS_PASSWORD
          command: ["/bin/sh", "-ec"]
          args:
            - |
              test -n "$REDIS_PASSWORD" || { echo 'REDIS_PASSWORD is required' >&2; exit 1; }
              umask 077
              digest=$(printf '%s' "$REDIS_PASSWORD" | sha256sum)
              digest=${digest%% *}
              printf 'user default on #%s ~* &* +@all\n' "$digest" > /tmp/users.acl
              printf 'aclfile /tmp/users.acl\nappendonly yes\nappendfsync everysec\nmaxmemory {{ .Values.redis.maxmemory }}\nmaxmemory-policy noeviction\n' > /tmp/redis.conf
              exec redis-server /tmp/redis.conf
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          startupProbe:
            exec:
              command: ["sh", "-ec", "REDISCLI_AUTH=\"$REDIS_PASSWORD\" redis-cli ping | grep -qx PONG"]
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["sh", "-ec", "REDISCLI_AUTH=\"$REDIS_PASSWORD\" redis-cli ping | grep -qx PONG"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-ec", "REDISCLI_AUTH=\"$REDIS_PASSWORD\" redis-cli ping | grep -qx PONG"]
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
          {{- with .Values.redis.master.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
        - name: data
          {{- if .Values.redis.master.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ $fullname }}-redis
          {{- else }}
          emptyDir: {}
          {{- end }}
---
{{- if .Values.redis.master.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $fullname }}-redis
  labels:
    {{- include "flow-like.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.redis.master.persistence.size | default "8Gi" }}
  {{- if .Values.redis.master.persistence.storageClass }}
  storageClassName: {{ .Values.redis.master.persistence.storageClass | quote }}
  {{- end }}
{{- end }}

  {{- end }}
