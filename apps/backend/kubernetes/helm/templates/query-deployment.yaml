{{- if .Values.query.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flow-like.fullname" . }}-query
  labels:
    {{- include "flow-like.query.labels" . | nindent 4 }}
spec:
  {{- if not .Values.query.autoscaling.enabled }}
  replicas: {{ .Values.query.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "flow-like.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: query
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "flow-like.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: query
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      serviceAccountName: {{ include "flow-like.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: query
          image: {{ include "flow-like.image" (dict "image" .Values.query.image "global" .Values.global) | quote }}
          imagePullPolicy: {{ .Values.query.image.pullPolicy }}
          env:
            - name: PORT
              value: "{{ .Values.query.service.port }}"
            - name: RUST_LOG
              value: "info"
            - name: QUERY_MAX_ROWS
              value: {{ .Values.query.maxRows | int64 | quote }}
            - name: QUERY_MAX_TIMEOUT_MS
              value: {{ .Values.query.maxTimeoutMs | int64 | quote }}
            - name: QUERY_MEMORY_BYTES
              value: {{ .Values.query.memoryBytes | int64 | quote }}
            - name: QUERY_SPILL_DIR
              value: /spill
            - name: QUERY_SPILL_MAX_BYTES
              value: {{ .Values.query.spillMaxBytes | int64 | quote }}
            - name: QUERY_MODEL_CACHE_DIR
              value: /var/lib/flow-like/query-models
            - name: QUERY_MODEL_CACHE_MAX_BYTES
              value: {{ .Values.query.modelCacheMaxBytes | int64 | quote }}
            - name: QUERY_ALLOW_PRIVATE_NETWORKS
              value: {{ .Values.query.allowPrivateNetworks | quote }}
            - name: BACKEND_PUB
              valueFrom:
                secretKeyRef:
                  name: {{ include "flow-like.jwtSecretName" . }}
                  key: BACKEND_PUB
          securityContext:
            {{- include "flow-like.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: spill
              mountPath: /spill
            - name: models
              mountPath: /var/lib/flow-like/query-models
          ports:
            - containerPort: {{ .Values.query.service.port }}
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          {{- with .Values.query.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: spill
          emptyDir:
            sizeLimit: {{ .Values.query.spillSizeLimit }}
        - name: models
          emptyDir:
            sizeLimit: {{ .Values.query.modelCacheSizeLimit }}
      {{- with .Values.query.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.query.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.query.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
