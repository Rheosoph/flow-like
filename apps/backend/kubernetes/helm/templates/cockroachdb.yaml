{{- if eq (include "flow-like.databaseMode" .) "internal" }}
{{- $fullname := include "flow-like.fullname" . -}}
{{- $user := .Values.database.internal.auth.username -}}
{{- $dbName := .Values.database.internal.auth.database -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-cockroachdb-public
  labels:
    {{- include "flow-like.labels" . | nindent 4 }}
    app.kubernetes.io/component: cockroachdb
spec:
  type: ClusterIP
  ports:
    - name: sql
      port: 26257
      targetPort: 26257
    - name: http
      port: 8080
      targetPort: 8080
  selector:
    app.kubernetes.io/name: {{ include "flow-like.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: cockroachdb
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-cockroachdb
  labels:
    {{- include "flow-like.labels" . | nindent 4 }}
    app.kubernetes.io/component: cockroachdb
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: sql
      port: 26257
      targetPort: 26257
    - name: http
      port: 8080
      targetPort: 8080
  selector:
    app.kubernetes.io/name: {{ include "flow-like.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: cockroachdb
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}-cockroachdb
  labels:
    {{- include "flow-like.labels" . | nindent 4 }}
    app.kubernetes.io/component: cockroachdb
spec:
  serviceName: {{ $fullname }}-cockroachdb
  replicas: {{ .Values.database.internal.replicas | default 1 }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "flow-like.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: cockroachdb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "flow-like.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: cockroachdb
    spec:
      automountServiceAccountToken: false
      serviceAccountName: {{ include "flow-like.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: cockroachdb
          image: "{{ .Values.database.internal.image.repository }}:{{ .Values.database.internal.image.tag }}"
          imagePullPolicy: {{ .Values.database.internal.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: sql
              containerPort: 26257
            - name: http
              containerPort: 8080
          command:
            - /cockroach/cockroach
            - start-single-node
            - --certs-dir=/cockroach/certs
            - --advertise-addr=$(POD_NAME).{{ $fullname }}-cockroachdb.{{ .Release.Namespace }}.svc.cluster.local
            - --logtostderr=WARNING
            - --cache={{ .Values.database.internal.cache | default "25%" }}
            - --max-sql-memory={{ .Values.database.internal.maxSqlMemory | default "25%" }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: COCKROACH_CHANNEL
              value: kubernetes-helm
          volumeMounts:
            - name: node-certs
              mountPath: /cockroach/certs
              readOnly: true
            - name: datadir
              mountPath: /cockroach/cockroach-data
          readinessProbe:
            httpGet:
              path: /health?ready=1
              port: http
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTPS
            initialDelaySeconds: 30
            periodSeconds: 10
          {{- with .Values.database.internal.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: node-certs
          secret:
            secretName: {{ required "database.internal.tls.nodeSecret is required" .Values.database.internal.tls.nodeSecret }}
            defaultMode: 0400
      terminationGracePeriodSeconds: 60
  volumeClaimTemplates:
    - metadata:
        name: datadir
        labels:
          {{- include "flow-like.labels" . | nindent 10 }}
          app.kubernetes.io/component: cockroachdb
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.database.internal.persistence.storageClass }}
        storageClassName: {{ .Values.database.internal.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.database.internal.persistence.size | default "10Gi" }}
---
# Job to create user and database - runs after StatefulSet is created
# This is NOT a Helm hook - it runs as a regular Job and handles its own waiting
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-cockroachdb-init-%d" ($fullname | trunc 40 | trimSuffix "-") .Release.Revision }}
  labels:
    {{- include "flow-like.labels" . | nindent 4 }}
    app.kubernetes.io/component: cockroachdb-init
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "flow-like.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: cockroachdb-init
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: init
          image: "{{ .Values.database.internal.image.repository }}:{{ .Values.database.internal.image.tag }}"
          imagePullPolicy: {{ .Values.database.internal.image.pullPolicy | default "IfNotPresent" }}
          env:
            - name: MIGRATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.internal.tls.initSecret }}
                  key: MIGRATION_PASSWORD
          volumeMounts:
            - name: init-certs
              mountPath: /cockroach/certs
              readOnly: true
          command:
            - /bin/sh
            - -c
            - |
              set -e

              echo "Waiting for CockroachDB to be ready..."
              until /cockroach/cockroach sql \
                --certs-dir=/cockroach/certs \
                --host={{ $fullname }}-cockroachdb-public \
                -e "SELECT 1" 2>/dev/null; do
                echo "CockroachDB not ready yet, waiting..."
                sleep 3
              done

              echo "Creating user and database..."
              /cockroach/cockroach sql \
                --certs-dir=/cockroach/certs \
                --host={{ $fullname }}-cockroachdb-public \
                -e "
                  CREATE USER IF NOT EXISTS {{ $user }} WITH PASSWORD '$MIGRATION_PASSWORD';
                  ALTER USER {{ $user }} WITH PASSWORD '$MIGRATION_PASSWORD';
                  CREATE DATABASE IF NOT EXISTS {{ $dbName }};
                  GRANT admin TO {{ $user }};

                "

              echo "CockroachDB initialization complete!"
      volumes:
        - name: init-certs
          secret:
            secretName: {{ required "database.internal.tls.initSecret is required" .Values.database.internal.tls.initSecret }}
            defaultMode: 0400
            items:
              - {key: ca.crt, path: ca.crt}
              - {key: client.root.crt, path: client.root.crt}
              - {key: client.root.key, path: client.root.key}
{{- end }}
