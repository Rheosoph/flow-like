{{- if .Values.database.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "flow-like.migrationJobName" . }}
  labels:
    {{- include "flow-like.labels" . | nindent 4 }}
    app.kubernetes.io/component: db-migration
spec:
  backoffLimit: {{ .Values.database.migration.backoffLimit | default 5 }}
  template:
    metadata:
      labels:
        {{- include "flow-like.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: db-migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "flow-like.image" (dict "image" .Values.database.migration.image "global" .Values.global) | quote }}
          imagePullPolicy: {{ .Values.database.migration.image.pullPolicy | default "Always" }}
          command: ["/usr/local/bin/run-migration.sh"]
          env:
            - name: DATABASE_PROVIDER
              value: {{ if eq (include "flow-like.databaseMode" .) "internal" }}"cockroachdb"{{ else }}{{ default "postgresql" .Values.database.external.provider | quote }}{{ end }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "database.migration.existingSecret is required" .Values.database.migration.existingSecret }}
                  key: DATABASE_URL
            - name: API_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "flow-like.databaseSecretName" . }}
                  key: DATABASE_URL
            - name: AUDIT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "audit.database.existingSecret is required" .Values.audit.database.existingSecret }}
                  key: DATABASE_URL
          {{- if .Values.database.caSecret }}
          volumeMounts:
            - name: database-ca
              mountPath: /etc/database
              readOnly: true
          {{- end }}
          {{- with .Values.database.migration.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- if .Values.database.caSecret }}
      volumes:
        - name: database-ca
          secret:
            secretName: {{ .Values.database.caSecret | quote }}
            items:
              - {key: ca.crt, path: ca.crt}
      {{- end }}
{{- end }}
