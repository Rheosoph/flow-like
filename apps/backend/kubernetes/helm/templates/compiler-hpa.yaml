{{- if and .Values.compiler.enabled .Values.compiler.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "flow-like.fullname" . }}-compiler
  labels:
    {{- include "flow-like.compiler.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "flow-like.fullname" . }}-compiler
  minReplicas: {{ .Values.compiler.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.compiler.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.compiler.autoscaling.targetCPUUtilization }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.compiler.autoscaling.targetMemoryUtilization }}
{{- end }}
