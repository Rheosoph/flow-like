{{- if .Values.rustfs.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "flow-like.fullname" . }}-rustfs
spec:
  ports: [{name: s3, port: 9000, targetPort: s3}]
  selector:
    {{- include "flow-like.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: rustfs
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "flow-like.fullname" . }}-rustfs
  labels:
    {{- include "flow-like.labels" . | nindent 4 }}
    app.kubernetes.io/component: rustfs
spec:
  serviceName: {{ include "flow-like.fullname" . }}-rustfs
  replicas: 1
  selector:
    matchLabels:
      {{- include "flow-like.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: rustfs
  template:
    metadata:
      labels:
        {{- include "flow-like.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: rustfs
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: rustfs
          image: {{ .Values.rustfs.image | quote }}
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: {{ .Values.rustfs.existingSecret }}, key: RUSTFS_ROOT_USER}
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: {{ .Values.rustfs.existingSecret }}, key: RUSTFS_ROOT_PASSWORD}
            - {name: RUSTFS_VOLUMES, value: /data}
            - {name: RUSTFS_ADDRESS, value: ':9000'}
            - {name: RUSTFS_CONSOLE_ENABLE, value: 'false'}
            - {name: RUSTFS_OBS_LOG_DIRECTORY, value: /logs}
          ports: [{name: s3, containerPort: 9000}]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: logs, mountPath: /logs}
            - {name: tmp, mountPath: /tmp}
          startupProbe:
            httpGet: {path: /health, port: s3}
            periodSeconds: 2
            failureThreshold: 90
          readinessProbe:
            httpGet: {path: /health, port: s3}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: s3}
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.rustfs.resources | nindent 12 }}
      volumes:
        - name: logs
          emptyDir: {sizeLimit: 256Mi}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.rustfs.persistence.storageClass }}
        storageClassName: {{ .Values.rustfs.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.rustfs.persistence.size }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "flow-like.objectStoreInitJobName" . }}
  labels:
    {{- include "flow-like.labels" . | nindent 4 }}
    app.kubernetes.io/component: object-store-init
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        {{- include "flow-like.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: object-store-init
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: initialize
          image: "{{ .Values.global.imageRegistry }}{{ .Values.rustfs.bootstrap.image.repository }}:{{ .Values.rustfs.bootstrap.image.tag }}"
          imagePullPolicy: {{ .Values.rustfs.bootstrap.image.pullPolicy }}
          envFrom:
            - secretRef: {name: {{ .Values.rustfs.existingSecret }}}
            - secretRef: {name: {{ include "flow-like.storageSecretName" . }}}
          env:
            - name: S3_INTERNAL_ENDPOINT
              value: {{ include "flow-like.objectStoreStsEndpoint" . | quote }}
            - name: AWS_REGION
              value: {{ .Values.storage.s3.region | quote }}
            - name: META_BUCKET
              value: {{ .Values.storage.s3.metaBucket | quote }}
            - name: CONTENT_BUCKET
              value: {{ .Values.storage.s3.contentBucket | quote }}
            - name: LOG_BUCKET
              value: {{ .Values.storage.s3.logBucket | quote }}
            - name: S3_CORS_ALLOWED_ORIGINS
              value: {{ .Values.api.corsAllowedOrigins | join "," | quote }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          resources:
            {{- toYaml .Values.rustfs.bootstrap.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "flow-like.fullname" . }}-object-gateway
spec:
  ports: [{name: s3, port: 9000, targetPort: s3}]
  selector:
    {{- include "flow-like.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: object-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flow-like.fullname" . }}-object-gateway
spec:
  replicas: {{ .Values.rustfs.gateway.replicaCount }}
  selector:
    matchLabels:
      {{- include "flow-like.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: object-gateway
  template:
    metadata:
      labels:
        {{- include "flow-like.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: object-gateway
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/object-gateway-config.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: gateway
          image: {{ .Values.rustfs.gateway.image | quote }}
          command: [nginx, '-g', 'daemon off;']
          ports: [{name: s3, containerPort: 9000}]
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          readinessProbe:
            httpGet: {path: /health, port: s3}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: s3}
            periodSeconds: 15
          resources:
            {{- toYaml .Values.rustfs.gateway.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: {{ include "flow-like.fullname" . }}-object-gateway}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
{{- if .Values.rustfs.gateway.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "flow-like.fullname" . }}-object-gateway
  annotations:
    {{- $annotations := mergeOverwrite (dict "nginx.ingress.kubernetes.io/proxy-body-size" "0" "nginx.ingress.kubernetes.io/proxy-request-buffering" "off" "nginx.ingress.kubernetes.io/proxy-buffering" "off" "nginx.ingress.kubernetes.io/proxy-read-timeout" "3660" "nginx.ingress.kubernetes.io/proxy-send-timeout" "3660" "nginx.ingress.kubernetes.io/enable-access-log" "false") .Values.rustfs.gateway.ingress.annotations }}
    {{- toYaml $annotations | nindent 4 }}
spec:
  {{- if .Values.rustfs.gateway.ingress.className }}
  ingressClassName: {{ .Values.rustfs.gateway.ingress.className }}
  {{- end }}
  {{- with .Values.rustfs.gateway.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ required "rustfs.gateway.ingress.host is required" .Values.rustfs.gateway.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "flow-like.fullname" . }}-object-gateway
                port: {number: 9000}
{{- end }}
{{- end }}
