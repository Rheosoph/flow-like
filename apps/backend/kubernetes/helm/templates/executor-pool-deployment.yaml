{{- if and (eq .Values.execution.isolationMode "trusted_shared") .Values.executorPool.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flow-like.fullname" . }}-executor-pool
  labels:
    {{- include "flow-like.labels" . | nindent 4 }}
    app.kubernetes.io/component: executor-pool
spec:
  {{- if not .Values.executorPool.autoscaling.enabled }}
  replicas: {{ .Values.executorPool.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "flow-like.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: executor-pool
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "flow-like.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: executor-pool
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ add .Values.executor.timeout 60 }}
      securityContext:
        fsGroup: 1000
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: executor-pool
          image: "{{ .Values.global.imageRegistry }}{{ .Values.executorPool.image.repository }}:{{ .Values.executorPool.image.tag }}"
          imagePullPolicy: {{ .Values.executorPool.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
          readinessProbe:
            httpGet: {path: /ready, port: http}
          livenessProbe:
            httpGet: {path: /health, port: http}
          env:
            - name: EXECUTION_ISOLATION_MODE
              value: trusted_shared
            - name: EXECUTION_TIMEOUT_SECONDS
              value: {{ .Values.executor.timeout | quote }}
            - name: MAX_CONCURRENT_EXECUTIONS
              value: {{ .Values.executorPool.maxConcurrentExecutions | quote }}
            - name: EXECUTOR_SERVER_MODE
              value: "true"
            - name: PORT
              value: "{{ .Values.executorPool.service.port }}"
            - name: METRICS_PORT
              value: "9090"
            - name: RUST_LOG
              value: "info"
            # Hosted model calls are authenticated and proxied by the API.
            # Provider credentials must never be mounted into executor pods.
            - name: API_BASE_URL
              value: {{ printf "http://%s-api:%d" (include "flow-like.fullname" .) (int .Values.api.service.port) | quote }}
            {{- if and .Values.monitoring.enabled .Values.monitoring.tracing.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://{{ include "flow-like.fullname" . }}-tempo:4317"
            - name: OTEL_SERVICE_NAME
              value: "flow-like-executor"
            {{- end }}
            # JWT Verification (required for executor to verify API tokens)
            - name: BACKEND_PUB
              valueFrom:
                secretKeyRef:
                  name: {{ include "flow-like.jwtSecretName" . }}
                  key: BACKEND_PUB
            - name: BACKEND_KID
              valueFrom:
                secretKeyRef:
                  name: {{ include "flow-like.jwtSecretName" . }}
                  key: BACKEND_KID
          ports:
            - containerPort: {{ .Values.executorPool.service.port }}
              name: http
            - containerPort: 9090
              name: metrics
          {{- with .Values.executorPool.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
{{- end }}
