{{- if .Values.signaling.enabled }}
{{- $fanoutMode := default "local" .Values.signaling.fanoutMode }}
{{- $redisUsesExistingSecret := and .Values.redis.auth.enabled (ne (default "" .Values.redis.auth.existingSecret) "") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flow-like.fullname" . }}-signaling
  labels:
    {{- include "flow-like.signaling.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.signaling.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "flow-like.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: signaling
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "flow-like.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: signaling
    spec:
      serviceAccountName: {{ include "flow-like.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: signaling
          image: "{{ .Values.global.imageRegistry }}{{ .Values.signaling.image.repository }}:{{ .Values.signaling.image.tag }}"
          imagePullPolicy: {{ .Values.signaling.image.pullPolicy }}
          env:
            - name: PORT
              value: "{{ .Values.signaling.service.port }}"
            - name: REALTIME_ALLOWED_ORIGINS
              value: {{ required "signaling.allowedOrigins must list the web origin and the Tauri desktop origins" .Values.signaling.allowedOrigins | join "," | quote }}
            - name: REALTIME_FANOUT_MODE
              value: {{ $fanoutMode | quote }}
            {{- if eq $fanoutMode "redis" }}
            {{- if $redisUsesExistingSecret }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "flow-like.redisSecretName" . }}
                  key: REDIS_PASSWORD
            - name: REDIS_URL
              value: {{ printf "redis://:$(REDIS_PASSWORD)@%s-redis-master:6379" (include "flow-like.fullname" .) | quote }}
            {{- else }}
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "flow-like.redisSecretName" . }}
                  key: REDIS_URL
            {{- end }}
            {{- if .Values.signaling.signalChannel }}
            - name: SIGNAL_CHANNEL
              value: {{ .Values.signaling.signalChannel | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.signaling.maxConnectionsPerSub }}
            - name: REALTIME_MAX_CONNECTIONS_PER_SUB
              value: {{ .Values.signaling.maxConnectionsPerSub | quote }}
            {{- end }}
            - name: BACKEND_PUB
              valueFrom:
                secretKeyRef:
                  name: {{ include "flow-like.jwtSecretName" . }}
                  key: BACKEND_PUB
            - name: BACKEND_KID
              valueFrom:
                secretKeyRef:
                  name: {{ include "flow-like.jwtSecretName" . }}
                  key: BACKEND_KID
          ports:
            - containerPort: {{ .Values.signaling.service.port }}
              name: http
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          {{- with .Values.signaling.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.signaling.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.signaling.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.signaling.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
