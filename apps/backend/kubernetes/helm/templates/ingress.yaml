{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "flow-like.fullname" . }}
  labels:
    {{- include "flow-like.labels" . | nindent 4 }}
  annotations:
    {{- $annotations := mergeOverwrite (dict "nginx.ingress.kubernetes.io/proxy-read-timeout" "3660" "nginx.ingress.kubernetes.io/proxy-send-timeout" "3660" "nginx.ingress.kubernetes.io/proxy-buffering" "off" "nginx.ingress.kubernetes.io/proxy-next-upstream" "off" "nginx.ingress.kubernetes.io/enable-access-log" "false") .Values.ingress.annotations }}
    {{- toYaml $annotations | nindent 4 }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                {{- if eq .service "web" }}
                name: {{ include "flow-like.fullname" $ }}-web
                port:
                  number: {{ $.Values.web.service.port }}
                {{- else if eq .service "signaling" }}
                name: {{ include "flow-like.fullname" $ }}-signaling
                port:
                  number: {{ $.Values.signaling.service.port }}
                {{- else }}
                name: {{ include "flow-like.fullname" $ }}-api
                port:
                  number: {{ $.Values.api.service.port }}
                {{- end }}
          {{- end }}
    {{- end }}
{{- end }}
