[package]
name = "k8s-api"
version = "0.1.0"
edition = "2024"
description = "Flow-Like Kubernetes API Service"

[dependencies]
flow-like = { workspace = true, features = ["app-runtime"] }
# AWS SDK support is also required for RustFS prefix-scoped STS credentials.
flow-like-api = { workspace = true, features = ["kubernetes", "redis", "aws", "cosmos", "azure", "gcp", "r2", "smtp", "sendgrid"] }
flow-like-types.workspace = true
flow-like-storage.workspace = true
flow-like-catalog = { workspace = true, features = ["executor-local-metadata"] }
mimalloc.workspace = true
axum.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
url = "2"
sea-orm.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tower-http.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
tracing-opentelemetry.workspace = true
tokio = { version = "1", features = ["full"] }
