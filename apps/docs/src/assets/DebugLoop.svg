<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">The Flow-Like debugging loop</title>
  <desc id="desc">Debugging a flow follows a loop: reproduce the failing run, read the run log to isolate the failing node, fix that one thing, and verify with a fresh run. Version snapshots make every fix reversible.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101216"/><stop offset="1" stop-color="#17191f"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.5" fill="#343944" opacity=".42"/></pattern>
    <marker id="amberArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#f59e0b"/></marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#34d399"/></marker>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.kicker{fill:#fbbf77;font-size:15px;font-weight:750;letter-spacing:2.4px}.heading{fill:#f7f8fa;font-size:34px;font-weight:720;letter-spacing:-.7px}.sub{fill:#a7adb8;font-size:17px}.stage{fill:#f7f8fa;font-size:18px;font-weight:700}.note{fill:#8f97a4;font-size:14px}.mono{fill:#fca5a5;font-size:14px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    </style>
  </defs>
  <rect width="1440" height="720" rx="28" fill="url(#bg)"/><rect width="1440" height="720" rx="28" fill="url(#grid)"/>
  <rect x="64" y="58" width="200" height="34" rx="17" fill="#f59e0b" opacity=".12" stroke="#f59e0b" stroke-opacity=".48"/><circle cx="84" cy="75" r="5" fill="#f59e0b"/><text x="99" y="81" class="kicker">DEBUG LOOP</text>
  <text x="64" y="136" class="heading">Follow the run, not your hunch.</text>
  <text x="64" y="169" class="sub">Every run leaves a trace. The trace names the failing node — you never have to guess.</text>

  <g><rect x="64" y="256" width="280" height="124" rx="22" fill="#22252c" stroke="#464c57"/>
    <text x="88" y="296" class="stage">1 · Reproduce</text>
    <text x="88" y="322" class="note">Run it again with the same input</text>
    <text x="88" y="352" class="mono">run failed · 1.85 s</text></g>
  <g><rect x="408" y="256" width="280" height="124" rx="22" fill="#22252c" stroke="#464c57"/>
    <text x="432" y="296" class="stage">2 · Isolate</text>
    <text x="432" y="322" class="note">Open the run log, find the node</text>
    <text x="432" y="352" class="mono">✗ Send Reply — body is null</text></g>
  <g><rect x="752" y="256" width="280" height="124" rx="22" fill="#22252c" stroke="#464c57"/>
    <text x="776" y="296" class="stage">3 · Fix one thing</text>
    <text x="776" y="322" class="note">Smallest change that explains</text>
    <text x="776" y="352" class="note">the evidence — then stop</text></g>
  <g><rect x="1096" y="256" width="280" height="124" rx="22" fill="#1f2a27" stroke="#34d399" stroke-width="2"/>
    <text x="1120" y="296" class="stage">4 · Verify</text>
    <text x="1120" y="322" class="note">Fresh run, same input</text>
    <circle cx="1132" cy="348" r="10" fill="#34d399"/><path d="M1127 348l4 4 7-9" fill="none" stroke="#12201b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="1152" y="353" class="note">green — and re-run one more</text></g>

  <path d="M344 318 H394" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" marker-end="url(#amberArrow)"/>
  <path d="M688 318 H738" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" marker-end="url(#amberArrow)"/>
  <path d="M1032 318 H1082" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" marker-end="url(#greenArrow)"/>
  <path d="M1236 380 C1236 470 204 470 204 394" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 8" marker-end="url(#amberArrow)"/>
  <text x="720" y="492" text-anchor="middle" class="note">Still failing? Loop again — with one more fact than last time.</text>

  <g><rect x="200" y="548" width="1040" height="84" rx="22" fill="#191c22" stroke="#3a3f4a"/>
    <text x="720" y="583" text-anchor="middle" class="stage" font-size="16">Safety net: create a version before you fix, roll back if the fix makes it worse</text>
    <text x="720" y="610" text-anchor="middle" class="note">Log levels (Debug → Fatal) control how much evidence each run records.</text></g>
</svg>
