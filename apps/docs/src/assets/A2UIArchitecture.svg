<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
	<title id="title">A2UI architecture in Flow-Like</title>
	<desc id="description">The Visual Builder and FlowPilot both produce a declarative Flow-Like A2UI surface. The renderer displays that surface as a Page or Widget, while user actions invoke app events and workflows that can stream updates back to the surface.</desc>
	<defs>
		<linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#151519"/>
			<stop offset="0.52" stop-color="#1b1b20"/>
			<stop offset="1" stop-color="#111115"/>
		</linearGradient>
		<linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#372520"/>
			<stop offset="1" stop-color="#211d1e"/>
		</linearGradient>
		<linearGradient id="orange-line" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1600" y2="0">
			<stop offset="0" stop-color="#ff9a7e"/>
			<stop offset="1" stop-color="#ff6744"/>
		</linearGradient>
		<pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
			<circle cx="2" cy="2" r="1.25" fill="#ffffff" opacity="0.065"/>
		</pattern>
		<filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
			<feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.34"/>
		</filter>
		<filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1600" height="900">
			<feGaussianBlur stdDeviation="10" result="blur"/>
			<feMerge>
				<feMergeNode in="blur"/>
				<feMergeNode in="SourceGraphic"/>
			</feMerge>
		</filter>
		<marker id="arrow-orange" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
			<path d="M0 0L10 5L0 10Z" fill="#ff7652"/>
		</marker>
		<marker id="arrow-muted" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
			<path d="M0 0L10 5L0 10Z" fill="#8b8d96"/>
		</marker>
		<marker id="arrow-purple" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
			<path d="M0 0L10 5L0 10Z" fill="#a58aff"/>
		</marker>
	</defs>

	<rect width="1600" height="900" rx="36" fill="url(#background)"/>
	<rect x="28" y="28" width="1544" height="844" rx="28" fill="url(#dots)" stroke="#ffffff" stroke-opacity="0.08"/>
	<circle cx="775" cy="442" r="304" fill="#ff6744" opacity="0.045"/>

	<text x="88" y="102" fill="#f4f0ec" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="42" font-weight="720">One surface, two authoring paths</text>
	<text x="88" y="143" fill="#aaa7a5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21">Flow-Like renders the same declarative component model whether a person or an agent authored it.</text>
	<text x="1480" y="106" text-anchor="end" fill="#ff7652" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700" letter-spacing="3">FLOW-LIKE · A2UI</text>

	<!-- Authoring paths -->
	<g font-family="Inter, ui-sans-serif, system-ui, sans-serif" filter="url(#shadow)">
		<rect x="86" y="246" width="348" height="160" rx="24" fill="#202126" stroke="#5b5d66" stroke-width="2"/>
		<circle cx="142" cy="302" r="25" fill="#ff7652" fill-opacity="0.14"/>
		<path d="M130 294h24v18h-24zM136 288v6m12-6v6m-12 24v-6m12 6v-6" fill="none" stroke="#ff987b" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
		<text x="184" y="295" fill="#f4f0ec" font-size="23" font-weight="700">Visual Builder</text>
		<text x="184" y="324" fill="#aaa7a5" font-size="16">Drag, arrange, inspect</text>
		<line x1="122" y1="350" x2="398" y2="350" stroke="#ffffff" stroke-opacity="0.08"/>
		<text x="122" y="380" fill="#cbc8c4" font-size="15">Components · Hierarchy · Preview</text>

		<rect x="86" y="464" width="348" height="160" rx="24" fill="#202126" stroke="#5b5d66" stroke-width="2"/>
		<circle cx="142" cy="520" r="25" fill="#a58aff" fill-opacity="0.14"/>
		<path d="M142 506l3.4 8.5 8.6 3.5-8.6 3.4-3.4 8.6-3.4-8.6-8.6-3.4 8.6-3.5z" fill="none" stroke="#beaaff" stroke-width="2.5" stroke-linejoin="round"/>
		<text x="184" y="513" fill="#f4f0ec" font-size="23" font-weight="700">FlowPilot</text>
		<text x="184" y="542" fill="#aaa7a5" font-size="16">Generate and revise</text>
		<line x1="122" y1="568" x2="398" y2="568" stroke="#ffffff" stroke-opacity="0.08"/>
		<text x="122" y="598" fill="#cbc8c4" font-size="15">Current surface · Selection · Context</text>
	</g>

	<!-- Connections into surface -->
	<path d="M434 326C500 326 516 390 590 390" fill="none" stroke="url(#orange-line)" stroke-width="4" marker-end="url(#arrow-orange)" filter="url(#glow)"/>
	<path d="M434 544C500 544 516 480 590 480" fill="none" stroke="#a58aff" stroke-width="4" marker-end="url(#arrow-purple)"/>

	<!-- Declarative surface -->
	<g font-family="Inter, ui-sans-serif, system-ui, sans-serif" filter="url(#shadow)">
		<rect x="590" y="275" width="426" height="330" rx="30" fill="url(#surface)" stroke="#ff7652" stroke-width="2.5"/>
		<rect x="626" y="311" width="196" height="30" rx="15" fill="#ff7652" fill-opacity="0.15" stroke="#ff7652" stroke-opacity="0.48"/>
		<text x="724" y="332" text-anchor="middle" fill="#ff9a7e" font-size="13" font-weight="760" letter-spacing="1.6">DECLARATIVE SURFACE</text>
		<text x="626" y="390" fill="#f7f2ee" font-size="31" font-weight="720">Flow-Like A2UI</text>
		<text x="626" y="422" fill="#b8b2ae" font-size="17">IDs connect a flat component graph.</text>

		<rect x="626" y="462" width="164" height="58" rx="14" fill="#29262a" stroke="#ff8b69" stroke-opacity="0.42"/>
		<text x="708" y="485" text-anchor="middle" fill="#8e909a" font-size="12" font-weight="700" letter-spacing="1.2">STRUCTURE</text>
		<text x="708" y="508" text-anchor="middle" fill="#f0ece8" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">components[]</text>

		<rect x="806" y="462" width="174" height="58" rx="14" fill="#29262a" stroke="#59c7d8" stroke-opacity="0.42"/>
		<text x="893" y="485" text-anchor="middle" fill="#8e909a" font-size="12" font-weight="700" letter-spacing="1.2">STATE</text>
		<text x="893" y="508" text-anchor="middle" fill="#f0ece8" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">dataModel[]</text>

		<rect x="626" y="536" width="354" height="42" rx="12" fill="#29262a" stroke="#ffffff" stroke-opacity="0.12"/>
		<text x="803" y="563" text-anchor="middle" fill="#cbc8c4" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">canvasSettings · actions · bindings</text>
	</g>

	<!-- Renderer and targets -->
	<path d="M1016 440H1120" fill="none" stroke="url(#orange-line)" stroke-width="4" marker-end="url(#arrow-orange)" filter="url(#glow)"/>
	<g font-family="Inter, ui-sans-serif, system-ui, sans-serif" filter="url(#shadow)">
		<rect x="1120" y="294" width="390" height="176" rx="25" fill="#202126" stroke="#59c7d8" stroke-opacity="0.62" stroke-width="2"/>
		<circle cx="1174" cy="350" r="24" fill="#59c7d8" fill-opacity="0.13"/>
		<path d="M1162 341h24v19h-24zm0 6h24" fill="none" stroke="#7ad8e7" stroke-width="2.6" stroke-linejoin="round"/>
		<text x="1216" y="343" fill="#f4f0ec" font-size="23" font-weight="700">A2UI Renderer</text>
		<text x="1216" y="372" fill="#aaa7a5" font-size="16">Allowlisted React components</text>
		<line x1="1156" y1="400" x2="1474" y2="400" stroke="#ffffff" stroke-opacity="0.08"/>
		<text x="1156" y="432" fill="#cbc8c4" font-size="15">Bound values · responsive styles · actions</text>

		<rect x="1120" y="516" width="184" height="108" rx="21" fill="#202126" stroke="#4fd2a0" stroke-opacity="0.54"/>
		<circle cx="1162" cy="570" r="20" fill="#4fd2a0" fill-opacity="0.12"/>
		<path d="M1152 561h20v18h-20zm0 5h20" fill="none" stroke="#73ddb5" stroke-width="2.4"/>
		<text x="1194" y="565" fill="#f4f0ec" font-size="20" font-weight="700">Page</text>
		<text x="1194" y="591" fill="#aaa7a5" font-size="14">Full experience</text>

		<rect x="1326" y="516" width="184" height="108" rx="21" fill="#202126" stroke="#a58aff" stroke-opacity="0.56"/>
		<circle cx="1368" cy="570" r="20" fill="#a58aff" fill-opacity="0.13"/>
		<rect x="1359" y="561" width="8" height="8" rx="1.5" fill="none" stroke="#beaaff" stroke-width="2"/>
		<rect x="1370" y="561" width="8" height="8" rx="1.5" fill="none" stroke="#beaaff" stroke-width="2"/>
		<rect x="1359" y="572" width="8" height="8" rx="1.5" fill="none" stroke="#beaaff" stroke-width="2"/>
		<rect x="1370" y="572" width="8" height="8" rx="1.5" fill="none" stroke="#beaaff" stroke-width="2"/>
		<text x="1400" y="565" fill="#f4f0ec" font-size="20" font-weight="700">Widget</text>
		<text x="1400" y="591" fill="#aaa7a5" font-size="14">Reusable block</text>
	</g>

	<path d="M1315 470V494" fill="none" stroke="#8b8d96" stroke-width="3" stroke-linecap="round"/>
	<path d="M1315 494C1315 505 1212 505 1212 516" fill="none" stroke="#4fd2a0" stroke-width="3" stroke-linecap="round"/>
	<path d="M1315 494C1315 505 1418 505 1418 516" fill="none" stroke="#a58aff" stroke-width="3" stroke-linecap="round"/>

	<!-- Feedback loop -->
	<g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
		<path d="M1212 624V650H1315" fill="none" stroke="#8b8d96" stroke-width="2.5"/>
		<path d="M1418 624V650H1315V708H1054" fill="none" stroke="#8b8d96" stroke-width="2.5" marker-end="url(#arrow-muted)"/>
		<rect x="762" y="672" width="292" height="72" rx="18" fill="#202126" stroke="#f1b35f" stroke-opacity="0.52"/>
		<text x="908" y="701" text-anchor="middle" fill="#f4f0ec" font-size="18" font-weight="700">App event / workflow</text>
		<text x="908" y="727" text-anchor="middle" fill="#aaa7a5" font-size="14">Handle action · stream updates</text>
		<path d="M762 708H520V570H590" fill="none" stroke="#ff7652" stroke-width="2.8" marker-end="url(#arrow-orange)"/>
		<text x="1214" y="695" text-anchor="middle" fill="#8e909a" font-size="13" font-weight="700" letter-spacing="1.2">USER ACTION</text>
		<text x="619" y="695" text-anchor="middle" fill="#ff987b" font-size="13" font-weight="700" letter-spacing="1.2">A2UI UPDATES</text>
	</g>

	<text x="88" y="818" fill="#8e909a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">Conceptual architecture · exact runtime terms from the current Flow-Like source</text>
</svg>
