<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
	<title id="title">Flow-Like server execution backend selection</title>
	<desc id="description">Synchronous and streaming endpoints use EXECUTION_BACKEND while background endpoints use ASYNC_EXECUTION_BACKEND. The dispatcher can target HTTP executors, Lambda SDK modes, Redis, SQS, Kafka, or an SQS to EventBridge to ECS path. Kubernetes Job dispatch exists, but the checked-in executor's one-job runner is not implemented.</desc>
	<defs>
		<linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#111217"/>
			<stop offset="1" stop-color="#191a20"/>
		</linearGradient>
		<linearGradient id="dispatcher" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#38241f"/>
			<stop offset="1" stop-color="#211d1e"/>
		</linearGradient>
		<pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
			<circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity=".065"/>
		</pattern>
		<filter id="shadow" x="-25%" y="-30%" width="150%" height="175%">
			<feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity=".34"/>
		</filter>
		<marker id="arrow-coral" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
			<path d="M0 0 10 5 0 10z" fill="#ff7652"/>
		</marker>
		<marker id="arrow-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
			<path d="M0 0 10 5 0 10z" fill="#a58aff"/>
		</marker>
		<style>
			text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
			.heading{fill:#f6f3f0;font-size:40px;font-weight:730;letter-spacing:-.7px}
			.sub{fill:#aaa7a5;font-size:18px}
			.kicker{fill:#ff8c6b;font-size:14px;font-weight:760;letter-spacing:2.1px}
			.title{fill:#f5f2ef;font-size:20px;font-weight:700}
			.copy{fill:#aaa7a5;font-size:14px}
			.code{fill:#d8d5d2;font-size:13px;font-weight:680}
			.tag{font-size:10px;font-weight:780;letter-spacing:1px}
		</style>
	</defs>

	<rect width="1600" height="900" rx="36" fill="url(#background)"/>
	<rect x="26" y="26" width="1548" height="848" rx="29" fill="url(#dots)" stroke="#ffffff" stroke-opacity=".08"/>
	<text x="76" y="91" class="heading">Route each run to the right environment</text>
	<text x="76" y="127" class="sub">Endpoint shape selects a configuration lane; the deployment supplies the actual executor or queue.</text>
	<text x="1506" y="90" text-anchor="end" class="kicker">FLOW-LIKE · DISPATCH</text>

	<!-- Lanes -->
	<rect x="54" y="178" width="1492" height="292" rx="28" fill="#191b21" stroke="#4e3b37" stroke-width="2"/>
	<rect x="54" y="492" width="1492" height="292" rx="28" fill="#191b21" stroke="#48405e" stroke-width="2"/>
	<rect x="76" y="198" width="252" height="28" rx="14" fill="#ff7652" fill-opacity=".11"/>
	<circle cx="96" cy="212" r="5" fill="#ff7652"/>
	<text x="111" y="217" class="kicker">SYNC + STREAMING</text>
	<rect x="76" y="512" width="222" height="28" rx="14" fill="#a58aff" fill-opacity=".11"/>
	<circle cx="96" cy="526" r="5" fill="#a58aff"/>
	<text x="111" y="531" fill="#beaaff" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="760" letter-spacing="2.1">BACKGROUND</text>

	<!-- Connectors -->
	<path d="M300 324H390" fill="none" stroke="#ff7652" stroke-width="4" marker-end="url(#arrow-coral)"/>
	<path d="M702 324H780" fill="none" stroke="#ff7652" stroke-width="4"/>
	<path d="M780 258V390" fill="none" stroke="#ff7652" stroke-width="3"/>
	<path d="M780 258H846M780 324H846M780 390H846" fill="none" stroke="#ff7652" stroke-width="3" marker-end="url(#arrow-coral)"/>
	<path d="M702 292H744V202H1335V263" fill="none" stroke="#f1b35f" stroke-width="3" marker-end="url(#arrow-coral)"/>
	<path d="M300 638H390" fill="none" stroke="#a58aff" stroke-width="4" marker-end="url(#arrow-violet)"/>
	<path d="M702 638H780" fill="none" stroke="#a58aff" stroke-width="4"/>
	<path d="M780 570V703" fill="none" stroke="#a58aff" stroke-width="3"/>
	<path d="M780 570H846M780 637H846M780 703H846" fill="none" stroke="#a58aff" stroke-width="3" marker-end="url(#arrow-violet)"/>
	<path d="M702 688H750V754H1335V708" fill="none" stroke="#ff7652" stroke-width="3" marker-end="url(#arrow-coral)"/>

	<!-- Request and dispatch cards -->
	<g filter="url(#shadow)">
		<rect x="88" y="254" width="212" height="140" rx="22" fill="#202126" stroke="#ff7652" stroke-opacity=".55"/>
		<text x="116" y="286" fill="#ff987d" class="tag">ENDPOINTS</text>
		<text x="116" y="320" class="title">Interactive run</text>
		<text x="116" y="348" class="copy">`/invoke` and streaming</text>
		<rect x="116" y="365" width="154" height="24" rx="9" fill="#ff7652" fill-opacity=".1"/>
		<text x="193" y="382" text-anchor="middle" class="code">EXECUTION_BACKEND</text>
	</g>
	<g filter="url(#shadow)">
		<rect x="390" y="242" width="312" height="164" rx="25" fill="url(#dispatcher)" stroke="#ff7652" stroke-width="2.3"/>
		<text x="420" y="276" class="kicker">DISPATCHER</text>
		<text x="420" y="312" class="title">Build one run request</text>
		<text x="420" y="340" class="copy">Flow · version · start node · payload</text>
		<text x="420" y="364" class="copy">credentials · runtime variables · context</text>
		<rect x="600" y="267" width="72" height="72" rx="21" fill="#ff7652" fill-opacity=".13"/>
		<path d="M620 291h32m-32 12h24m-24 12h28" stroke="#ff987d" stroke-width="4" stroke-linecap="round"/>
	</g>
	<g filter="url(#shadow)">
		<rect x="88" y="568" width="212" height="140" rx="22" fill="#202126" stroke="#a58aff" stroke-opacity=".55"/>
		<text x="116" y="600" fill="#beaaff" class="tag">ENDPOINTS</text>
		<text x="116" y="634" class="title">Queued run</text>
		<text x="116" y="662" class="copy">`/invoke/async`</text>
		<rect x="106" y="679" width="176" height="24" rx="9" fill="#a58aff" fill-opacity=".1"/>
		<text x="194" y="696" text-anchor="middle" class="code" font-size="10.5">ASYNC_EXECUTION_BACKEND</text>
	</g>
	<g filter="url(#shadow)">
		<rect x="390" y="556" width="312" height="164" rx="25" fill="#24212a" stroke="#a58aff" stroke-width="2.3"/>
		<text x="420" y="590" fill="#beaaff" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="760" letter-spacing="2.1">DISPATCHER</text>
		<text x="420" y="626" class="title">Persist and enqueue</text>
		<text x="420" y="654" class="copy">The API returns run metadata while</text>
		<text x="420" y="678" class="copy">a worker claims the background job.</text>
		<circle cx="632" cy="611" r="31" fill="#a58aff" fill-opacity=".13"/>
		<path d="M616 603h32v24h-32zm0 0 16 13 16-13" fill="none" stroke="#beaaff" stroke-width="3" stroke-linejoin="round"/>
	</g>

	<!-- Direct destinations -->
	<g filter="url(#shadow)">
		<rect x="846" y="230" width="300" height="58" rx="17" fill="#1e2725" stroke="#4fd2a0" stroke-opacity=".56"/>
		<text x="870" y="255" fill="#73ddb5" class="tag">HTTP</text>
		<text x="936" y="256" class="title" font-size="17">Executor URL</text>
		<text x="1122" y="273" text-anchor="end" class="copy">Pool · Compose · Function URL</text>
	</g>
	<g filter="url(#shadow)">
		<rect x="846" y="296" width="300" height="58" rx="17" fill="#232129" stroke="#a58aff" stroke-opacity=".56"/>
		<text x="870" y="321" fill="#beaaff" class="tag">LAMBDA_STREAM</text>
		<text x="1005" y="322" class="title" font-size="17">Lambda stream</text>
		<text x="1122" y="339" text-anchor="end" class="copy">Private Lambda</text>
	</g>
	<g filter="url(#shadow)">
		<rect x="846" y="362" width="300" height="58" rx="17" fill="#20262a" stroke="#59c7d8" stroke-opacity=".56"/>
		<text x="870" y="387" fill="#7ad8e7" class="tag">KUBERNETES_JOB</text>
		<text x="1015" y="388" class="title" font-size="17">Job spec only</text>
		<text x="1122" y="405" text-anchor="end" class="copy">Job runner pending</text>
	</g>
	<g filter="url(#shadow)">
		<rect x="1180" y="263" width="310" height="124" rx="22" fill="#202126" stroke="#f1b35f" stroke-opacity=".55"/>
		<text x="1208" y="295" fill="#f6c779" class="tag">LAMBDA_INVOKE</text>
		<text x="1208" y="329" class="title">AWS SDK invocation</text>
		<text x="1208" y="357" class="copy">Asynchronous Lambda handoff</text>
		<path d="M1420 297l20 28-20 28h-28l20-28-20-28z" fill="none" stroke="#f6c779" stroke-width="2.5"/>
	</g>

	<!-- Queue destinations -->
	<g filter="url(#shadow)">
		<rect x="846" y="542" width="300" height="58" rx="17" fill="#232129" stroke="#a58aff" stroke-opacity=".56"/>
		<text x="870" y="567" fill="#beaaff" class="tag">REDIS</text>
		<text x="936" y="568" class="title" font-size="17">Redis queue</text>
		<text x="1122" y="585" text-anchor="end" class="copy">Compose · Kubernetes</text>
	</g>
	<g filter="url(#shadow)">
		<rect x="846" y="608" width="300" height="58" rx="17" fill="#202126" stroke="#f1b35f" stroke-opacity=".55"/>
		<text x="870" y="633" fill="#f6c779" class="tag">SQS</text>
		<text x="922" y="634" class="title" font-size="17">AWS queue</text>
		<text x="1122" y="651" text-anchor="end" class="copy">Lambda consumer</text>
	</g>
	<g filter="url(#shadow)">
		<rect x="846" y="674" width="300" height="58" rx="17" fill="#20262a" stroke="#59c7d8" stroke-opacity=".56"/>
		<text x="870" y="699" fill="#7ad8e7" class="tag">KAFKA</text>
		<text x="936" y="700" class="title" font-size="17">Kafka topic</text>
		<text x="1122" y="717" text-anchor="end" class="copy">Partitioned workers</text>
	</g>
	<g filter="url(#shadow)">
		<rect x="1180" y="568" width="310" height="140" rx="22" fill="#202126" stroke="#ff7652" stroke-opacity=".55"/>
		<text x="1208" y="600" fill="#ff987d" class="tag">SQS_EVENT_BRIDGE</text>
		<text x="1208" y="634" class="title">SQS → Pipe → ECS</text>
		<text x="1208" y="662" class="copy">Payload staged in object storage;</text>
		<text x="1208" y="684" class="copy">ECS task handles the long run.</text>
	</g>

	<!-- Footer -->
	<rect x="54" y="806" width="1492" height="42" rx="15" fill="#292a31"/>
	<circle cx="80" cy="827" r="7" fill="#ff7652"/>
	<text x="100" y="832" class="copy">Backend names describe dispatch mechanisms, not automatic security guarantees.</text>
	<text x="1518" y="832" text-anchor="end" class="copy">Availability depends on compiled features, credentials, network access, and destination infrastructure.</text>
</svg>
