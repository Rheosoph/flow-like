<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">The FlowPilot build loop</title>
  <desc id="desc">You describe intent in chat. FlowPilot plans the change, applies it to the board as reviewable edits, and you inspect the diff and run the result. The loop repeats until the app does what you asked.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101216"/><stop offset="1" stop-color="#17191f"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.5" fill="#343944" opacity=".42"/></pattern>
    <marker id="coralArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#ff7656"/></marker>
    <marker id="purpleArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#a78bfa"/></marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#34d399"/></marker>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.kicker{fill:#ff8a68;font-size:15px;font-weight:750;letter-spacing:2.4px}.heading{fill:#f7f8fa;font-size:34px;font-weight:720;letter-spacing:-.7px}.sub{fill:#a7adb8;font-size:17px}.stage{fill:#f7f8fa;font-size:18px;font-weight:700}.note{fill:#8f97a4;font-size:14px}.chat{fill:#e5e7eb;font-size:15px}
    </style>
  </defs>
  <rect width="1440" height="720" rx="28" fill="url(#bg)"/><rect width="1440" height="720" rx="28" fill="url(#grid)"/>
  <rect x="64" y="58" width="230" height="34" rx="17" fill="#ff6b4a" opacity=".12" stroke="#ff7656" stroke-opacity=".48"/><circle cx="84" cy="75" r="5" fill="#ff7656"/><text x="99" y="81" class="kicker">FLOWPILOT LOOP</text>
  <text x="64" y="136" class="heading">You say what. FlowPilot builds how. You stay in charge.</text>
  <text x="64" y="169" class="sub">Every change lands as a reviewable edit on your board — nothing is applied behind your back.</text>

  <g><rect x="64" y="252" width="312" height="132" rx="22" fill="#22252c" stroke="#464c57"/>
    <rect x="88" y="276" width="222" height="36" rx="18" fill="#ff6b4a" opacity=".14"/><text x="102" y="299" class="chat">"Triage my support inbox"</text>
    <text x="88" y="344" class="stage">1 · Describe intent</text><text x="88" y="368" class="note">Plain language, in chat</text></g>

  <g><rect x="440" y="252" width="288" height="132" rx="22" fill="#241f2c" stroke="#a78bfa" stroke-opacity=".7"/>
    <path d="M470 288l10 18 20 4-14 14 3 20-19-9-19 9 3-20-14-14 20-4z" fill="#a78bfa" opacity=".9"/>
    <text x="464" y="344" class="stage">2 · Plan</text><text x="464" y="368" class="note">Scope, nodes, wiring, data</text></g>

  <g><rect x="792" y="252" width="288" height="132" rx="22" fill="#22252c" stroke="#464c57"/>
    <rect x="816" y="282" width="84" height="26" rx="8" fill="#17191f" stroke="#34d399" stroke-opacity=".6"/><rect x="908" y="282" width="84" height="26" rx="8" fill="#17191f" stroke="#34d399" stroke-opacity=".6"/><path d="M900 295h8" stroke="#34d399" stroke-width="3"/>
    <text x="816" y="344" class="stage">3 · Apply to the board</text><text x="816" y="368" class="note">Real nodes, real wires</text></g>

  <g><rect x="1144" y="252" width="232" height="132" rx="22" fill="#1f2a27" stroke="#34d399" stroke-width="2"/>
    <circle cx="1184" cy="296" r="16" fill="#34d399"/><path d="M1176 296l6 6 11-14" fill="none" stroke="#12201b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1168" y="344" class="stage">4 · Review &amp; run</text><text x="1168" y="368" class="note">Diff, diagnostics, logs</text></g>

  <path d="M376 318 H426" fill="none" stroke="#ff7656" stroke-width="4" stroke-linecap="round" marker-end="url(#coralArrow)"/>
  <path d="M728 318 H778" fill="none" stroke="#a78bfa" stroke-width="4" stroke-linecap="round" marker-end="url(#purpleArrow)"/>
  <path d="M1080 318 H1130" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" marker-end="url(#greenArrow)"/>
  <path d="M1260 384 C1260 480 220 480 220 398" fill="none" stroke="#ff7656" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 8" marker-end="url(#coralArrow)"/>
  <text x="720" y="500" text-anchor="middle" class="note">Not quite right? Say so — the loop continues with full context.</text>

  <g><rect x="200" y="556" width="1040" height="76" rx="22" fill="#191c22" stroke="#3a3f4a"/>
    <text x="720" y="588" text-anchor="middle" class="stage" font-size="16">FlowPilot can see your boards, events, pages, data model, and run logs</text>
    <text x="720" y="614" text-anchor="middle" class="note">…and can only change what you let it change. Review is always yours.</text></g>
</svg>
