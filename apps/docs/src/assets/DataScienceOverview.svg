<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">Flow-Like data science workflow</title>
  <desc id="desc">A five-stage visual workflow loads data, explores and transforms it, analyzes it with machine learning or generative AI, visualizes findings, and deploys the result through scheduled runs, APIs, or chat.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101216"/><stop offset="1" stop-color="#17191f"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.5" fill="#343944" opacity=".42"/></pattern>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1440" height="720"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#ff7656"/></marker>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.kicker{fill:#ff8a68;font-size:15px;font-weight:750;letter-spacing:2.4px}.heading{fill:#f7f8fa;font-size:34px;font-weight:720;letter-spacing:-.7px}.sub{fill:#a7adb8;font-size:17px}.num{font-size:15px;font-weight:800}.stage{fill:#f7f8fa;font-size:21px;font-weight:720}.note{fill:#979eaa;font-size:14px}.pill{fill:#d8dbe1;font-size:14px;font-weight:650}
    </style>
  </defs>
  <rect width="1440" height="720" rx="28" fill="url(#bg)"/><rect width="1440" height="720" rx="28" fill="url(#grid)"/>
  <rect x="64" y="58" width="260" height="34" rx="17" fill="#ff6b4a" opacity=".12" stroke="#ff7656" stroke-opacity=".48"/><circle cx="84" cy="75" r="5" fill="#ff7656"/><text x="99" y="81" class="kicker">DATA SCIENCE WORKFLOW</text>
  <text x="64" y="136" class="heading">Move from raw data to a working system</text>
  <text x="64" y="169" class="sub">Each stage is explicit, reusable, and ready to automate in a visual flow.</text>

  <path d="M318 374H356M586 374H624M886 374H924M1162 374H1200" stroke="#ff7656" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)" filter="url(#glow)"/>

  <g>
    <rect x="64" y="242" width="254" height="264" rx="26" fill="#191c22" stroke="#4d3a36" stroke-width="2"/><circle cx="102" cy="282" r="19" fill="#ff7656"/><text x="102" y="288" text-anchor="middle" class="num" fill="#14161a">01</text>
    <text x="132" y="290" class="stage">Load data</text><text x="94" y="333" class="note">Bring sources into the flow.</text>
    <rect x="94" y="360" width="90" height="38" rx="11" fill="#24262d" stroke="#414753"/><text x="139" y="384" text-anchor="middle" class="pill">Files</text>
    <rect x="194" y="360" width="94" height="38" rx="11" fill="#24262d" stroke="#414753"/><text x="241" y="384" text-anchor="middle" class="pill">APIs</text>
    <rect x="94" y="410" width="194" height="38" rx="11" fill="#24262d" stroke="#414753"/><text x="191" y="434" text-anchor="middle" class="pill">Databases &amp; lakes</text>
  </g>
  <g>
    <rect x="356" y="242" width="230" height="264" rx="26" fill="#191c22" stroke="#4a425f" stroke-width="2"/><circle cx="394" cy="282" r="19" fill="#a78bfa"/><text x="394" y="288" text-anchor="middle" class="num" fill="#14161a">02</text>
    <text x="424" y="290" class="stage">Explore</text><text x="386" y="333" class="note">Understand and prepare.</text>
    <rect x="386" y="360" width="170" height="38" rx="11" fill="#282534" stroke="#574e71"/><text x="471" y="384" text-anchor="middle" class="pill">DataFusion SQL</text>
    <rect x="386" y="410" width="170" height="38" rx="11" fill="#282534" stroke="#574e71"/><text x="471" y="434" text-anchor="middle" class="pill">Clean &amp; transform</text>
  </g>
  <g>
    <rect x="624" y="212" width="262" height="324" rx="28" fill="#1d1c24" stroke="#8b6ee8" stroke-width="2"/><circle cx="662" cy="252" r="19" fill="#a78bfa" filter="url(#glow)"/><text x="662" y="258" text-anchor="middle" class="num" fill="#14161a">03</text>
    <text x="692" y="260" class="stage">Analyze</text><text x="654" y="305" class="note">Choose the right intelligence.</text>
    <rect x="654" y="334" width="202" height="70" rx="15" fill="#292635" stroke="#5b5278"/><circle cx="682" cy="369" r="9" fill="#ff7656"/><text x="710" y="363" class="pill">Machine learning</text><text x="710" y="386" class="note">Train and predict</text>
    <rect x="654" y="420" width="202" height="70" rx="15" fill="#292635" stroke="#5b5278"/><circle cx="682" cy="455" r="9" fill="#34d399"/><text x="710" y="449" class="pill">GenAI agents</text><text x="710" y="472" class="note">Investigate and explain</text>
  </g>
  <g>
    <rect x="924" y="242" width="238" height="264" rx="26" fill="#191c22" stroke="#315145" stroke-width="2"/><circle cx="962" cy="282" r="19" fill="#34d399"/><text x="962" y="288" text-anchor="middle" class="num" fill="#14161a">04</text>
    <text x="992" y="290" class="stage">Visualize</text><text x="954" y="333" class="note">Make findings legible.</text>
    <rect x="954" y="360" width="178" height="38" rx="11" fill="#202b28" stroke="#3e6759"/><text x="1043" y="384" text-anchor="middle" class="pill">Charts &amp; tables</text>
    <rect x="954" y="410" width="178" height="38" rx="11" fill="#202b28" stroke="#3e6759"/><text x="1043" y="434" text-anchor="middle" class="pill">Dashboards</text>
  </g>
  <g>
    <rect x="1200" y="242" width="176" height="264" rx="26" fill="#191c22" stroke="#4d3a36" stroke-width="2"/><circle cx="1238" cy="282" r="19" fill="#ff7656"/><text x="1238" y="288" text-anchor="middle" class="num" fill="#14161a">05</text>
    <text x="1268" y="290" class="stage">Deploy</text><text x="1230" y="333" class="note">Ship the result.</text>
    <rect x="1230" y="360" width="116" height="36" rx="11" fill="#24262d" stroke="#414753"/><text x="1288" y="383" text-anchor="middle" class="pill">Schedules</text>
    <rect x="1230" y="408" width="116" height="36" rx="11" fill="#24262d" stroke="#414753"/><text x="1288" y="431" text-anchor="middle" class="pill">APIs</text>
    <rect x="1230" y="456" width="116" height="36" rx="11" fill="#24262d" stroke="#414753"/><text x="1288" y="479" text-anchor="middle" class="pill">Chat</text>
  </g>
  <path d="M1288 535 C1288 625 193 625 193 526" fill="none" stroke="#59606d" stroke-width="2" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <text x="720" y="642" text-anchor="middle" class="sub">Monitor the deployed result, then feed what you learn into the next iteration.</text>
</svg>
