<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description"><title id="title">A dependable Undo history</title><desc id="description">Keep local edits ordered while collaboration continues. Edit: Record a reversible local change. Persist: Serialize a bounded history. Merge: Keep history through remote updates. Undo or redo: Move through the local timeline. Local history and remote collaboration need consistent ordering.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#ee6c49" stroke-width="1.7"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#244559" flood-opacity=".07"/></filter></defs><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#f3f7f8" stroke="none"/><circle cx="1530" cy="80" r="250" fill="#ee6c49" opacity=".035"/><rect x="0" y="0" width="14" height="1000" rx="0" fill="#ee6c49" stroke="none"/><text x="64" y="68" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#13283d"><tspan x="64" dy="0">FLOW-LIKE</tspan></text><text x="245" y="68" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#51677a"><tspan x="245" dy="0">THE BOARD EDITOR</tspan></text><text x="1310" y="68" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#51677a"><tspan x="1310" dy="0">HOW IT WORKS</tspan></text><text x="64" y="161" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700" fill="#13283d"><tspan x="64" dy="0">A dependable Undo history</tspan></text><text x="66" y="252" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#51677a"><tspan x="66" dy="0">Keep local edits ordered while collaboration continues.</tspan></text><path d="M210,362 H1380" stroke="#ee6c49" stroke-width="3"/><circle cx="227" cy="362" r="10" fill="#ee6c49"/><g filter="url(#shadow)"><rect x="64" y="405" width="345" height="205" rx="20" fill="#ffffff" stroke="#dce6e9"/></g><rect x="86" y="427" width="42" height="30" rx="9" fill="#ee6c49" stroke="none"/><text x="93" y="449" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="white"><tspan x="93" dy="0">01</tspan></text><text x="86" y="491" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#13283d"><tspan x="86" dy="0">Edit</tspan></text><text x="86" y="532" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#51677a"><tspan x="86" dy="0">Record a reversible local</tspan><tspan x="86" dy="27.94">change</tspan></text><circle cx="602" cy="362" r="10" fill="#ee6c49"/><g filter="url(#shadow)"><rect x="439" y="405" width="345" height="205" rx="20" fill="#ffffff" stroke="#dce6e9"/></g><rect x="461" y="427" width="42" height="30" rx="9" fill="#ee6c49" stroke="none"/><text x="468" y="449" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="white"><tspan x="468" dy="0">02</tspan></text><text x="461" y="491" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#13283d"><tspan x="461" dy="0">Persist</tspan></text><text x="461" y="532" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#51677a"><tspan x="461" dy="0">Serialize a bounded</tspan><tspan x="461" dy="27.94">history</tspan></text><circle cx="977" cy="362" r="10" fill="#ee6c49"/><g filter="url(#shadow)"><rect x="814" y="405" width="345" height="205" rx="20" fill="#ffffff" stroke="#dce6e9"/></g><rect x="836" y="427" width="42" height="30" rx="9" fill="#ee6c49" stroke="none"/><text x="843" y="449" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="white"><tspan x="843" dy="0">03</tspan></text><text x="836" y="491" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#13283d"><tspan x="836" dy="0">Merge</tspan></text><text x="836" y="532" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#51677a"><tspan x="836" dy="0">Keep history through</tspan><tspan x="836" dy="27.94">remote updates</tspan></text><circle cx="1352" cy="362" r="10" fill="#ee6c49"/><g filter="url(#shadow)"><rect x="1189" y="405" width="345" height="205" rx="20" fill="#ffffff" stroke="#dce6e9"/></g><rect x="1211" y="427" width="42" height="30" rx="9" fill="#ee6c49" stroke="none"/><text x="1218" y="449" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="white"><tspan x="1218" dy="0">04</tspan></text><text x="1211" y="491" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#13283d"><tspan x="1211" dy="0">Undo or redo</tspan></text><text x="1211" y="532" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#51677a"><tspan x="1211" dy="0">Move through the local</tspan><tspan x="1211" dy="27.94">timeline</tspan></text><rect x="64" y="836" width="1472" height="98" rx="16" fill="#e6edf0" stroke="none"/><text x="88" y="877" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#51677a"><tspan x="88" dy="0">Local history and remote collaboration need consistent ordering.</tspan></text><text x="64" y="971" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#51677a"><tspan x="64" dy="0">Flow-Like · Feature overview</tspan></text></svg>