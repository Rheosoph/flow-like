rder and validate changes</tspan></text><g filter="url(#shadow)"><rect x="814" y="568" width="710" height="188" rx="20" fill="#ffffff" stroke="#dce6e9"/></g><rect x="836" y="590" width="42" height="30" rx="9" fill="#366ddc" stroke="none"/><text x="843" y="612" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="white"><tspan x="843" dy="0">04</tspan></text><text x="836" y="654" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#13283d"><tspan x="836" dy="0">Recover</tspan></text><text x="836" y="695" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#51677a"><tspan x="836" dy="0">Bound retries and inspect errors</tspan></text><rect x="64" y="836" width="1472" height="98" rx="16" fill="#e6edf0" stroke="none"/><text x="88" y="877" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#51677a"><tspan x="88" dy="0">Connections, schema changes and migrations each need their own compatibility checks.</tspan></text><text x="64" y="971" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#51677a"><tspan x="64" dy="0">Flow-Like · Feature overview</tspan></text></svg>