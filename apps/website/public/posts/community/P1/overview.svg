<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description"><title id="title">Ask before continuing</title><desc id="description">An on-demand channel brings a browser response back to a remote run. Remote run: Needs a user's response. Open interaction: Show the requested input. User responds: Submit the permitted choice. Run continues: Consume the response. Open an interaction when the run needs a response, then continue with that response.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#366ddc" stroke-width="1.7"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#244559" flood-opacity=".07"/></filter></defs><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#f3f7f8" stroke="none"/><circle cx="1530" cy="80" r="250" fill="#366ddc" opacity=".035"/><rect x="0" y="0" width="14" height="1000" rx="0" fill="#366ddc" stroke="none"/><text x="64" y="68" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#13283d"><tspan x="64" dy="0">FLOW-LIKE</tspan></text><text x="245" y="68" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#51677a"><tspan x="245" dy="0">PERFORMANCE</tspan></text><text x="1310" y="68" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#51677a"><tspan x="1310" dy="0">HOW IT WORKS</tspan></text><text x="64" y="161" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700" fill="#13283d"><tspan x="64" dy="0">Ask before continuing</tspan></text><text x="66" y="252" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#51677a"><tspan x="66" dy="0">An on-demand channel brings a browser response back to a remote run.</tspan></text><g filter="url(#shadow)"><rect x="194" y="350" width="500" height="188" rx="20" fill="#ffffff" stroke="#dce6e9"/></g><rect x="216" y="372" width="42" height="30" rx="9" fill="#366ddc" stroke="none"/><text x="223" y="394" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="white"><tspan x="223" dy="0">01</tspan></text><text x="216" y="436" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#13283d"><tspan x="216" dy="0">Remote run</tspan></text><text x="216" y="477" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#51677a"><tspan x="216" dy="0">Needs a user's response</tspan></text><g filter="url(#shadow)"><rect x="904" y="350" width="500" height="188" rx="20" fill="#ffffff" stroke="#dce6e9"/></g><rect x="926" y="372" width="42" height="30" rx="9" fill="#366ddc" stroke="none"/><text x="933" y="394" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="white"><tspan x="933" dy="0">02</tspan></text><text x="926" y="436" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#13283d"><tspan x="926" dy="0">Open interaction</tspan></text><text x="926" y="477" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#51677a"><tspan x="926" dy="0">Show the requested input</tspan></text><g filter="url(#shadow)"><rect x="904" y="600" width="500" height="188" rx="20" fill="#ffffff" stroke="#dce6e9"/></g><rect x="926" y="622" width="42" height="30" rx="9" fill="#366ddc" stroke="none"/><text x="933" y="644" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="white"><tspan x="933" dy="0">03</tspan></text><text x="926" y="686" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#13283d"><tspan x="926" dy="0">User responds</tspan></text><text x="926" y="727" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#51677a"><tspan x="926" dy="0">Submit the permitted choice</tspan></text><g filter="url(#shadow)"><rect x="194" y="600" width="500" height="188" rx="20" fill="#ffffff" stroke="#dce6e9"/></g><rect x="216" y="622" width="42" height="30" rx="9" fill="#366ddc" stroke="none"/><text x="223" y="644" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="white"><tspan x="223" dy="0">04</tspan></text><text x="216" y="686" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#13283d"><tspan x="216" dy="0">Run continues</tspan></text><text x="216" y="727" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#51677a"><tspan x="216" dy="0">Consume the response</tspan></text><path d="M714,442 L878,442" fill="none" stroke="#366ddc" stroke-width="3" marker-end="url(#arrow)"/><path d="M1154,550 L1154,586" fill="none" stroke="#366ddc" stroke-width="3" marker-end="url(#arrow)"/><path d="M878,694 L714,694" fill="none" stroke="#366ddc" stroke-width="3" marker-end="url(#arrow)"/><path d="M444,588 L444,553" fill="none" stroke="#366ddc" stroke-width="3" marker-end="url(#arrow)"/><rect x="64" y="836" width="1472" height="98" rx="16" fill="#e6edf0" stroke="none"/><text x="88" y="877" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#51677a"><tspan x="88" dy="0">Open an interaction when the run needs a response, then continue with that response.</tspan></text><text x="64" y="971" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#51677a"><tspan x="64" dy="0">Flow-Like · Feature overview</tspan></text></svg>