<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1150" viewBox="0 0 1800 1150" role="img" aria-labelledby="title description"><title id="title">A shared assistant, three ways to build it</title><desc id="description">How Flow-Like, custom GPTs, and Langdock connect your sources, workflows, and team. . </desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#ee6c49" stroke-width="1.7"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#244559" flood-opacity=".07"/></filter></defs><rect x="0" y="0" width="1800" height="1150" rx="0" fill="#f3f7f8" stroke="none"/><circle cx="1730" cy="80" r="250" fill="#ee6c49" opacity=".035"/><rect x="0" y="0" width="14" height="1150" rx="0" fill="#ee6c49" stroke="none"/><text x="64" y="68" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#13283d"><tspan x="64" dy="0">FLOW-LIKE</tspan></text><text x="245" y="68" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#51677a"><tspan x="245" dy="0">PROJECT SPOTLIGHT</tspan></text><text x="1510" y="68" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#51677a"><tspan x="1510" dy="0">KNOWLEDGE CHAT</tspan></text><text x="64" y="157" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" fill="#13283d"><tspan x="64" dy="0">A shared assistant, three ways to build it</tspan></text><text x="66" y="212" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#51677a"><tspan x="66" dy="0">How Flow-Like, custom GPTs, and Langdock connect your sources, workflows, and team.</tspan></text><rect x="326" y="266" width="448" height="108" rx="14" fill="#fcebe4" stroke="none"/><text x="348" y="308" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#13283d"><tspan x="348" dy="0">Flow-Like</tspan></text><text x="348" y="346" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#51677a"><tspan x="348" dy="0">A project you can adapt</tspan></text><rect x="806" y="266" width="448" height="108" rx="14" fill="#e8effa" stroke="none"/><text x="828" y="308" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#13283d"><tspan x="828" dy="0">OpenAI custom GPTs</tspan></text><text x="828" y="346" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#51677a"><tspan x="828" dy="0">Configuration in ChatGPT</tspan></text><rect x="1286" y="266" width="448" height="108" rx="14" fill="#e4f2ef" stroke="none"/><text x="1308" y="308" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#13283d"><tspan x="1308" dy="0">Langdock Agents</tspan></text><text x="1308" y="346" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#51677a"><tspan x="1308" dy="0">Agents in a shared workspace</tspan></text><text x="66" y="442" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#13283d"><tspan x="66" dy="0">Knowledge</tspan></text><rect x="326" y="399" width="448" height="152" rx="12" fill="white" stroke="#dce6e9"/><text x="350" y="436" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#13283d"><tspan x="350" dy="0">Bring websites and files into your</tspan><tspan x="350" dy="29.21">chat. Add sources through the</tspan><tspan x="350" dy="29.21">workflow.</tspan></text><rect x="806" y="399" width="448" height="152" rx="12" fill="white" stroke="#dce6e9"/><text x="830" y="436" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#13283d"><tspan x="830" dy="0">Attach documents as knowledge.</tspan><tspan x="830" dy="29.21">Connect services through apps or</tspan><tspan x="830" dy="29.21">API Actions.</tspan></text><rect x="1286" y="399" width="448" height="152" rx="12" fill="white" stroke="#dce6e9"/><text x="1310" y="436" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#13283d"><tspan x="1310" dy="0">Use files, knowledge bases and</tspan><tspan x="1310" dy="29.21">synced folders, including</tspan><tspan x="1310" dy="29.21">SharePoint.</tspan></text><text x="66" y="616" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#13283d"><tspan x="66" dy="0">Extend it</tspan></text><rect x="326" y="573" width="448" height="152" rx="12" fill="white" stroke="#dce6e9"/><text x="350" y="610" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#13283d"><tspan x="350" dy="0">Fork Knowledge Chat. Change how it</tspan><tspan x="350" dy="29.21">imports, finds and uses</tspan><tspan x="350" dy="29.21">information.</tspan></text><rect x="806" y="573" width="448" height="152" rx="12" fill="white" stroke="#dce6e9"/><text x="830" y="610" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#13283d"><tspan x="830" dy="0">Configure instructions, approved</tspan><tspan x="830" dy="29.21">apps or custom API Actions.</tspan></text><rect x="1286" y="573" width="448" height="152" rx="12" fill="white" stroke="#dce6e9"/><text x="1310" y="610" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#13283d"><tspan x="1310" dy="0">Add integrations, MCP tools and</tspan><tspan x="1310" dy="29.21">multi-step workflows to your</tspan><tspan x="1310" dy="29.21">agents.</tspan></text><text x="66" y="790" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#13283d"><tspan x="66" dy="0">Run and share</tspan></text><rect x="326" y="747" width="448" height="152" rx="12" fill="white" stroke="#dce6e9"/><text x="350" y="784" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#13283d"><tspan x="350" dy="0">Host the app and knowledge on your</tspan><tspan x="350" dy="29.21">infrastructure. Choose your</tspan><tspan x="350" dy="29.21">models.</tspan></text><rect x="806" y="747" width="448" height="152" rx="12" fill="white" stroke="#dce6e9"/><text x="830" y="784" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#13283d"><tspan x="830" dy="0">Use and share your GPT inside</tspan><tspan x="830" dy="29.21">ChatGPT, under your workspace</tspan><tspan x="830" dy="29.21">policies.</tspan></text><rect x="1286" y="747" width="448" height="152" rx="12" fill="white" stroke="#dce6e9"/><text x="1310" y="784" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#13283d"><tspan x="1310" dy="0">Use EU hosting or a dedicated</tspan><tspan x="1310" dy="29.21">deployment, depending on your</tspan><tspan x="1310" dy="29.21">plan.</tspan></text><rect x="64" y="969" width="1672" height="114" rx="16" fill="#e6edf0" stroke="none"/><text x="88" y="1009" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#51677a"><tspan x="88" dy="0">With Flow-Like, the project behind the chat is yours to adapt. Connect another source, change the workflow, and run it where</tspan><tspan x="88" dy="29.21">your team needs it.</tspan></text><text x="64" y="1120" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#51677a"><tspan x="64" dy="0">Sources: official OpenAI and Langdock documentation · Checked 30 September 2026</tspan></text></svg>