<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description"><title id="title">Automation that checks its work</title><desc id="description">Observation and explicit conditions guide the next action. Observe: Read the current page state. Act: Use a current target reference. Verify: Wait for an expected condition. Recover: Handle timeout deliberately. A timeout can leave the external outcome uncertain. Inspect before retrying.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#ee6c49" stroke-width="1.7"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#244559" flood-opacity=".07"/></filter></defs><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#f3f7f8" stroke="none"/><circle cx="1530" cy="80" r="250" fill="#ee6c49" opacity=".035"/><rect x="0" y="0" width="14" height="1000" rx="0" fill="#ee6c49" stroke="none"/><text x="64" y="68" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#13283d"><tspan x="64" dy="0">FLOW-LIKE</tspan></text><text x="245" y="68" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#51677a"><tspan x="245" dy="0">AUTOMATION</tspan></text><text x="1310" y="68" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#51677a"><tspan x="1310" dy="0">HOW IT WORKS</tspan></text><text x="64" y="161" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700" fill="#13283d"><tspan x="64" dy="0">Automation that checks its work</tspan></text><text x="66" y="252" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#51677a"><tspan x="66" dy="0">Observation and explicit conditions guide the next action.</tspan></text><g filter="url(#sha