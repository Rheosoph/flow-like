pected condition</tspan></text><g filter="url(#shadow)"><rect x="194" y="600" width="500" height="188" rx="20" fill="#ffffff" stroke="#dce6e9"/></g><rect x="216" y="622" width="42" height="30" rx="9" fill="#ee6c49" stroke="none"/><text x="223" y="644" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="white"><tspan x="223" dy="0">04</tspan></text><text x="216" y="686" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#13283d"><tspan x="216" dy="0">Recover</tspan></text><text x="216" y="727" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#51677a"><tspan x="216" dy="0">Handle timeout deliberately</tspan></text><path d="M714,442 L878,442" fill="none" stroke="#ee6c49" stroke-width="3" marker-end="url(#arrow)"/><path d="M1154,550 L1154,586" fill="none" stroke="#ee6c49" stroke-width="3" marker-end="url(#arrow)"/><path d="M878,694 L714,694" fill="none" stroke="#ee6c49" stroke-width="3" marker-end="url(#arrow)"/><path d="M444,588 L444,553" fill="none" stroke="#ee6c49" stroke-width="3" marker-end="url(#arrow)"/><rect x="64" y="836" width="1472" height="98" rx="16" fill="#e6edf0" stroke="none"/><text x="88" y="877" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#51677a"><tspan x="88" dy="0">A timeout can leave the external outcome uncertain. Inspect before retrying.</tspan></text><text x="64" y="971" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#51677a"><tspan x="64" dy="0">Flow-Like · Feature overview</tspan></text></svg>