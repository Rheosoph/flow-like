<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description"><title id="title">Start with containers</title><desc id="description">Published images and an included object store shorten the setup path. Published images: Pin the verified image set. Flow-Like services: Compose or Kubernetes. Bundled RustFS: Separate S3-compatible service. Persistent volumes: Configure storage and backups. RustFS runs as a separate service with persistent storage.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#366ddc" stroke-width="1.7"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#244559" flood-opacity=".07"/></filter></defs><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#f3f7f8" stroke="none"/><circle cx="1530" cy="80" r="250" fill="#366ddc" opacity=".035"/><rect x="0" y="0" width="14" height="1000" rx="0" fill="#366ddc" stroke="none"/><text x="64" y="68" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#13283d"><tspan x="64" dy="0">FLOW-LIKE</tspan></text><text x="245" y="68" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#51677a"><tspan x="245" dy="0">HOSTING &amp; INFRASTRUCTURE</tspan></text><text x="1310" y="68" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#51677a"><tspan x="1310" dy="0">HOW IT WORKS</tspan></text><text x="64" y="161" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700" fill="#13283d"><tspan x="64" dy="0">Start with containers</tspan></text><text x="66" y="252" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#51677a"><tspan x="66" dy="0">Published images and an included object store shorten the setup path.</tspan></text><rect x="64" y="338" width="718" height="442" rx="24" fill="#e8eff3" stroke="#c2d3dc"/><text x="92" y="378" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#366ddc"><tspan x="92" dy="0">Application services</tspan></text><g filter="url(#shadow)"><rect x="86" y="403" width="674" height="160" rx="20" fill="#ffffff" stroke="#dce6e9"/></g><rect x="108" y="425" width="42" height="30" rx="9" fill="#366ddc" stroke="none"/><text x="115" y="447" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="white"><tspan x="115" dy="0">01</tspan></text><text x="108" y="489" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#13283d"><tspan x="108" dy="0">Published images</tspan></text><text x="108" y="530" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#51677a"><tspan x="108" dy="0">Pin the verified image set</tspan></text><g filter="url(#shadow)"><rect x="86" y="581" width="674" height="160" rx="20" fill="#ffffff" stroke="#dce6e9"/></g><rect x="108" y="603" width="42" height="30" rx="9" fill="#366ddc" stroke="none"/><text x="115" y="625" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="white"><tspan x="115" dy="0">02</tspan></text><text x="108" y="667" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#13283d"><tspan x="108" dy="0">Flow-Like services</tspan></text><text x="108" y="708" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#51677a"><tspan x="108" dy="0">Compose or Kubernetes</tspan></text><rect x="816" y="338" width="718" height="442" rx="24" fill="#e8eff3" stroke="#c2d3dc"/><text x="844" y="378" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#366ddc"><tspan x="844" dy="0">Storage services</tspan></text><g filter="url(#shadow)"><rect x="838" y="403" width="674" height="160" rx="20" fill="#ffffff" s