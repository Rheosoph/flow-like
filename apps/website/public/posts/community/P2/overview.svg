<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description"><title id="title">Reuse the answer you have</title><desc id="description">Make the cache decision visible before expensive work begins. Read cache: Use a stable, scoped key. Hit: Return the stored value. Miss: Fetch, compute and write. Continue: Use the resulting value. Use an explicit cache-hit branch when you need to skip expensive work.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#366ddc" stroke-width="1.7"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#244559" flood-opacity=".07"/></filter></defs><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#f3f7f8" stroke="none"/><circle cx="1530" cy="80" r="250" fill="#366ddc" opacity=".035"/><rect x="0" y="0" width="14" height="1000" rx="0" fill="#366ddc" stroke="none"/><text x="64" y="68" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#13283d"><tspan x="64" dy="0">FLOW-LIKE</tspan></text><text x="245" y="68" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#51677a"><tspan x="245" dy="0">PERFORMANCE</tspan></text><text x="1310" y="68" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#51677a"><tspan x="1310" dy="0">HOW IT WORKS</tspan></text><text x="64" y="161" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700" fill="#13283d"><tspan x="64" dy="0">Reuse the answer you have</tspan></text><text x="66" y="252" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#51677a"><tspan x="66" dy="0">Make the cache decision visible before expensive work begins.</tspan></text><g filter="url(#shadow)"><rect x="64" y="464" width="320" height="195" rx="20" fill="#ffffff" stroke="#dce6e9"/></g><rect x="86" y="486" width="42" height="30" rx="9" fill="#366ddc" stroke="none"/><text x="93" y="508" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="white"><tspan x="93" dy="0">01</tspan></text><text x="86" y="550" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#13283d"><tspan x="86" dy="0">Read cache</tspan></text><text x="86" y="591" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#51677a"><tspan x="86" dy="0">Use a stable, scoped key</tspan></text><g filter="url(#shadow)"><rect x="566" y="350" width="445" height="187" rx="20" fill="#ffffff" stroke="#dce6e9"/></g><rect x="588" y="372" width="42" height="30" rx="9" fill="#366ddc" stroke="none"/><text x="595" y="394" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="white"><tspan x="595" dy="0">02</tspan></text><text x="588" y="436" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#13283d"><tspan x="588" dy="0">Hit</tspan></text><text x="588" y="477" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#51677a"><tspan x="588" dy="0">Return the stored value</tspan></text><g filter="url(#shadow)"><rect x="566" y="594" width="445" height="187" rx="20" fill="#ffffff" stroke="#dce6e9"/></g><rect x="588" y="616" width="42" height="30" rx="9" fill="#366ddc" stroke="none"/><text x="595" y="638" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="white"><tspan x="595" dy="0">03</tspan></text><text x="588" y="680" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#13283d"><tspan x="588" dy="0">Miss</tspan></text><text x="588" y="721" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#51677a"><tspan x="588" dy="0">Fetch, compute and write</tspan></text><g filter="url(#shadow)"><rect x="1216" y="464" width="320" height="195" rx="20" fill="#ffffff" stroke="#dce6e9"/></g><rect x="1238" y="486" width="42" height="30" rx="9" fill="#366ddc" stroke="none"/><text x="1245" y="508" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="white"><tspan x="1245" dy="0">04</tspan></text><text x="1238" y="550" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#13283d"><tspan x="1238" dy="0">Continue</tspan></text><text x="1238" y="591" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#51677a"><tspan x="1238" dy="0">Use the resulting value</tspan></text><path d="M390,560 C471,560 471,444 552,444" fill="none" stroke="#366ddc" stroke-width="3" marker-end="url(#arrow)"/><path d="M390,560 C471,560 471,688 552,688" fill="none" stroke="#366ddc" stroke-width="3" marker-end="url(#arrow)"/><path d="M1019,444 C1111.5,444 1111.5,560 1204,560" fill="none" stroke="#366ddc" stroke-width="3" marker-end="url(#arrow)"/><path d="M1019,688 C1111.5,688 1111.5,560 1204,560" fill="none" stroke="#366ddc" stroke-width="3" marker-end="url(#arrow)"/><rect x="64" y="836" width="1472" height="98" rx="16" fill="#e6edf0" stroke="none"/><text x="88" y="877" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#51677a"><tspan x="88" dy="0">Use an explicit cache-hit branch when you need to skip expensive work.</tspan></text><text x="64" y="971" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#51677a"><tspan x="64" dy="0">Flow-Like · Feature overview</tspan></text></svg>