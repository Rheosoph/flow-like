description = "Sandboxed Python execution via WASM Component Model. Two nodes: inline eval and project-based execution with dynamic PyPI package installation."
id = "com.flow-like.code-interpreter"
keywords = [
    "python",
    "interpreter",
    "sandbox",
    "eval",
    "code",
]
license = "MIT"
manifest_version = 1
name = "Code Interpreter"
repository = "https://github.com/Rheosoph/flow-like"
version = "0.1.0"
wasm_path = "build/interpreter.wasm"

[[authors]]
name = "Flow-Like"

[permissions]
memory = "intensive"
timeout = "extended"

# Capabilities (network, storage, database, models, ...) are declared on each
# node in code. The sandbox enforces those, and the registry derives the store's
# capability listing from them, so they are not repeated here. This file only
# sets resource tiers, the outbound host allowlist and OAuth scopes.
[permissions.network]
allowed_hosts = []
