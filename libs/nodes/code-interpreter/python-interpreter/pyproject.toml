[project]
name = "flow-like-code-interpreter"
version = "0.1.0"
description = "Flow-Like Code Interpreter — sandboxed Python execution via WASM Component Model"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "flow-like-wasm-sdk",
]

[tool.uv.sources]
flow-like-wasm-sdk = { path = "../../../../libs/wasm-sdk/wasm-sdk-python", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]
build = [
    "componentize-py>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
