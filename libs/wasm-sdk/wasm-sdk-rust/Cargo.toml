[package]
name = "flow-like-wasm-sdk"
version = "0.2.2"
edition = "2021"
description = "SDK for building Flow-Like WASM nodes (Component Model)"
license = "MIT"
repository = "https://github.com/TM9657/flow-like"

[workspace]

[lib]
crate-type = ["rlib"]

[dependencies]
wit-bindgen = "0.53"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
schemars = "1.2.1"
inventory = "0.3"
flow-like-wasm-sdk-macros = "0.2.1"
rig-core = { version = "0.29.0", default-features = false, optional = true }
futures = { version = "0.3", optional = true }

[features]
default = []
rig = ["dep:rig-core", "dep:futures"]
