[package]
name = "flow-like-wasm-sdk"
version = "0.4.0"
edition = "2021"
description = "SDK for building Flow-Like WASM nodes (Component Model)"
license = "MIT"
repository = "https://github.com/Rheosoph/flow-like"

[workspace]

[lib]
crate-type = ["rlib"]

[dependencies]
wit-bindgen = "0.53"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
schemars = { version = "1.2.1", features = ["preserve_order"] }
base64 = "0.22"
inventory = "0.3"
flow-like-wasm-sdk-macros = "0.3.7"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rig = { package = "rig-core", version = "0.38.2", default-features = false, optional = true }
futures = { version = "0.3", optional = true }

[features]
default = []
rig = ["dep:rig", "dep:futures"]
